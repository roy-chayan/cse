<!-- Runs before the page draws: the reader's light/dark choice, and the daily password lock.
     If today's password hasn't been given in this browser, <html> gets class "locked" and only the password screen shows. -->
<script>
(function () {
  var d = document.documentElement;
  // Today's date in Bangladesh, e.g. "2026-11-04". The password and the daily lock both follow it.
  window.khataToday = function () {
    try {
      var p = {};
      new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Dhaka", year: "numeric", month: "2-digit", day: "2-digit" })
        .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
      return p.year + "-" + p.month + "-" + p.day;
    } catch (e) {
      var n = new Date();
      return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
    }
  };
  try { var t = localStorage.getItem("khata_theme"); if (t === "dark" || t === "light") d.dataset.theme = t; } catch (e) {}
  var open = false;
  try { open = localStorage.getItem("khata_open_day") === khataToday(); } catch (e) {}
  if (!open) d.classList.add("locked");
})();
</script>
