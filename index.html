            <path class="gb" d="M150 20H168A20 20 0 0 1 168 60H150Z"/>

            <foreignObject x="216" y="31" width="80" height="34" overflow="visible"><div class="flab">F = A(B+C)</div></foreignObject>
          </svg>
        </figure>
        <h4 class="sub-h" id="pp6-4"><span>৬ষ্ঠ · ২০০৯</span><span>প্রশ্ন ৪ (অথবা): A + B + C − BC</span></h4>
        <p class="prose">বুলিয়ান অ্যালজেবরায় বিয়োগ বলে কিছু নেই, তাই ছাপা “−” চিহ্নটি ছাপার ভুল। বাকি সব চিহ্ন যোগ বলে এটিকেও যোগ ধরা হলো: Y = A + B + C + BC। খাতায় শুরুতে এই কথাটি এক লাইনে লিখে দিন।</p>
        <figure class="fig eqfig">
          <svg viewBox="0 0 300 150" width="345" role="img" aria-label="লজিক সার্কিট: B ও C একটি AND-এ; A, B, C ও সেই ফল একটি চার-ইনপুট OR-এ গিয়ে Y দেয়।">
            <text x="26" y="12" text-anchor="start">A</text>
            <text x="42" y="12" text-anchor="start">B</text>
            <text x="58" y="12" text-anchor="start">C</text>
            <path class="w" d="M30 18V36M46 18V110M62 18V130M30 36H187M46 52H192.2M62 68H192.2M46 110H91M62 130H91M128 120H150V84H187M232 60H256"/>
            <path class="gb" d="M90 100H108A20 20 0 0 1 108 140H90Z"/>
            <path class="gb" d="M180 26Q203.8 60 180 94Q215.4 94 232 60Q215.4 26 180 26Z"/>
            <circle class="j" cx="30" cy="36" r="2.6"/>
            <circle class="j" cx="46" cy="52" r="2.6"/>
            <circle class="j" cx="62" cy="68" r="2.6"/>
            <circle class="j" cx="46" cy="110" r="2.6"/>
            <circle class="j" cx="62" cy="130" r="2.6"/>
            <foreignObject x="130" y="102" width="30" height="34" overflow="visible"><div class="flab">BC</div></foreignObject>
            <foreignObject x="238" y="42" width="20" height="34" overflow="visible"><div class="flab">Y</div></foreignObject>
            <foreignObject x="186" y="98" width="110" height="34" overflow="visible"><div class="flab">Y = A+B+C+BC</div></foreignObject>
          </svg>
        </figure>
        <ul class="eqs">
          <li><span>Y = A + B + C + BC</span><small>সার্কিটের আউটপুট</small></li>
          <li><span>= A + B + C(1 + B)</span><small>সাধারণ উৎপাদক C</small></li>
          <li><span>= A + B + C</span><small>1 + B = 1</small></li>
        </ul>
        <p class="final"><b>সরল রূপ</b>Y = A + B + C</p>
        <p class="prose">সরল রূপে একটি তিন-ইনপুট OR-ই যথেষ্ট। আর “−”-কে গুণ (·) ধরলে: A + B + C·BC = A + B + BC = A + B(1 + C) = A + B।</p>
        <h4 class="sub-h" id="pp6-5"><span>৬ষ্ঠ · ২০০৯</span><span>প্রশ্ন ৫ (অথবা): ABC + ABC + ABC + ABC</span></h4>
        <p class="prose">ছাপায় চারটি পদের কোনোটির ওপর বার দেখা যায় না। যেভাবে ছাপা সেভাবে পড়লে:</p>
        <ul class="eqs">
          <li><span>Y = ABC + ABC + ABC + ABC</span><small>প্রশ্নের সমীকরণ</small></li>
          <li><span>= ABC</span><small>X + X = X</small></li>
        </ul>
        <p class="final"><b>ফল</b>Y = ABC</p>
        <figure class="fig eqfig">
          <svg viewBox="0 0 210 78" width="241" role="img" aria-label="লজিক সার্কিট: A, B, C একটি তিন-ইনপুট AND গেটে গিয়ে Y দেয়।">
            <text x="4" y="27" text-anchor="start">A</text>
            <text x="4" y="44" text-anchor="start">B</text>
            <text x="4" y="61" text-anchor="start">C</text>
            <path class="w" d="M16 23H61M16 40H61M16 57H61M105 40H130"/>
            <path class="gb" d="M60 13H78A27 27 0 0 1 78 67H60Z"/>
            <foreignObject x="136" y="31" width="70" height="34" overflow="visible"><div class="flab">Y = ABC</div></foreignObject>
          </svg>
        </figure>
        <p class="prose">বারসহ এ প্রশ্নের প্রচলিত রূপ <span class="ov">A</span>BC + A<span class="ov">B</span>C + AB<span class="ov">C</span> + ABC হলে উত্তর AB + BC + CA; পুরো সমাধান ও সার্কিট ওপরের <a href="#/note/logic-gates/ex-majority">৬.২-এ</a>।</p>
        <h4 class="sub-h" id="pp5-3"><span>৫ম · ২০০৮</span><span>প্রশ্ন ৩: X = <span class="ov">A + B + <span class="ov">C</span></span>·(<span class="ov">B</span>C)</span></h4>
        <p class="prose">চাওয়া হয়েছে: সরল করে বর্তনী। ছাপায় শুরুর X-এর পরে “=” নেই, আর বন্ধনী এলোমেলো; রাশিটি X = <span class="ov">A + B + <span class="ov">C</span></span>·<span class="ov">B</span>C ধরা হলো। ৪র্থ পরীক্ষায় (প্রশ্ন ৪, অথবা) এই রাশিটিই <span class="ov">A</span>·<span class="ov">B</span>·C-এর সমান, তা সত্যক সারণিতে প্রমাণ করতে বলা হয়েছিল।</p>
        <ul class="eqs">
          <li><span>X = <span class="ov">A + B + <span class="ov">C</span></span>·<span class="ov">B</span>C</span><small>প্রশ্নের সমীকরণ</small></li>
          <li><span>= <span class="ov">A</span>·<span class="ov">B</span>·<span class="ov"><span class="ov">C</span></span>·<span class="ov">B</span>C</span><small>ডি মরগান: <span class="ov">X + Y + Z</span> = <span class="ov">X</span>·<span class="ov">Y</span>·<span class="ov">Z</span></small></li>
          <li><span>= <span class="ov">A</span>·<span class="ov">B</span>·C·<span class="ov">B</span>·C</span><small>দ্বৈত পূরক</small></li>
          <li><span>= <span class="ov">A</span>·<span class="ov">B</span>·C</span><small>X·X = X</small></li>
        </ul>
        <p class="final"><b>ফল</b>X = <span class="ov">A</span>·<span class="ov">B</span>·C</p>
        <figure class="fig eqfig">
          <svg viewBox="0 0 300 125" width="345" role="img" aria-label="লজিক সার্কিট: A একটি NOT দিয়ে A-বার, B একটি NOT দিয়ে B-বার; A-বার, B-বার ও C একটি তিন-ইনপুট AND-এ গিয়ে X দেয়।">
            <text x="4" y="34" text-anchor="start">A</text>
            <text x="4" y="74" text-anchor="start">B</text>
            <text x="4" y="114" text-anchor="start">C</text>
            <path class="w" d="M16 30H40M16 70H40M74 30H110V53H151M74 70H151M16 110H110V87H151M195 70H215"/>
            <path class="gb" d="M40 18L66 30L40 42Z"/><circle class="gb" cx="70" cy="30" r="4"/>
            <path class="gb" d="M40 58L66 70L40 82Z"/><circle class="gb" cx="70" cy="70" r="4"/>
            <path class="gb" d="M150 43H168A27 27 0 0 1 168 97H150Z"/>
            <foreignObject x="77" y="12" width="30" height="34" overflow="visible"><div class="flab"><span class="ov">A</span></div></foreignObject>
            <foreignObject x="77" y="52" width="30" height="34" overflow="visible"><div class="flab"><span class="ov">B</span></div></foreignObject>
            <foreignObject x="221" y="61" width="76" height="34" overflow="visible"><div class="flab">X = <span class="ov">A</span>·<span class="ov">B</span>·C</div></foreignObject>
          </svg>
        </figure>
        <p class="prose">সত্যক সারণিতে প্রমাণ (৪র্থ পরীক্ষা): শেষ দুই কলাম প্রতিটি সারিতে সমান।</p>

          <tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>

          <tr><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>

          <tr><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
          <tr><td>1</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
        </tbody></table>
        <h4 class="sub-h" id="pp5-3o"><span>৫ম · ২০০৮</span><span>প্রশ্ন ৩ (অথবা) ক: দুটি সরলীকরণ</span></h4>
        <p class="prose">চাওয়া হয়েছে শুধু বুলিয়ান অ্যালজেবরায় সরল করা, সার্কিট নয়।</p>
        <p class="prose">(i) <span class="ov">(M + <span class="ov">N</span>)(<span class="ov">M</span> + N)</span></p>
        <ul class="eqs">
          <li><span>Y = <span class="ov">(M + <span class="ov">N</span>)(<span class="ov">M</span> + N)</span></span><small>প্রশ্নের সমীকরণ</small></li>
          <li><span>= <span class="ov">M + <span class="ov">N</span></span> + <span class="ov"><span class="ov">M</span> + N</span></span><small>ডি মরগান: <span class="ov">X·Z</span> = <span class="ov">X</span> + <span class="ov">Z</span></small></li>
          <li><span>= <span class="ov">M</span>·N + M·<span class="ov">N</span></span><small>ডি মরগান, দ্বৈত পূরক</small></li>
        </ul>
        <p class="final"><b>ফল</b>Y = <span class="ov">M</span>N + M<span class="ov">N</span> = M ⊕ N (XOR)</p>
        <p class="prose">(ii) <span class="ov">(<span class="ov">A</span> + C)(B + <span class="ov">D</span>)</span></p>
        <ul class="eqs">
          <li><span>Y = <span class="ov">(<span class="ov">A</span> + C)(B + <span class="ov">D</span>)</span></span><small>প্রশ্নের সমীকরণ</small></li>
          <li><span>= <span class="ov"><span class="ov">A</span> + C</span> + <span class="ov">B + <span class="ov">D</span></span></span><small>ডি মরগান: <span class="ov">X·Z</span> = <span class="ov">X</span> + <span class="ov">Z</span></small></li>
          <li><span>= A·<span class="ov">C</span> + <span class="ov">B</span>·D</span><small>ডি মরগান, দ্বৈত পূরক</small></li>
        </ul>
        <p class="final"><b>ফল</b>Y = A<span class="ov">C</span> + <span class="ov">B</span>D</p>
        <h4 class="sub-h" id="pp5-4"><span>৫ম · ২০০৮</span><span>প্রশ্ন ৪: প্রমাণ <span class="ov">A</span>BC + A<span class="ov">B</span>C + AB<span class="ov">C</span> + ABC = AB + BC + CA</span></h4>
        <p class="prose">হুবহু ১৮তম পরীক্ষার ১০ নম্বর প্রশ্নের রাশি; ধাপে ধাপে প্রমাণ ওপরের <a href="#/note/logic-gates/ex-majority">৬.২-এ</a>। প্রমাণের প্রশ্নে শেষ লাইনে লিখুন: “বাম পক্ষ = ডান পক্ষ, প্রমাণিত।”</p>
        <h4 class="sub-h" id="pp4-4"><span>৪র্থ · ২০০৭</span><span>প্রশ্ন ৪: <span class="ov">A + <span class="ov">A</span>·<span class="ov">B</span></span>·AB + C</span></h4>
        <p class="prose">চাওয়া হয়েছে: বর্তনী। ছাপায় বন্ধনী মেলে না; বার A + <span class="ov">A</span>·<span class="ov">B</span>-এর ওপর ধরে রাশিটি Y = <span class="ov">A + <span class="ov">A</span>·<span class="ov">B</span></span>·AB + C পড়া হলো। বারসহ OR-এর জায়গায় একটি NOR গেট বসানো হয়েছে।</p>

          <li><span>Y = <span class="ov">A + <span class="ov">A</span>·<span class="ov">B</span></span>·AB + C</span><small>সার্কিটের আউটপুট</small></li>
          <li><span>= <span class="ov">A</span>·<span class="ov"><span class="ov">A</span>·<span class="ov">B</span></span>·AB + C</span><small>ডি মরগান: <span class="ov">X + Z</span> = <span class="ov">X</span>·<span class="ov">Z</span></small></li>
          <li><span>= (<span class="ov">A</span>·A)·<span class="ov"><span class="ov">A</span>·<span class="ov">B</span></span>·B + C</span><small>বিনিময়</small></li>
          <li><span>= 0 + C = C</span><small>X·<span class="ov">X</span> = 0</small></li>
        </ul>
        <p class="final"><b>সরল রূপ</b>Y = C</p>
        <p class="prose">সার্কিটের বাঁয়ের পুরো অংশের ফল সবসময় ০, কারণ সেখানে <span class="ov">A</span> আর A একসঙ্গে গুণ হয়। তাই আউটপুট শুধু C; সরল রূপে কোনো গেটই লাগে না, C-ই আউটপুট।</p>
        <h4 class="sub-h" id="pp3-4"><span>৩য় · ২০০৬</span><span>প্রশ্ন ৪: (A + B)<span class="ov">C</span> + <span class="ov">A</span>C</span></h4>
        <p class="prose">চাওয়া হয়েছে: লজিক গেট দিয়ে বাস্তবায়ন। লাগে দুটি NOT, দুটি OR আর দুটি AND।</p>

        <ul class="eqs">
          <li><span>Y = (A + B)<span class="ov">C</span> + <span class="ov">A</span>C</span><small>সার্কিটের আউটপুট</small></li>
          <li><span>= A<span class="ov">C</span> + B<span class="ov">C</span> + <span class="ov">A</span>C</span><small>গুণ ছড়িয়ে</small></li>
          <li><span>= (A ⊕ C) + B<span class="ov">C</span></span><small>A<span class="ov">C</span> + <span class="ov">A</span>C = A ⊕ C</small></li>

        <p class="prose">এর চেয়ে কম পদে লেখা যায় না; প্রশ্নে শুধু বাস্তবায়ন চাওয়া, তাই সার্কিটটিই মূল উত্তর।</p>

        <h3 class="sub"><span>৬.৬</span>হাফ অ্যাডার ও ফুল অ্যাডার</h3>
        <p class="prose">কম্পিউটার যোগ করে লজিক গেট দিয়ে তৈরি যোগকারী বর্তনীতে। দুটি বিট যোগ করলে দুটি ফল আসে: যোগফল (Sum, S) আর হাতে থাকা (Carry)। যেমন বাইনারিতে 1 + 1 = 10: যোগফল 0, হাতে 1।</p>
        <h4 class="sub-h" id="half-adder"><span>ক</span>হাফ অ্যাডার (অর্ধযোগকারী)</h4>
        <p class="prose">দুটি বিট A ও B যোগ করে। যোগফল ১ হয় ঠিক একটি ইনপুট ১ হলে, তাই S = A ⊕ B; হাতে ১ থাকে দুটিই ১ হলে, তাই C = A·B। লাগে একটি XOR আর একটি AND।</p>

        <p class="prose">শেষ সারিতে 1 + 1 = 10: S = 0, C = 1। হাফ অ্যাডার আগের ঘর থেকে আসা ক্যারি নিতে পারে না, তাই একে “অর্ধেক” যোগকারী বলে।</p>
        <h4 class="sub-h" id="full-adder"><span>খ</span>ফুল অ্যাডার (পূর্ণযোগকারী)</h4>
        <p class="prose">তিনটি বিট যোগ করে: A, B আর আগের ঘর থেকে আসা ক্যারি C<sub>in</sub>। দুটি হাফ অ্যাডার আর একটি OR দিয়ে তৈরি: প্রথমটি A ও B যোগ করে, দ্বিতীয়টি তার যোগফলের সঙ্গে C<sub>in</sub> যোগ করে, আর দুটির ক্যারি OR-এ গিয়ে C<sub>out</sub> হয়। মোট দুটি XOR, দুটি AND আর একটি OR।</p>

          <figcaption>চিত্র: ব্যবহারকারী ও হার্ডওয়্যারের মাঝে অপারেটিং সিস্টেম</figcaption>
        </figure>
        <h3 class="sub" id="ansi"><span>১.১</span>ANSI-র সংজ্ঞা</h3>
        <p class="defn"><b>ANSI (American National Standards Institute)</b>“Operating system is a software which controls the execution of computer programs and which may provide scheduling, debugging, input-output control, accounting, compilation, storage assignment, data management and related services.”</p>
        <p class="prose">অর্থাৎ অপারেটিং সিস্টেম এমন সফটওয়্যার, যা প্রোগ্রামগুলোর চালনা নিয়ন্ত্রণ করে এবং কাজের সময়সূচি নির্ধারণ, ত্রুটি সংশোধন, ইনপুট-আউটপুট নিয়ন্ত্রণ, হিসাব রাখা, কম্পাইল করা, স্মৃতিতে জায়গা দেওয়া, উপাত্ত ব্যবস্থাপনা ও এ-সংক্রান্ত সেবা দেয়।</p>
        <h3 class="sub"><span>১.২</span>বৈশিষ্ট্য</h3>
        <ul class="pts">
          <li>হার্ডওয়্যার ও ব্যবহারকারীর মধ্যে সেতু; CPU, স্মৃতি, ডিস্ক ও যন্ত্রসহ সব রিসোর্স পরিচালনা করে।</li>
          <li>কম্পিউটার চালু হলে প্রথমে স্মৃতিতে আসে এবং বন্ধ হওয়া পর্যন্ত থাকে।</li>
          <li>ব্যবহারকারীকে কমান্ড লাইন বা চিত্রভিত্তিক ইন্টারফেস দেয়।</li>
          <li>একসঙ্গে অনেক প্রোগ্রাম (মাল্টিটাস্কিং) ও অনেক ব্যবহারকারী সামলাতে পারে।</li>
          <li>ফাইল ও ফোল্ডার গুছিয়ে রাখে; পাসওয়ার্ড ও অনুমতি দিয়ে নিরাপত্তা দেয়।</li>
          <li>ত্রুটি শনাক্ত করে বার্তা দেয়; অ্যাপ্লিকেশনকে হার্ডওয়্যারের খুঁটিনাটি থেকে আড়াল রাখে।</li>
        </ul>
        <h3 class="sub"><span>১.৩</span>গুরুত্ব</h3>
        <ul class="pts">
          <li>অপারেটিং সিস্টেম ছাড়া কম্পিউটার চালু করে কোনো কাজ করা যায় না।</li>
          <li>হার্ডওয়্যারের জটিলতা না জেনেই সহজে কাজ করার পরিবেশ দেয়।</li>
          <li>প্রতিটি অ্যাপ্লিকেশন এর ওপর চলে; প্রোগ্রামারকে প্রতিটি যন্ত্রের জন্য আলাদা নির্দেশ লিখতে হয় না।</li>
          <li>CPU, স্মৃতি ও যন্ত্রের সর্বোচ্চ ও সুষম ব্যবহার নিশ্চিত করে।</li>
          <li>উপাত্তের নিরাপত্তা দেয় এবং ত্রুটি সামলায়।</li>
        </ul>
        <h3 class="sub" id="os-org"><span>১.৪</span>স্তরভিত্তিক সংগঠন: কার্নেল ও শেল</h3>
        <p class="prose">অপারেটিং সিস্টেম পেঁয়াজের খোসার মতো কয়েকটি স্তরে সাজানো। কেন্দ্রে হার্ডওয়্যার, তাকে ঘিরে কার্নেল, তারপর শেল, আর বাইরে অ্যাপ্লিকেশন প্রোগ্রাম; ব্যবহারকারী বাইরের স্তর দিয়ে কাজ করেন।</p>
        <figure class="fig flow onion">
          <svg viewBox="0 0 400 400" role="img" aria-label="অপারেটিং সিস্টেমের সংগঠন: কেন্দ্রে হার্ডওয়্যার, তাকে ঘিরে কার্নেল, তারপর শেল, বাইরে অ্যাপ্লিকেশন প্রোগ্রাম; ব্যবহারকারী বাইরের স্তর দিয়ে কাজ করেন।">

          <figcaption>চিত্র: অপারেটিং সিস্টেমের স্তরভিত্তিক সংগঠন</figcaption>
        </figure>
        <ul class="pts">
          <li><b>কার্নেল (Kernel):</b> অপারেটিং সিস্টেমের মূল অংশ; সরাসরি হার্ডওয়্যারের সঙ্গে যোগাযোগ রাখে। প্রসেস, স্মৃতি, ফাইল ও যন্ত্র ব্যবস্থাপনা এখানেই হয়। অন্য প্রোগ্রাম কার্নেলের কাছে সেবা চায় সিস্টেম কলের মাধ্যমে।</li>
          <li><b>শেল (Shell):</b> ব্যবহারকারী ও কার্নেলের মাঝের দোভাষী বা সেতু: কমান্ড বা ক্লিক বুঝে কার্নেলকে জানায়, ফল দেখায়। এটি কমান্ড লাইন (DOS-এর COMMAND.COM, Linux-এর bash) বা চিত্রভিত্তিক হতে পারে।</li>
          <li><b>অ্যাপ্লিকেশন ও ব্যবহারকারী:</b> ওয়ার্ড প্রসেসর, ব্রাউজারের মতো প্রোগ্রাম অপারেটিং সিস্টেমের ওপর চলে; ব্যবহারকারীকে হার্ডওয়্যারের খুঁটিনাটি জানতে হয় না।</li>
        </ul>
        <h3 class="sub" id="org-ctrl"><span>১.৫</span>নিয়ন্ত্রণ প্রোগ্রাম ও প্রক্রিয়াকরণ প্রোগ্রাম</h3>
        <p class="prose">পুরোনো পাঠ্যবইয়ে এবং ৬ষ্ঠ ও ৪র্থ পরীক্ষায় সংগঠন চাওয়া হয়েছে এভাবে: অপারেটিং সিস্টেম দুই দল প্রোগ্রামের সমষ্টি। “ছকের মাধ্যমে সংগঠন” চাইলে এই গাছটি আঁকুন।</p>
        <figure class="fig">
          <ul class="tree">
            <li><span class="t-root">অপারেটিং সিস্টেম</span>
              <ul>
                <li><span>নিয়ন্ত্রণ প্রোগ্রাম <small>কম্পিউটারের কাজ তদারকি করে</small></span><span class="leaf">সুপারভাইজার প্রোগ্রাম · ইনপুট-আউটপুট নিয়ন্ত্রণ প্রোগ্রাম (IOCS) · জব কন্ট্রোল প্রোগ্রাম</span></li>
                <li><span>প্রক্রিয়াকরণ প্রোগ্রাম <small>কাজ সম্পাদনে সাহায্য করে</small></span><span class="leaf">ভাষা অনুবাদক · ইউটিলিটি বা সার্ভিস প্রোগ্রাম · লাইব্রেরি প্রোগ্রাম</span></li>
              </ul>
            </li>
          </ul>
          <figcaption>চিত্র: অপারেটিং সিস্টেমের সংগঠন: নিয়ন্ত্রণ ও প্রক্রিয়াকরণ প্রোগ্রাম</figcaption>
        </figure>
        <ul class="pts">
          <li><b>সুপারভাইজার প্রোগ্রাম:</b> নিয়ন্ত্রণ প্রোগ্রামগুলোর প্রধান; একে এক্সিকিউটিভ বা মনিটর প্রোগ্রামও বলে। কম্পিউটার চালু থাকা পুরো সময় প্রধান স্মৃতিতে থাকে, অন্য প্রোগ্রামগুলোকে প্রয়োজনমতো সহায়ক স্মৃতি থেকে ডেকে আনে, কাজের ক্রম ঠিক করে এবং পুরো কম্পিউটারের কাজ তদারকি করে। আধুনিক অপারেটিং সিস্টেমের কার্নেল এরই উত্তরসূরি।</li>
          <li><b>ইনপুট-আউটপুট নিয়ন্ত্রণ প্রোগ্রাম (IOCS):</b> ইনপুট ও আউটপুট যন্ত্রের সঙ্গে উপাত্ত আদান-প্রদান এবং ফাইল পড়া-লেখা নিয়ন্ত্রণ করে।</li>
          <li><b>জব কন্ট্রোল প্রোগ্রাম:</b> কাজগুলোর (জব) ক্রম ও প্রয়োজনীয় রিসোর্স ঠিক করে; একটি কাজ শেষ হলে পরেরটি শুরু করে।</li>
          <li><b>ভাষা অনুবাদক:</b> অ্যাসেম্বলার, কম্পাইলার ও ইন্টারপ্রেটার; প্রোগ্রামকে মেশিন ভাষায় রূপান্তর করে।</li>
          <li><b>ইউটিলিটি বা সার্ভিস প্রোগ্রাম:</b> প্রায়ই দরকারি কাজ: সাজানো (সর্টিং), ফাইল কপি, ডিস্ক ফরম্যাট, ব্যাকআপ।</li>
          <li><b>লাইব্রেরি প্রোগ্রাম:</b> বারবার লাগে এমন তৈরি করা প্রোগ্রাম বা ফাংশনের সংগ্রহ (যেমন বর্গমূল বা লগ হিসাব), যা যেকোনো প্রোগ্রাম ডেকে ব্যবহার করতে পারে।</li>
        </ul>
        <p class="tip"><b>কোনটি লিখবেন:</b> “সংগঠন বর্ণনা করুন” প্রশ্নে স্তরের চিত্র (১.৪) আর নিয়ন্ত্রণ-প্রক্রিয়াকরণের ছক (১.৫) দুটিই চলে; সময় থাকলে দুটিই দিন।</p>

    <section class="blk" id="func" data-topic="func" data-short="কার্যাবলি">
      <p class="blk-no">অংশ ২<small>সিলেবাস ঙ.১</small></p>
      <div class="body">
        <h2>অপারেটিং সিস্টেমের কার্যাবলি</h2>
        <p class="prose">অপারেটিং সিস্টেমের প্রতিটি কাজই কোনো না কোনো রিসোর্সের ব্যবস্থাপনা: CPU, স্মৃতি, ফাইল, যন্ত্র, আর ব্যবহারকারী।</p>
        <h3 class="sub" id="os-func"><span>২.১</span>কার্যাবলি এক নজরে</h3>
        <figure class="fig">
          <ul class="tree">
            <li><span class="t-root">অপারেটিং সিস্টেমের কাজ</span>
              <ul>
                <li><span>প্রসেস ব্যবস্থাপনা</span><span class="leaf">প্রোগ্রাম চালু ও বন্ধ করা; কোন প্রোগ্রাম কখন কতক্ষণ CPU পাবে (শিডিউলিং)</span></li>
                <li><span>মেমোরি ব্যবস্থাপনা</span><span class="leaf">কোন প্রোগ্রাম স্মৃতির কোথায় কতটুকু জায়গা পাবে; কাজ শেষে ফেরত; ভার্চুয়াল মেমোরি</span></li>
                <li><span>ফাইল ব্যবস্থাপনা</span><span class="leaf">ফাইল ও ফোল্ডার তৈরি, কপি, সরানো, নাম বদল, মোছা ও খোঁজা</span></li>
                <li><span>ডিভাইস বা ইনপুট-আউটপুট ব্যবস্থাপনা</span><span class="leaf">ড্রাইভারের মাধ্যমে কিবোর্ড, মাউস, প্রিন্টার, ডিস্ক নিয়ন্ত্রণ</span></li>
                <li><span>নিরাপত্তা ব্যবস্থাপনা</span><span class="leaf">লগইন, পাসওয়ার্ড ও ব্যবহারের অনুমতি</span></li>
                <li><span>ব্যবহারকারী ইন্টারফেস</span><span class="leaf">কমান্ড লাইন (CUI) বা চিত্রভিত্তিক (GUI) পরিবেশ</span></li>
                <li><span>ত্রুটি শনাক্তকরণ</span><span class="leaf">হার্ডওয়্যার বা প্রোগ্রামের ত্রুটি ধরে বার্তা দেখানো</span></li>
                <li><span>বুটিং, নেটওয়ার্ক ও হিসাব রাখা</span><span class="leaf">কম্পিউটার চালু করা; অন্য কম্পিউটারের সঙ্গে যোগাযোগ; কে কতক্ষণ কোন রিসোর্স ব্যবহার করল</span></li>
              </ul>
            </li>
          </ul>
          <figcaption>চিত্র: অপারেটিং সিস্টেমের কার্যাবলি এক নজরে</figcaption>

        <h3 class="sub"><span>২.২</span>চারটি প্রধান ব্যবস্থাপনা, উদাহরণসহ</h3>
        <ul class="pts">
          <li><b>প্রসেস ব্যবস্থাপনা:</b> গান শুনতে শুনতে টাইপ করলে অপারেটিং সিস্টেম দুটি প্রোগ্রামকে পালা করে CPU দেয়। চলমান প্রোগ্রামকে প্রসেস বলে; Windows-এর Task Manager-এ সেগুলো দেখা যায়।</li>
          <li><b>মেমোরি ব্যবস্থাপনা:</b> প্রোগ্রাম খুললে RAM-এ জায়গা দেয়, বন্ধ করলে ফেরত নেয়, যাতে এক প্রোগ্রাম আরেকটির জায়গায় না ঢোকে। RAM কম পড়লে হার্ডডিস্কের একটি অংশকে ভার্চুয়াল মেমোরি হিসেবে ব্যবহার করে।</li>
          <li><b>ফাইল ব্যবস্থাপনা:</b> ডিস্কে ফাইল কোথায় আছে তার হিসাব রাখে, ফোল্ডারের গাছের মতো গঠনে সাজায়, আর কে কোন ফাইল পড়তে বা বদলাতে পারবে তা ঠিক করে।</li>
          <li><b>ডিভাইস ব্যবস্থাপনা:</b> প্রতিটি যন্ত্রের সঙ্গে তার ড্রাইভারের মাধ্যমে কথা বলে। কয়েকটি প্রিন্টের কাজ একসঙ্গে এলে সেগুলো ডিস্কে সারি করে রেখে একটি একটি করে প্রিন্টারে পাঠায় (স্পুলিং)।</li>
        </ul>

        <h3 class="sub" id="batch"><span>৩.২</span>ব্যাচ প্রসেসিং অপারেটিং সিস্টেম</h3>
        <p class="defn"><b>সংজ্ঞা</b>যে অপারেটিং সিস্টেমে একই ধরনের অনেকগুলো কাজ (জব) জমিয়ে একটি ব্যাচ বা গুচ্ছ বানানো হয় এবং কম্পিউটার ব্যবহারকারীর কোনো হস্তক্ষেপ ছাড়াই একটির পর একটি কাজ শেষ করে, তাকে ব্যাচ প্রসেসিং অপারেটিং সিস্টেম বলে।</p>
        <ol class="chain" aria-label="ব্যাচ প্রসেসিং: জব জমা, অপারেটর ব্যাচ সাজান, CPU একটির পর একটি চালায়, শেষে ফল প্রিন্ট">
          <li><b>জব জমা</b><small>প্রোগ্রাম + উপাত্ত</small></li>
          <li><b>ব্যাচ</b><small>অপারেটর সাজান</small></li>
          <li><b>CPU</b><small>একটির পর একটি</small></li>
          <li><b>ফল</b><small>ব্যাচ শেষে প্রিন্ট</small></li>
        </ol>
        <ul class="pts">
          <li><b>কার্যপদ্ধতি:</b> ব্যবহারকারী কাজ জমা দেন; অপারেটর একই ধরনের কাজ এক ব্যাচে সাজিয়ে কম্পিউটারে দেন। চলার সময় ব্যবহারকারীর সঙ্গে কোনো যোগাযোগ থাকে না; ফল পাওয়া যায় পুরো ব্যাচ শেষে। টাইম স্লাইস নেই: একটি কাজ শেষ হলে পরেরটি।</li>
          <li><b>সুবিধা:</b> একই ধরনের বড় ও পুনরাবৃত্ত কাজে দক্ষ; মানুষের হস্তক্ষেপ লাগে না; CPU কম অলস থাকে।</li>
          <li><b>অসুবিধা:</b> ফল পেতে দেরি; মাঝপথে কিছু বদলানো যায় না; একটি কাজে ত্রুটি হলে পরের কাজ আটকে যেতে পারে।</li>
          <li><b>উদাহরণ:</b> মাসশেষে বেতন, বিদ্যুৎ ও পানির বিল, পরীক্ষার ফল তৈরি।</li>
        </ul>
        <h3 class="sub" id="realtime"><span>৩.৩</span>রিয়েল টাইম অপারেটিং সিস্টেম</h3>
        <p class="defn"><b>সংজ্ঞা</b>যে অপারেটিং সিস্টেম ইনপুট পাওয়ার পর একটি নির্দিষ্ট ও খুব ছোট সময়সীমার মধ্যে সাড়া দিতে বাধ্য, তাকে রিয়েল টাইম অপারেটিং সিস্টেম বলে। এখানে দেরি মানেই ব্যর্থতা।</p>
        <ul class="pts">
          <li><b>হার্ড রিয়েল টাইম:</b> সময়সীমা পার হলে বিপদ: ক্ষেপণাস্ত্র ও বিমান নিয়ন্ত্রণ, গাড়ির এয়ারব্যাগ, হাসপাতালের ICU-র যন্ত্র।</li>
          <li><b>সফট রিয়েল টাইম:</b> মাঝে মাঝে সামান্য দেরি সহ্য করা যায়: ভিডিও কল, অনলাইন গেম।</li>
          <li><b>ব্যবহার:</b> শিল্প-কারখানার রোবট, ট্রাফিক সিগন্যাল, বৈজ্ঞানিক পরীক্ষা।</li>
        </ul>
        <h3 class="sub" id="distributed"><span>৩.৪</span>ডিস্ট্রিবিউটেড অপারেটিং সিস্টেম</h3>
        <p class="defn"><b>সংজ্ঞা</b>যে অপারেটিং সিস্টেম নেটওয়ার্কে যুক্ত একাধিক স্বাধীন কম্পিউটারকে (প্রত্যেকের নিজস্ব CPU ও স্মৃতি) এমনভাবে পরিচালনা করে যে ব্যবহারকারীর কাছে সবগুলো মিলে একটি কম্পিউটার মনে হয়, তাকে ডিস্ট্রিবিউটেড অপারেটিং সিস্টেম বলে।</p>

        <ul class="pts">
          <li><b>রিসোর্স ভাগাভাগি:</b> এক কম্পিউটারের ব্যবহারকারী অন্য কম্পিউটারের ফাইল, প্রিন্টার বা প্রসেসর ব্যবহার করতে পারেন।</li>
          <li><b>দ্রুত হিসাব:</b> একটি বড় কাজ কয়েকটি কম্পিউটারে ভাগ করে একসঙ্গে চালানো যায়।</li>
          <li><b>নির্ভরযোগ্যতা:</b> একটি কম্পিউটার নষ্ট হলেও বাকিরা কাজ চালিয়ে যায়।</li>
          <li><b>অসুবিধা:</b> নেটওয়ার্ক বিকল হলে সমস্যা; নিরাপত্তা ঝুঁকি বেশি; সফটওয়্যার জটিল।</li>
        </ul>
        <p class="prose">মাল্টিপ্রসেসিংয়ে প্রসেসরগুলো একই কম্পিউটারে একটি স্মৃতি ভাগ করে; ডিস্ট্রিবিউটেডে আলাদা কম্পিউটার, প্রত্যেকের নিজস্ব স্মৃতি, যোগাযোগ নেটওয়ার্কে।</p>

    <section class="blk" id="multi" data-topic="multi" data-short="মাল্টিপ্রোগ্রামিং ও প্রসেসিং">
      <p class="blk-no">অংশ ৪<small>সিলেবাস ঙ.১</small></p>
      <div class="body">
        <h2>মাল্টিপ্রোগ্রামিং, টাইম শেয়ারিং ও মাল্টিপ্রসেসিং</h2>
        <p class="prose">এক CPU-তে কীভাবে একসঙ্গে অনেক প্রোগ্রাম চলে, আর একাধিক প্রসেসর কীভাবে কাজ ভাগ করে নেয়। “চিত্রসহ বর্ণনা করুন” প্রশ্ন সবচেয়ে বেশি এসেছে এই অংশ থেকে।</p>
        <h3 class="sub" id="multiprog"><span>৪.১</span>মাল্টিপ্রোগ্রামিং অপারেটিং সিস্টেম</h3>
        <p class="defn"><b>সংজ্ঞা</b>যে অপারেটিং সিস্টেম একাধিক প্রোগ্রামকে একসঙ্গে প্রধান স্মৃতিতে রাখে এবং একটি প্রোগ্রাম ইনপুট-আউটপুটের জন্য অপেক্ষায় গেলে সঙ্গে সঙ্গে CPU-কে আরেকটি প্রোগ্রামে লাগিয়ে দেয়, তাকে মাল্টিপ্রোগ্রামিং অপারেটিং সিস্টেম বলে। উদ্দেশ্য: CPU যেন কখনো অলস বসে না থাকে।</p>
        <figure class="fig flow wide">
          <svg viewBox="0 0 520 250" role="img" aria-label="মাল্টিপ্রোগ্রামিং: প্রধান স্মৃতিতে অপারেটিং সিস্টেম আর প্রোগ্রাম ১, ২, ৩ একসঙ্গে। সময়রেখায় CPU প্রথমে প্রোগ্রাম ১ চালায়; প্রোগ্রাম ১ ইনপুট-আউটপুটে গেলে CPU প্রোগ্রাম ২, তারপর ৩, তারপর আবার ১ চালায়। CPU কখনো ফাঁকা থাকে না।">

        </figure>
        <ol class="algo">
          <li>কয়েকটি প্রোগ্রাম (জব) একসঙ্গে প্রধান স্মৃতির আলাদা অংশে রাখা হয়।</li>
          <li>অপারেটিং সিস্টেম একটি প্রোগ্রামকে CPU দেয়।</li>
          <li>প্রোগ্রামটি ইনপুট-আউটপুটের (ডিস্ক পড়া, প্রিন্ট) জন্য অপেক্ষায় গেলে CPU সঙ্গে সঙ্গে স্মৃতির আরেকটি প্রোগ্রাম চালায়।</li>
          <li>আগের প্রোগ্রামের ইনপুট-আউটপুট শেষ হলে সেটি আবার CPU পাওয়ার সারিতে দাঁড়ায়।</li>
          <li>এভাবে CPU আর ইনপুট-আউটপুট যন্ত্র একই সময়ে আলাদা প্রোগ্রামের কাজে ব্যস্ত থাকে।</li>
        </ol>
        <ul class="pts">
          <li><b>সুবিধা:</b> CPU-র ব্যবহার বাড়ে; একই সময়ে বেশি কাজ শেষ হয় (থ্রুপুট বেশি); হিসাব আর ইনপুট-আউটপুট একসঙ্গে চলে।</li>
          <li><b>অসুবিধা:</b> বেশি স্মৃতি লাগে; কোন প্রোগ্রাম কখন CPU পাবে তা ঠিক করা (শিডিউলিং) জটিল; কাজ চলার সময় ব্যবহারকারীর সরাসরি যোগাযোগ থাকে না।</li>
        </ul>
        <h3 class="sub" id="timeshare"><span>৪.২</span>টাইম শেয়ারিং ও টাইম স্লাইস</h3>
        <p class="defn"><b>টাইম শেয়ারিং</b>যে অপারেটিং সিস্টেম CPU-র সময় খুব ছোট ছোট ভাগে (টাইম স্লাইস) ভাগ করে পালাক্রমে অনেক ব্যবহারকারী বা প্রোগ্রামকে দেয়, যাতে সবাই প্রায় সঙ্গে সঙ্গে সাড়া পান, তাকে টাইম শেয়ারিং অপারেটিং সিস্টেম বলে। যেমন UNIX, Linux, Windows।</p>
        <p class="defn"><b>টাইম স্লাইস</b>টাইম শেয়ারিং বা মাল্টিটাস্কিং অপারেটিং সিস্টেমে প্রতিটি প্রোগ্রামকে পালাক্রমে CPU ব্যবহারের জন্য যে ছোট নির্দিষ্ট সময় (সাধারণত কয়েক মিলিসেকেন্ড) দেওয়া হয়, তাকে টাইম স্লাইস বা কোয়ান্টাম বলে।</p>
        <figure class="fig flow wide tshare">
          <svg viewBox="0 0 560 295" role="img" aria-label="টাইমশেয়ারিং: চারজন ব্যবহারকারী অপারেটিং সিস্টেমের সঙ্গে যুক্ত; অপারেটিং সিস্টেম পালা করে প্রত্যেককে CPU দেয়। নিচের সময়রেখায় CPU-র পালা ১, ২, ৩, ৪, তারপর আবার ১, ২, ৩, ৪।">

        </figure>
        <ol class="algo">
          <li>সব ব্যবহারকারীর প্রোগ্রাম একটি সারিতে থাকে।</li>
          <li>অপারেটিং সিস্টেম সারির প্রথম প্রোগ্রামকে একটি টাইম স্লাইসের জন্য CPU দেয়।</li>
          <li>স্লাইস শেষ হলে কাজ বাকি থাকলেও প্রোগ্রামটি থামিয়ে সারির শেষে পাঠায়; পরের প্রোগ্রাম CPU পায়।</li>
          <li>কাজ শেষ হওয়া প্রোগ্রাম সারি থেকে বেরিয়ে যায়; বাকিরা পালা করে চলতে থাকে।</li>
        </ol>
        <p class="prose"><b>হিসাব করে দেখুন:</b> ৪ জন ব্যবহারকারী, টাইম স্লাইস ২০ মিলিসেকেন্ড হলে প্রত্যেকে প্রতি ৪ × ২০ = ৮০ মিলিসেকেন্ডে একবার CPU পান, অর্থাৎ সেকেন্ডে সাড়ে ১২ বার (১০০০ ÷ ৮০ = ১২.৫)। এত দ্রুত পালাবদল মানুষ টের পায় না, তাই মনে হয় সবাই একসঙ্গে পুরো কম্পিউটার পাচ্ছেন।</p>
        <p class="prose">টাইম শেয়ারিং আসলে মাল্টিপ্রোগ্রামিংয়ের সঙ্গে টাইম স্লাইস যোগ করা: প্রোগ্রাম অপেক্ষায় না গেলেও তার পালা শেষ হয়। একজন ব্যবহারকারীর কয়েকটি প্রোগ্রাম একই কৌশলে একসঙ্গে চললে তাকে মাল্টিটাস্কিং বলে।</p>
        <h3 class="sub" id="multiproc"><span>৪.৩</span>মাল্টিপ্রসেসিং অপারেটিং সিস্টেম</h3>
        <p class="defn"><b>সংজ্ঞা</b>যে অপারেটিং সিস্টেম একই কম্পিউটারের দুই বা ততোধিক প্রসেসরকে একসঙ্গে নিয়ন্ত্রণ করে এবং প্রোগ্রাম বা কাজের অংশগুলো প্রসেসরগুলোর মধ্যে ভাগ করে দিয়ে একই সময়ে চালায়, তাকে মাল্টিপ্রসেসিং অপারেটিং সিস্টেম বলে।</p>

        <ol class="algo">
          <li>একাধিক প্রসেসর একটি সাধারণ বাস দিয়ে একই প্রধান স্মৃতি ও ইনপুট-আউটপুট যন্ত্র ভাগাভাগি করে।</li>
          <li>অপারেটিং সিস্টেম চলমান প্রোগ্রামগুলোকে (বা একটি বড় প্রোগ্রামের অংশগুলোকে) ছোট কাজে ভাগ করে।</li>
          <li>কোন প্রসেসর ফাঁকা আছে দেখে প্রতিটি কাজ একটি প্রসেসরকে দেয়; প্রসেসরগুলো একই মুহূর্তে আলাদা কাজ চালায়।</li>
          <li>একই উপাত্ত নিয়ে দুই প্রসেসর যেন টানাটানি না করে, অপারেটিং সিস্টেম তা সমন্বয় করে।</li>
          <li>কোনো প্রসেসর নষ্ট হলে তার কাজ অন্য প্রসেসরে সরিয়ে দেয়, ফলে কম্পিউটার চলতেই থাকে।</li>
        </ol>
        <ul class="pts">
          <li><b>প্রকার:</b> সিমেট্রিক: সব প্রসেসর সমান, যেকোনোটি যেকোনো কাজ করে (আধুনিক মাল্টিকোর কম্পিউটার)। অ্যাসিমেট্রিক (মাস্টার-স্লেভ): একটি প্রধান প্রসেসর কাজ ভাগ করে দেয়, বাকিরা নির্দিষ্ট কাজ করে।</li>

          <li><b>অসুবিধা:</b> হার্ডওয়্যার ব্যয়বহুল; অপারেটিং সিস্টেম জটিল; প্রসেসরগুলোর সমন্বয়ে বাড়তি সময় লাগে।</li>

      <div class="body">
        <h2>বর্ণভিত্তিক ও চিত্রভিত্তিক অপারেটিং সিস্টেম</h2>
        <h3 class="sub" id="cui-gui"><span>৫.১</span>সংজ্ঞা</h3>
        <p class="defn"><b>বর্ণভিত্তিক (CUI)</b>যে অপারেটিং সিস্টেমে কিবোর্ডে কমান্ড টাইপ করে কাজ করতে হয় এবং পর্দায় শুধু অক্ষর থাকে, তাকে বর্ণভিত্তিক বা CUI (Character User Interface) অপারেটিং সিস্টেম বলে; একে কমান্ড লাইন ইন্টারফেস (CLI)-ও বলে। যেমন MS-DOS, UNIX-এর কমান্ড লাইন।</p>
        <p class="defn"><b>চিত্রভিত্তিক (GUI)</b>যে অপারেটিং সিস্টেমে উইন্ডো, আইকন, মেনু ও মাউস-পয়েন্টারের ছবিতে ক্লিক করে কাজ করা যায়, তাকে চিত্রভিত্তিক বা GUI (Graphical User Interface) অপারেটিং সিস্টেম বলে। যেমন Windows, macOS, Ubuntu, Android।</p>
        <figure class="fig flow wide">
          <svg viewBox="0 0 540 222" role="img" aria-label="বাঁয়ে বর্ণভিত্তিক পর্দা: শুধু লেখা; প্রম্পটে DIR লিখলে ফাইলের তালিকা আসে, তারপর COPY কমান্ড। ডানে চিত্রভিত্তিক পর্দা: একটি উইন্ডো, ওপরে শিরোনাম ও তিনটি বোতাম, ভেতরে তিনটি ফোল্ডারের আইকন আর মাউস-পয়েন্টার।">

        <p class="prose">GUI-র চারটি মূল উপাদানকে সংক্ষেপে WIMP বলে: Window, Icon, Menu, Pointer। প্রথম GUI তৈরি হয় Xerox-এর গবেষণাগারে (Alto, ১৯৭৩); Apple Macintosh (১৯৮৪) একে জনপ্রিয় করে, আর Microsoft Windows আসে ১৯৮৫ সালে।</p>
        <h3 class="sub" id="gui-func"><span>৫.২</span>চিত্রভিত্তিক অপারেটিং সিস্টেমের কাজ</h3>
        <ul class="pts">
          <li>প্রতিটি প্রোগ্রাম আলাদা উইন্ডোতে খোলে; একসঙ্গে একাধিক প্রোগ্রাম চালানো ও এক উইন্ডো থেকে আরেকটিতে যাওয়া যায় (মাল্টিটাস্কিং)।</li>
          <li>আইকন ও মেনুতে ক্লিক করে প্রোগ্রাম চালানো, ফাইল খোলা ও বন্ধ করা যায়; কমান্ড মুখস্থ রাখতে হয় না।</li>
          <li>ড্র্যাগ অ্যান্ড ড্রপ করে ফাইল ও ফোল্ডার কপি, সরানো ও মোছা যায়।</li>
          <li>প্রিন্টার, স্ক্যানারসহ যন্ত্রের সেটিং ছবির মাধ্যমে সহজে করা যায়; প্লাগ অ্যান্ড প্লে সুবিধা।</li>
          <li>ছবি, ভিডিও ও শব্দ নিয়ে কাজ (মাল্টিমিডিয়া) সহজ হয়; ব্যবহারকারী অ্যাকাউন্ট ও পাসওয়ার্ড দিয়ে নিরাপত্তা দেয়।</li>
        </ul>

    <section class="blk" id="dos" data-topic="dos" data-short="DOS">
      <p class="blk-no">অংশ ৬<small>সিলেবাস ঙ.২</small></p>
      <div class="body">
        <h2>ডস (DOS)</h2>
        <p class="defn"><b>সংজ্ঞা</b>DOS (Disk Operating System) হলো ডিস্কভিত্তিক, বর্ণভিত্তিক অপারেটিং সিস্টেম, যেখানে কিবোর্ডে কমান্ড লিখে কম্পিউটার চালাতে হয়। ফ্লপি বা হার্ডডিস্ক থেকে চালু হয় এবং ডিস্কের ফাইল পরিচালনাই এর প্রধান কাজ, তাই এই নাম।</p>
        <h3 class="sub"><span>৬.১</span>ইতিহাস ও বৈশিষ্ট্য</h3>
        <p class="prose">১৯৮১ সালে IBM পার্সোনাল কম্পিউটারের জন্য Microsoft তৈরি করে MS-DOS (IBM-এর কপির নাম PC-DOS); এর ভিত্তি ছিল Seattle Computer Products-এর 86-DOS। শেষ আলাদা সংস্করণ MS-DOS 6.22 (১৯৯৪); এরপর এটি Windows 95 ও 98-এর ভেতরে থেকে যায়। আজও Windows-এর Command Prompt-এ DOS-এর মতো কমান্ড চলে।</p>
        <ul class="pts">
          <li><b>ইন্টারফেস:</b> কমান্ড লাইন (CUI): প্রম্পট <span class="m">C:\&gt;</span>-এর পরে কমান্ড লিখে Enter।</li>
          <li><b>ব্যবহারকারী ও কাজ:</b> একক ব্যবহারকারী, একক কাজ (সিঙ্গেল ইউজার, সিঙ্গেল টাস্কিং)।</li>
          <li><b>ফাইলের নাম:</b> ৮ অক্ষরের নাম + ৩ অক্ষরের এক্সটেনশন (৮.৩ নিয়ম)।</li>
          <li><b>ড্রাইভ ও ডিরেক্টরি:</b> A: ও B: ফ্লপি, C: হার্ডডিস্ক; MS-DOS 2.0 (১৯৮৩) থেকে গাছের মতো ডিরেক্টরি ও সাব-ডিরেক্টরি।</li>
          <li><b>স্মৃতি:</b> ১৬-বিট; প্রোগ্রামের জন্য প্রধান স্মৃতি মাত্র ৬৪০ KB।</li>
        </ul>
        <h3 class="sub" id="dos-boot"><span>৬.২</span>বুটিং ও DOS-এর তিনটি সিস্টেম ফাইল</h3>
        <p class="defn"><b>বুটিং</b>কম্পিউটার চালু করে অপারেটিং সিস্টেমকে স্মৃতিতে আনার প্রক্রিয়াকে বুটিং বলে। সুইচ দিয়ে বন্ধ অবস্থা থেকে চালু করা কোল্ড বুট; চালু অবস্থায় Ctrl + Alt + Del বা রিস্টার্ট করা ওয়ার্ম বুট।</p>
        <ol class="algo">
          <li>সুইচ চালু করলে ROM-এর BIOS চলে; যন্ত্রগুলো ঠিক আছে কি না পরীক্ষা করে (POST: Power On Self Test)।</li>
          <li>BIOS ডিস্কের বুট সেক্টর থেকে ছোট একটি লোডার প্রোগ্রাম স্মৃতিতে আনে।</li>
          <li>লোডার IO.SYS আনে: ইনপুট-আউটপুট যন্ত্রের সঙ্গে যোগাযোগের অংশ।</li>
          <li>তারপর MSDOS.SYS: DOS-এর মূল অংশ (কার্নেল), ফাইল ও স্মৃতি ব্যবস্থাপনা। CONFIG.SYS থাকলে তার সেটিং পড়া হয়।</li>
          <li>শেষে COMMAND.COM: কমান্ড ইন্টারপ্রেটার (শেল); অভ্যন্তরীণ কমান্ডগুলো এর ভেতরেই থাকে। AUTOEXEC.BAT থাকলে তার কমান্ডগুলো নিজে নিজে চলে।</li>
          <li>পর্দায় প্রম্পট <span class="m">C:\&gt;</span> আসে; DOS কমান্ডের জন্য প্রস্তুত।</li>
        </ol>
        <table class="rt cmp">
          <thead><tr><th>সিস্টেম ফাইল</th><th>কাজ</th></tr></thead>
          <tbody>
            <tr><td><span class="m">IO.SYS</span></td><td>ইনপুট-আউটপুট যন্ত্রের সঙ্গে যোগাযোগ (লুকানো ফাইল)</td></tr>
            <tr><td><span class="m">MSDOS.SYS</span></td><td>DOS-এর মূল অংশ: ফাইল, স্মৃতি ও প্রোগ্রাম চালানো (লুকানো ফাইল)</td></tr>
            <tr><td><span class="m">COMMAND.COM</span></td><td>কমান্ড ইন্টারপ্রেটার: টাইপ করা কমান্ড পড়ে চালায়</td></tr>
          </tbody>
        </table>
        <h3 class="sub"><span>৬.৩</span>ফাইলের নাম ও ওয়াইল্ডকার্ড</h3>
        <ul class="pts">
          <li><b>৮.৩ নিয়ম:</b> নাম সর্বোচ্চ ৮ অক্ষর, বিন্দু, তারপর সর্বোচ্চ ৩ অক্ষরের এক্সটেনশন: <span class="m">REPORT.TXT</span>, <span class="m">GAME.EXE</span>। নামে ফাঁকা স্থান আর <span class="m">* ? / \ : | &lt; &gt; + = ; ,</span> চলে না।</li>
          <li><b>এক্সটেনশন:</b> <span class="m">.EXE</span>, <span class="m">.COM</span>, <span class="m">.BAT</span> চালানো যায়; <span class="m">.SYS</span> সিস্টেম ফাইল; <span class="m">.TXT</span> লেখা।</li>
          <li><b>ওয়াইল্ডকার্ড:</b> <span class="m">*</span> মানে যেকোনো সংখ্যক অক্ষর, <span class="m">?</span> মানে যেকোনো একটি অক্ষর। <span class="m">DIR&nbsp;*.TXT</span> সব টেক্সট ফাইল দেখায়; <span class="m">DEL&nbsp;A?.DOC</span> মোছে AB.DOC, A1.DOC, কিন্তু ABC.DOC নয়।</li>
        </ul>
        <h3 class="sub" id="dos-cmd"><span>৬.৪</span>অভ্যন্তরীণ ও বাহ্যিক কমান্ড</h3>
        <p class="defn"><b>অভ্যন্তরীণ (Internal) কমান্ড</b>যেসব কমান্ড COMMAND.COM-এর ভেতরেই থাকে এবং বুটিংয়ের পর সবসময় প্রধান স্মৃতিতে থাকে, তাদের অভ্যন্তরীণ কমান্ড বলে। যেমন DIR, CLS, COPY, DEL, REN, MD, CD, RD, TYPE, DATE, TIME, VER।</p>
        <p class="defn"><b>বাহ্যিক (External) কমান্ড</b>যেসব কমান্ড ডিস্কে আলাদা প্রোগ্রাম ফাইল (.COM বা .EXE) হিসেবে থাকে এবং দরকার হলে ডিস্ক থেকে স্মৃতিতে আনা হয়, তাদের বাহ্যিক কমান্ড বলে। যেমন FORMAT, XCOPY, DISKCOPY, CHKDSK, TREE, ATTRIB, EDIT, SYS।</p>

            <tr><td>কোথায় থাকে</td><td>COMMAND.COM-এর সঙ্গে প্রধান স্মৃতিতে</td><td>ডিস্কে আলাদা ফাইল হিসেবে (যেমন FORMAT.COM)</td></tr>
            <tr><td>চালাতে ডিস্ক</td><td>লাগে না</td><td>ফাইলটি ডিস্কে থাকতে হবে</td></tr>
            <tr><td>গতি</td><td>দ্রুত</td><td>আগে ডিস্ক থেকে আনতে হয়, তাই তুলনামূলক ধীর</td></tr>
            <tr><td>DIR-এ দেখা যায়</td><td>না, আলাদা ফাইল নয়</td><td>হ্যাঁ, ফাইল হিসেবে দেখা যায়</td></tr>
            <tr><td>কাজের ধরন</td><td>ছোট ও প্রায়ই দরকারি কাজ</td><td>বড় বা বিশেষ কাজ</td></tr>

            <tr><td><span class="m">CHKDSK</span></td><td>বাহ্যিক</td><td>ডিস্ক পরীক্ষা ও ব্যবহৃত-ফাঁকা জায়গার হিসাব: <span class="m">CHKDSK&nbsp;C:</span></td></tr>
            <tr><td><span class="m">TREE</span></td><td>বাহ্যিক</td><td>ডিরেক্টরির গাছ দেখানো</td></tr>
            <tr><td><span class="m">ATTRIB</span></td><td>বাহ্যিক</td><td>ফাইলের বৈশিষ্ট্য বদল, যেমন শুধু-পড়া: <span class="m">ATTRIB&nbsp;+R&nbsp;A.TXT</span></td></tr>
            <tr><td><span class="m">EDIT</span></td><td>বাহ্যিক</td><td>লেখা সম্পাদনার প্রোগ্রাম খোলা: <span class="m">EDIT&nbsp;A.TXT</span></td></tr>
            <tr><td><span class="m">SYS</span></td><td>বাহ্যিক</td><td>ডিস্কে সিস্টেম ফাইল বসিয়ে বুট করার উপযোগী করা: <span class="m">SYS&nbsp;A:</span></td></tr>
          </tbody>
        </table>
        <h4 class="sub-h"><span>অনুশীলন</span><span>একটি ডিরেক্টরি বানিয়ে ফাইল লেখা, দেখা, নাম বদল ও মোছা</span></h4>
        <pre class="code">C:\&gt; MD SCHOOL
C:\&gt; CD SCHOOL
C:\SCHOOL&gt; COPY CON NOTE.TXT
ICT MASTER
^Z
        1 file(s) copied
C:\SCHOOL&gt; TYPE NOTE.TXT
ICT MASTER
C:\SCHOOL&gt; REN NOTE.TXT CLASS.TXT
C:\SCHOOL&gt; DEL CLASS.TXT
C:\SCHOOL&gt; CD ..
C:\&gt; RD SCHOOL</pre>
        <p class="prose">COPY CON-এ লেখা শেষ করতে Ctrl + Z চেপে Enter (পর্দায় ^Z দেখায়)। প্রম্পটে বর্তমান ডিরেক্টরির নাম দেখা যায় (C:\SCHOOL&gt;)। RD শুধু খালি ডিরেক্টরি মোছে, তাই আগে ফাইলটি মুছে, এক ধাপ ওপরে এসে তারপর RD।</p>

    <section class="blk" id="win" data-topic="win" data-short="Windows">
      <p class="blk-no">অংশ ৭<small>সিলেবাস ঙ.৩</small></p>
      <div class="body">
        <h2>উইন্ডোজ (Windows)</h2>
        <p class="defn"><b>সংজ্ঞা</b>Windows হলো Microsoft-এর তৈরি চিত্রভিত্তিক (GUI), মাল্টিটাস্কিং অপারেটিং সিস্টেম। প্রতিটি প্রোগ্রাম পর্দায় আলাদা আয়তাকার উইন্ডোতে খোলে বলে এই নাম। পৃথিবীর বেশিরভাগ ডেস্কটপ ও ল্যাপটপ কম্পিউটারে এটি চলে।</p>
        <h3 class="sub"><span>৭.১</span>সংস্করণ</h3>
        <table class="rt cmp">
          <thead><tr><th>সাল</th><th>সংস্করণ</th><th>যা নতুন</th></tr></thead>
          <tbody>
            <tr><td>১৯৮৫</td><td>Windows 1.0</td><td>প্রথম সংস্করণ; MS-DOS-এর ওপর চলা GUI</td></tr>
            <tr><td>১৯৯০–৯২</td><td>Windows 3.0, 3.1</td><td>ব্যাপক জনপ্রিয় হয়</td></tr>
            <tr><td>১৯৯৩</td><td>Windows NT 3.1</td><td>প্রথম পূর্ণাঙ্গ ৩২-বিট উইন্ডোজ</td></tr>
            <tr><td>১৯৯৫</td><td>Windows 95</td><td>Start বোতাম ও টাস্কবার, প্লাগ অ্যান্ড প্লে, লম্বা ফাইলের নাম</td></tr>
            <tr><td>১৯৯৮</td><td>Windows 98</td><td>ইন্টারনেট এক্সপ্লোরার যুক্ত, USB-র ভালো সমর্থন</td></tr>
            <tr><td>২০০১</td><td>Windows XP</td><td>NT-ভিত্তিক; ঘর ও অফিসের জন্য একই উইন্ডোজ</td></tr>
            <tr><td>২০০৭</td><td>Windows Vista</td><td>নতুন স্বচ্ছ চেহারা (Aero)</td></tr>
            <tr><td>২০০৯</td><td>Windows 7</td><td>Vista-র পরের সংস্করণ; দ্রুত ও স্থিতিশীল</td></tr>
            <tr><td>২০১২</td><td>Windows 8</td><td>টাচস্ক্রিনের জন্য টাইলের Start স্ক্রিন</td></tr>
            <tr><td>২০১৫</td><td>Windows 10</td><td>Start মেনু ফিরে আসে; দীর্ঘদিন সবচেয়ে বেশি ব্যবহৃত</td></tr>
            <tr><td>২০২১</td><td>Windows 11</td><td>সর্বশেষ সংস্করণ; মাঝখানে টাস্কবার</td></tr>
          </tbody>
        </table>
        <h3 class="sub" id="win-adv"><span>৭.২</span>বৈশিষ্ট্য ও সুবিধা</h3>
        <ul class="pts">
          <li><b>চিত্রভিত্তিক:</b> আইকন, মেনু ও উইন্ডোতে মাউস বা স্পর্শে কাজ; কমান্ড মুখস্থ লাগে না।</li>
          <li><b>মাল্টিটাস্কিং:</b> একসঙ্গে অনেক প্রোগ্রাম; Alt + Tab-এ এক উইন্ডো থেকে আরেকটিতে।</li>
          <li><b>প্লাগ অ্যান্ড প্লে:</b> নতুন যন্ত্র লাগালে নিজেই চিনে ড্রাইভার বসায় (Windows 95 থেকে)।</li>
          <li><b>লম্বা ফাইলের নাম:</b> ২৫৫ অক্ষর পর্যন্ত, ফাঁকা স্থানসহ।</li>
          <li><b>ক্লিপবোর্ড:</b> কপি-পেস্টে এক প্রোগ্রাম থেকে আরেকটিতে লেখা, ছবি ও ফাইল নেওয়া যায়।</li>
          <li><b>নেটওয়ার্ক ও ইন্টারনেট:</b> সহজে নেটওয়ার্কে যুক্ত হওয়া, ফাইল ও প্রিন্টার ভাগাভাগি, ব্রাউজার।</li>
          <li><b>মাল্টিমিডিয়া:</b> ছবি, গান, ভিডিও ও গেম চালানো।</li>
          <li><b>একাধিক ব্যবহারকারী অ্যাকাউন্ট:</b> প্রত্যেকের আলাদা পাসওয়ার্ড, ফাইল ও সেটিং।</li>
          <li><b>সফটওয়্যারের প্রাচুর্য:</b> সবচেয়ে বেশি অ্যাপ্লিকেশন ও গেম এর জন্য তৈরি; সহায়তা (Help) সহজে পাওয়া যায়।</li>
        </ul>
        <p class="prose"><b>অসুবিধা:</b> লাইসেন্স কিনতে হয়; ভাইরাস ও ম্যালওয়্যারের ঝুঁকি বেশি; DOS-এর চেয়ে অনেক বেশি স্মৃতি ও শক্তিশালী হার্ডওয়্যার লাগে; সোর্স কোড বন্ধ, তাই নিজে বদলানো যায় না।</p>
        <h3 class="sub"><span>৭.৩</span>ডেস্কটপ ও উইন্ডোর অংশ</h3>
        <ul class="pts">
          <li><b>ডেস্কটপ:</b> চালু হওয়ার পর পুরো পর্দা; এখানে আইকন থাকে।</li>
          <li><b>আইকন ও শর্টকাট আইকন:</b> প্রোগ্রাম, ফাইল বা ফোল্ডারের ছোট ছবি। কোণে বাঁকা তীর থাকা আইকন শর্টকাট: মূল প্রোগ্রামে দ্রুত পৌঁছানোর পথ, মুছলেও মূলটি থাকে।</li>
          <li><b>টাস্কবার ও Start বোতাম:</b> পর্দার নিচের দণ্ড; Start মেনু থেকে সব প্রোগ্রাম, খোলা প্রোগ্রামগুলোর বোতাম, ডানে ঘড়ি ও নোটিফিকেশন এরিয়া।</li>
          <li><b>রিসাইকেল বিন:</b> মোছা ফাইল প্রথমে এখানে আসে, ফিরিয়ে আনা যায়; Shift + Delete দিলে এখানে না এসে স্থায়ীভাবে মুছে যায়।</li>
          <li><b>ফাইল এক্সপ্লোরার:</b> ফাইল ও ফোল্ডার দেখা, খোঁজা, কপি ও সরানো।</li>
          <li><b>কন্ট্রোল প্যানেল / Settings:</b> যন্ত্র, ব্যবহারকারী, সময়, নেটওয়ার্কসহ সব সেটিং।</li>
          <li><b>উইন্ডোর অংশ:</b> ওপরে টাইটেল বার; ডানে মিনিমাইজ, ম্যাক্সিমাইজ ও ক্লোজ বোতাম; মেনু বার বা রিবন; পাশে ও নিচে স্ক্রল বার।</li>
        </ul>
        <h3 class="sub"><span>৭.৪</span>দরকারি কিবোর্ড শর্টকাট</h3>
        <table class="rt cmp">
          <thead><tr><th>শর্টকাট</th><th>কাজ</th></tr></thead>
          <tbody>
            <tr><td><span class="m">Ctrl&nbsp;+&nbsp;C&nbsp;/&nbsp;X&nbsp;/&nbsp;V</span></td><td>কপি / কাট / পেস্ট</td></tr>
            <tr><td><span class="m">Ctrl&nbsp;+&nbsp;Z</span></td><td>শেষ কাজ বাতিল (আনডু)</td></tr>
            <tr><td><span class="m">Ctrl&nbsp;+&nbsp;A</span></td><td>সব নির্বাচন</td></tr>
            <tr><td><span class="m">Ctrl&nbsp;+&nbsp;S</span></td><td>সংরক্ষণ</td></tr>
            <tr><td><span class="m">Alt&nbsp;+&nbsp;Tab</span></td><td>খোলা উইন্ডোগুলোর মধ্যে বদল</td></tr>
            <tr><td><span class="m">Alt&nbsp;+&nbsp;F4</span></td><td>সক্রিয় উইন্ডো বা প্রোগ্রাম বন্ধ</td></tr>
            <tr><td><span class="m">Ctrl&nbsp;+&nbsp;Shift&nbsp;+&nbsp;Esc</span></td><td>সরাসরি Task Manager</td></tr>
            <tr><td><span class="m">Ctrl&nbsp;+&nbsp;Alt&nbsp;+&nbsp;Del</span></td><td>নিরাপত্তা পর্দা (লক, Task Manager, সাইন আউট)</td></tr>
            <tr><td><span class="m">Shift&nbsp;+&nbsp;Delete</span></td><td>রিসাইকেল বিন এড়িয়ে স্থায়ীভাবে মোছা</td></tr>
            <tr><td><span class="m">F2</span></td><td>নির্বাচিত ফাইলের নাম বদল</td></tr>
            <tr><td><span class="m">F5</span></td><td>রিফ্রেশ</td></tr>
            <tr><td><span class="m">Win&nbsp;+&nbsp;D</span></td><td>ডেস্কটপ দেখানো</td></tr>
            <tr><td><span class="m">Win&nbsp;+&nbsp;E</span></td><td>ফাইল এক্সপ্লোরার</td></tr>
            <tr><td><span class="m">Win&nbsp;+&nbsp;L</span></td><td>কম্পিউটার লক</td></tr>
          </tbody>
        </table>
        <h3 class="sub" id="dos-win"><span>৭.৫</span>DOS ও Windows-এর পার্থক্য</h3>
        <table class="rt cmp">
          <thead><tr><th>বিষয়</th><th>DOS</th><th>Windows</th></tr></thead>
          <tbody>
            <tr><td>ইন্টারফেস</td><td>বর্ণভিত্তিক (CUI); কমান্ড টাইপ করতে হয়, যেমন DIR, COPY</td><td>চিত্রভিত্তিক (GUI); আইকন, মেনু ও উইন্ডোতে ক্লিক</td></tr>
            <tr><td>ইনপুট যন্ত্র</td><td>প্রধানত কিবোর্ড</td><td>মাউস, কিবোর্ড, টাচস্ক্রিন</td></tr>
            <tr><td>মাল্টিটাস্কিং</td><td>একসঙ্গে একটি প্রোগ্রাম (সিঙ্গেল টাস্কিং)</td><td>একসঙ্গে অনেক প্রোগ্রাম</td></tr>
            <tr><td>ব্যবহারকারী</td><td>একক ব্যবহারকারী</td><td>একাধিক ব্যবহারকারী অ্যাকাউন্ট</td></tr>
            <tr><td>ফাইলের নাম</td><td>৮ অক্ষর নাম + ৩ অক্ষর এক্সটেনশন</td><td>২৫৫ অক্ষর পর্যন্ত লম্বা নাম</td></tr>
            <tr><td>মাল্টিমিডিয়া ও নেটওয়ার্ক</td><td>নেই বললেই চলে</td><td>পূর্ণ সমর্থন; ইন্টারনেট সহজে</td></tr>
            <tr><td>শেখা</td><td>কঠিন</td><td>সহজ</td></tr>
            <tr><td>হার্ডওয়্যার চাহিদা</td><td>খুব কম</td><td>বেশি স্মৃতি ও শক্তিশালী প্রসেসর</td></tr>
            <tr><td>প্রথম প্রকাশ</td><td>১৯৮১ (MS-DOS)</td><td>১৯৮৫ (Windows 1.0)</td></tr>
          </tbody>
        </table>
        <p class="prose">দুটিই Microsoft-এর তৈরি। প্রথম দিকের Windows (১.০ থেকে ৯৮ ও ME) DOS-এর ওপর চলত; NT-ভিত্তিক Windows (XP ও তার পরের সব) DOS ছাড়াই চলে।</p>

        <p><b>সুবিধা চাইলে</b>৭ম পরীক্ষায় উইন্ডোজের সুবিধা চাওয়া হয়েছিল: ৭.২-এর তালিকা থেকে অন্তত পাঁচটি, প্রতিটির সঙ্গে এক লাইনের ব্যাখ্যা।</p>
        <p><b>বারবার এসেছে</b>৪টি পরীক্ষায়: DOS ও Windows-এর পার্থক্যই প্রায় প্রতিবার।</p>

    <section class="blk" id="mistakes">
      <p class="blk-no">শেষে</p>
      <div class="body">
        <h2>যেসব ভুল হয়</h2>

        <h3 class="sub" id="algo-props"><span>১.১</span>অ্যালগরিদমের বৈশিষ্ট্য বা শর্ত</h3>
        <ul class="pts">
          <li><b>সসীমতা (Finiteness):</b> নির্দিষ্ট সংখ্যক ধাপের পরে অবশ্যই শেষ হবে; অসীম লুপ চলবে না।</li>
          <li><b>সুনির্দিষ্টতা (Definiteness):</b> প্রতিটি ধাপ স্পষ্ট, একটির বেশি অর্থ হবে না।</li>

          <li><b>কার্যকারিতা (Effectiveness):</b> প্রতিটি ধাপ এত সহজ হবে যে কাগজ-কলমে সীমিত সময়ে করা যায়।</li>

        <h3 class="sub"><span>১.২</span>সুবিধা ও অসুবিধা</h3>

        <h3 class="sub"><span>১.৩</span>অ্যালগরিদম লেখার নিয়ম</h3>

        <p class="prose">যেকোনো অ্যালগরিদম তিন রকম গঠনে তৈরি: <b>ক্রম</b> (Sequence: ধাপগুলো একটির পর একটি, অংশ ৫), <b>সিদ্ধান্ত</b> (Selection: শর্তের হ্যাঁ বা না অনুযায়ী আলাদা পথ, অংশ ৬) আর <b>লুপ</b> (Repetition: শর্ত সত্য থাকা পর্যন্ত একই কাজ বারবার, অংশ ৭)। বড় অ্যালগরিদমকে ছোট ছোট অংশে ভাগ করাকে বলে মডুলার ডিজাইন; আর প্রোগ্রামের ভুল খুঁজে সংশোধন করাকে বলে ডিবাগিং।</p>
        <h3 class="sub"><span>১.৫</span>সুডো কোড</h3>
        <p class="defn"><b>সংজ্ঞা</b>প্রোগ্রামিং ভাষার মতো কাঠামোয় কিন্তু সাধারণ ভাষায় লেখা অ্যালগরিদমকে সুডো কোড (Pseudocode, ছদ্ম কোড) বলে। কম্পিউটার এটি চালাতে পারে না, কিন্তু প্রোগ্রামে রূপান্তর খুব সহজ।</p>
        <pre class="code">BEGIN
    READ N
    SUM ← 0
    FOR i ← 1 TO N
        SUM ← SUM + i
    END FOR
    PRINT SUM
END</pre>
        <p class="prose">ওপরেরটি ১ থেকে N পর্যন্ত সংখ্যার যোগফলের সুডো কোড; একই সমস্যার অ্যালগরিদম ও ফ্লোচার্ট আছে অংশ ৭-এ।</p>
        <div data-prev="algo"></div>
        <p class="practice"><button class="btn line sm" type="button" data-practice="1-7,37,39,42,43,45,49,50,52,81" data-name="অ্যালগরিদম">এই অংশের MCQ অনুশীলন <span></span></button><a href="#/mcq/ch06/q1">তালিকায় পড়ুন →</a></p>
      </div>

        <p><b>নম্বর পেতে</b>সংজ্ঞার পরে পাঁচটি বৈশিষ্ট্য নাম ও এক লাইনের ব্যাখ্যাসহ লিখুন; শেষে ছোট একটি উদাহরণ (দুটি সংখ্যার যোগফল) দিন।</p>
        <p><b>বারবার এসেছে</b>৭টি পরীক্ষায় অ্যালগরিদমের সংজ্ঞা, শর্ত, সুবিধা বা সুডো কোড চাওয়া হয়েছে।</p>
      </aside>

    <section class="blk" id="var" data-topic="var" data-short="চলক ও অপারেশন">
      <p class="blk-no">অংশ ২<small>সিলেবাস চ.২</small></p>
      <div class="body">
        <h2>চলক ও অপারেশন</h2>
        <p class="defn"><b>চলক (Variable)</b>প্রোগ্রাম চলার সময় উপাত্ত রাখার জন্য স্মৃতির যে নামযুক্ত স্থান ব্যবহার করা হয়, এবং যার মান বদলানো যায়, তাকে চলক বলে। যেমন sum = 0, পরে sum = sum + 5 করলে sum-এর মান হয় ৫।</p>
        <p class="defn"><b>ধ্রুবক (Constant)</b>যার মান প্রোগ্রাম চলার সময় বদলায় না: যেমন 3.1416, 100, "Dhaka"।</p>
        <h3 class="sub" id="var-types"><span>২.১</span>চলকের প্রকারভেদ</h3>
        <table class="rt cmp"><thead><tr><th>প্রকার</th><th>কী রাখে</th><th>উদাহরণ</th></tr></thead><tbody><tr><td>পূর্ণসংখ্যা (int)</td><td>দশমিক ছাড়া সংখ্যা</td><td><span class="m">roll = 25</span></td></tr><tr><td>বাস্তব সংখ্যা (float, double)</td><td>ভগ্নাংশসহ সংখ্যা</td><td><span class="m">gpa = 4.75</span></td></tr><tr><td>অক্ষর (char)</td><td>একটি বর্ণ বা চিহ্ন</td><td><span class="m">grade = 'A'</span></td></tr><tr><td>স্ট্রিং</td><td>কয়েকটি বর্ণের সারি</td><td><span class="m">name = "Rahim"</span></td></tr></tbody></table>
        <p class="prose">পুরোনো BASIC ভাষায় চলক দুই রকম: সংখ্যাবাচক (A, X1) আর স্ট্রিং, যার নামের শেষে $ চিহ্ন (N$ = "Dhaka")। চলকটি কী ধরনের উপাত্ত রাখবে, তা-ই তার ডেটা টাইপ; এ থেকেই ঠিক হয় কতটুকু স্মৃতি লাগবে আর কোন কাজ করা যাবে।</p>
        <h3 class="sub" id="var-names"><span>২.২</span>চলকের নামকরণের নিয়ম</h3>
        <ul class="pts">
          <li>বর্ণ (a–z, A–Z) বা আন্ডারস্কোর (_) দিয়ে শুরু; অঙ্ক দিয়ে নয়।</li>
          <li>শুধু বর্ণ, অঙ্ক আর _ চলে; ফাঁকা স্থান বা অন্য চিহ্ন (-, @, #, $) নয়।</li>
          <li>প্রোগ্রামিং ভাষার সংরক্ষিত শব্দ (int, for, if) নাম হবে না।</li>
          <li>বড় ও ছোট হাতের অক্ষর আলাদা: Roll আর roll দুটি ভিন্ন চলক।</li>
          <li>নাম অর্থবহ রাখুন: total_marks, এক অক্ষরের t-এর চেয়ে ভালো।</li>
        </ul>
        <table class="rt cmp"><thead><tr><th>বৈধ</th><th>অবৈধ</th><th>কেন অবৈধ</th></tr></thead><tbody><tr><td><span class="m">test_1</span></td><td><span class="m">test exam</span></td><td>মাঝে ফাঁকা স্থান</td></tr><tr><td><span class="m">Roll107</span></td><td><span class="m">0marks</span></td><td>অঙ্ক দিয়ে শুরু</td></tr><tr><td><span class="m">student_name</span></td><td><span class="m">student-name</span>, <span class="m">student@name</span></td><td>- ও @ চিহ্ন চলে না</td></tr><tr><td><span class="m">number1</span></td><td><span class="m">int</span></td><td>সংরক্ষিত শব্দ</td></tr></tbody></table>
        <h3 class="sub" id="var-why"><span>২.৩</span>চলকের গুরুত্ব</h3>
        <ul class="pts">
          <li>ইনপুট, মধ্যবর্তী হিসাব আর ফল রাখার জায়গা দেয়।</li>
          <li>একই প্রোগ্রাম ভিন্ন ভিন্ন ইনপুটে চালানো যায়; সংখ্যা বদলালে প্রোগ্রাম বদলাতে হয় না।</li>
          <li>লুপে গণনা (i) আর যোগফল (Sum) রাখতে চলক লাগে।</li>
          <li>অর্থবহ নাম প্রোগ্রাম পড়া ও সংশোধন সহজ করে।</li>
        </ul>
        <p class="prose">উদাহরণ: <span class="m">area = length × width</span>; length ও width-এ যেকোনো মান দিলেই নতুন ক্ষেত্রফল, সূত্র একই থাকে।</p>
        <h3 class="sub"><span>২.৪</span>অপারেশন</h3>
        <p class="prose">প্রোগ্রামে উপাত্তের ওপর যে কাজ করা হয়, তাকে অপারেশন বলে; যে চিহ্ন দিয়ে করা হয়, তা অপারেটর।</p>
        <table class="rt cmp"><thead><tr><th>ধরন</th><th>অপারেটর</th><th>উদাহরণ ও ফল</th></tr></thead><tbody><tr><td>গাণিতিক</td><td><span class="m">+  −  *  /  %</span></td><td><span class="m">17 % 5 = 2</span> (ভাগশেষ)</td></tr><tr><td>তুলনামূলক</td><td><span class="m">&lt;  &gt;  ==  !=  &lt;=  &gt;=</span></td><td><span class="m">7 &gt; 3</span> সত্য</td></tr><tr><td>যৌক্তিক</td><td><span class="m">AND  OR  NOT</span></td><td><span class="m">(7 &gt; 3) AND (2 &gt; 5)</span> মিথ্যা</td></tr><tr><td>মান নির্ধারণ</td><td><span class="m">=</span></td><td><span class="m">x = x + 1</span>: x-এর মান এক বাড়ে</td></tr></tbody></table>
        <p class="prose">যেমন x = 25; y = x * 2 = ৫০; y = y % 3 করলে y-এর নতুন মান ৫০-কে ৩ দিয়ে ভাগ করে ভাগশেষ, অর্থাৎ ২।</p>
        <h3 class="sub" id="for-next"><span>২.৫</span>FOR-NEXT লুপ (BASIC)</h3>
        <p class="prose">একই কাজ নির্দিষ্টবার করতে BASIC-এ FOR-NEXT ব্যবহার হয়: FOR চলকটিকে শুরুর মান থেকে শেষের মান পর্যন্ত এক এক করে বাড়ায়, আর NEXT পর্যন্ত নির্দেশগুলো প্রতিবার চলে। উদাহরণ, ১ থেকে ১০-এর যোগফল:</p>
        <pre class="code">10 S = 0
20 FOR I = 1 TO 10
30 S = S + I
40 NEXT I
50 PRINT S
60 END</pre>
        <p class="prose">আউটপুট: ৫৫। লাইন ৩০ দশবার চলে, প্রতিবার I-এর মান ১ করে বাড়ে। ধাপ বদলাতে STEP লেখা যায়: FOR I = 1 TO 99 STEP 2 শুধু বিজোড় সংখ্যাগুলো নেয়।</p>

        <p><b>MCQ-তে বেশি আসে</b>কোন নামটি বৈধ চলক। ওপরের নিয়ম আর বৈধ-অবৈধ ছকটি মুখস্থ রাখুন।</p>
        <p><b>বারবার এসেছে</b>৫টি পরীক্ষায় চলকের সংজ্ঞা, প্রকার, নামকরণ, গুরুত্ব বা অপারেশন চাওয়া হয়েছে।</p>

    <section class="blk" id="flow" data-topic="flow" data-short="ফ্লোচার্ট">
      <p class="blk-no">অংশ ৩<small>সিলেবাস চ.৩</small></p>
      <div class="body">
        <h2>ফ্লোচার্ট</h2>
        <p class="defn"><b>সংজ্ঞা</b>নির্দিষ্ট প্রতীক আর তীর চিহ্ন দিয়ে অ্যালগরিদমের ধাপগুলোর চিত্ররূপকে ফ্লোচার্ট (প্রবাহচিত্র) বলে। কোন কাজের পর কোন কাজ, আর কোন শর্তে কোন পথ, তা এক নজরে দেখা যায়।</p>
        <h3 class="sub"><span>৩.১</span>ফ্লোচার্টের প্রকার</h3>
        <ul class="pts">
          <li><b>সিস্টেম ফ্লোচার্ট:</b> পুরো ব্যবস্থায় উপাত্ত কোথা থেকে কোথায় যায়: ইনপুট যন্ত্র, ফাইল, প্রক্রিয়া, রিপোর্ট।</li>
          <li><b>প্রোগ্রাম ফ্লোচার্ট:</b> একটি প্রোগ্রামের ধাপে ধাপে যুক্তি; পরীক্ষায় এটিই আঁকতে বলা হয়।</li>
        </ul>
        <h3 class="sub" id="flow-syms"><span>৩.২</span>প্রোগ্রাম ফ্লোচার্টের প্রতীক</h3>
        <div class="fig flow syms">
          <table class="rt cmp">
            <thead><tr><th>প্রতীক</th><th>নাম</th><th>অর্থ ও ব্যবহার</th></tr></thead>
            <tbody>
              <tr><td><svg viewBox="0 0 90 44" aria-hidden="true"><rect class="fs" x="6" y="8" width="78" height="28" rx="14"/></svg></td><td>ডিম্বাকৃতি (টার্মিনাল)</td><td>ফ্লোচার্টের শুরু ও শেষ</td></tr>
              <tr><td><svg viewBox="0 0 90 44" aria-hidden="true"><path class="fs" d="M20 8H86L70 36H4Z"/></svg></td><td>সামান্তরিক (ইনপুট/আউটপুট)</td><td>উপাত্ত নেওয়া বা ফল দেখানো, যেমন “A ইনপুট”, “Sum প্রিন্ট”</td></tr>
              <tr><td><svg viewBox="0 0 90 44" aria-hidden="true"><rect class="fs" x="6" y="8" width="78" height="28"/></svg></td><td>আয়তক্ষেত্র (প্রক্রিয়া)</td><td>হিসাব বা কোনো কাজ, যেমন A = L × W</td></tr>
              <tr><td><svg viewBox="0 0 90 44" aria-hidden="true"><path class="fs fd" d="M45 3L84 22L45 41L6 22Z"/></svg></td><td>রম্বস (সিদ্ধান্ত)</td><td>শর্ত যাচাই; হ্যাঁ বা না অনুযায়ী দুই পথ</td></tr>
              <tr><td><svg viewBox="0 0 90 44" aria-hidden="true"><path class="fa" d="M8 22H80"/><path class="ah" d="M78 17L88 22L78 27Z"/></svg></td><td>তীর (প্রবাহ রেখা)</td><td>কাজের ক্রম ও দিক</td></tr>
              <tr><td><svg viewBox="0 0 90 44" aria-hidden="true"><circle class="fs" cx="45" cy="22" r="14"/></svg></td><td>বৃত্ত (সংযোগকারী)</td><td>বড় ফ্লোচার্টের এক অংশকে আরেক অংশের সঙ্গে জোড়া</td></tr>
            </tbody>
          </table>
        </div>
        <p class="prose">লুপ বোঝাতে আলাদা কোনো প্রতীক নেই; রম্বস (শর্ত) আর পেছনে ফেরা তীর মিলেই লুপ হয়।</p>
        <h3 class="sub" id="flow-rules"><span>৩.৩</span>ফ্লোচার্ট আঁকার নিয়ম</h3>
        <ul class="pts">
          <li>শুধু প্রচলিত প্রতীক ব্যবহার করুন, প্রতিটি সঠিক কাজে।</li>
          <li>প্রবাহ ওপর থেকে নিচে আর বাঁ থেকে ডানে।</li>
          <li>একটি শুরু আর একটি শেষ।</li>
          <li>প্রতীকের ভেতরে লেখা সংক্ষিপ্ত ও স্পষ্ট।</li>
          <li>রম্বস থেকে বের হওয়া দুই পথে “হ্যাঁ” আর “না” লিখুন।</li>
          <li>তীরগুলো যেন পরস্পরকে না কাটে; জায়গা না পেলে সংযোগকারী বৃত্ত ব্যবহার করুন।</li>
          <li>পুরো চার্ট পরিচ্ছন্ন ও সহজবোধ্য রাখুন।</li>
        </ul>
        <h3 class="sub" id="flow-adv"><span>৩.৪</span>সুবিধা ও অসুবিধা</h3>

    <section class="blk" id="seq" data-topic="seq" data-short="ক্রমের সমস্যা">

      <div class="body">
        <h2>ক্রমের সমস্যা: ক্ষেত্রফল</h2>
        <p class="prose">ইনপুট, একটি হিসাব, আউটপুট: কোনো শর্ত বা লুপ নেই। ফ্লোচার্ট সোজা ওপর থেকে নিচে।</p>
        <h4 class="sub-h" id="p-rect"><span>৫.১</span><span>আয়তক্ষেত্রের ক্ষেত্রফল</span></h4>
        <ol class="algo">
          <li>শুরু।</li>
          <li>দৈর্ঘ্য L ও প্রস্থ W ইনপুট নিই।</li>
          <li>A = L × W।</li>
          <li>A প্রিন্ট করি।</li>
          <li>শেষ।</li>
        </ol>
        <figure class="fig flow">
          <svg viewBox="0 0 360 338" role="img" aria-label="ফ্লোচার্ট: শুরু; L ও W ইনপুট; A = L × W; A প্রিন্ট; শেষ।">
            <defs><marker id="rect6-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>

            <path class="fa" d="M180 120V146" marker-end="url(#rect6-ah)"/>
            <rect class="fs" x="114" y="148" width="132" height="42"/><text x="180" y="170">A = L × W</text>
            <path class="fa" d="M180 190V216" marker-end="url(#rect6-ah)"/>
            <path class="fs" d="M126 218H258L234 260H102Z"/><text x="180" y="240">A প্রিন্ট</text>
            <path class="fa" d="M180 260V286" marker-end="url(#rect6-ah)"/>
            <rect class="fs" x="120" y="288" width="120" height="40" rx="20"/><text x="180" y="309">শেষ</text>
          </svg>
          <figcaption>চিত্র: আয়তক্ষেত্রের ক্ষেত্রফল নির্ণয়ের ফ্লোচার্ট</figcaption>
        </figure>
        <p class="final"><b>উদাহরণ</b>L = ৮, W = ৫ হলে A = ৪০।</p>
        <h4 class="sub-h" id="p-circle"><span>৫.২</span><span>বৃত্তের ক্ষেত্রফল</span></h4>
        <ol class="algo">
          <li>শুরু।</li>
          <li>ব্যাসার্ধ r ইনপুট নিই।</li>
          <li>A = 3.1416 × r × r।</li>
          <li>A প্রিন্ট করি।</li>
          <li>শেষ।</li>
        </ol>
        <figure class="fig flow">
          <svg viewBox="0 0 360 338" role="img" aria-label="ফ্লোচার্ট: শুরু; r ইনপুট; A = 3.1416 গুণ r গুণ r; A প্রিন্ট; শেষ।">

            <path class="fs" d="M126 78H258L234 120H102Z"/><text x="180" y="100">r ইনপুট</text>

          </svg>
          <figcaption>চিত্র: বৃত্তের ক্ষেত্রফল নির্ণয়ের ফ্লোচার্ট</figcaption>
        </figure>
        <p class="final"><b>উদাহরণ</b>r = ৭ হলে A = ৩.১৪১৬ × ৪৯ = ১৫৩.৯৩৮৪।</p>
        <h4 class="sub-h" id="p-tri"><span>৫.৩</span><span>ত্রিভুজের ক্ষেত্রফল</span></h4>
        <ol class="algo">
          <li>শুরু।</li>
          <li>ভূমি b ও উচ্চতা h ইনপুট নিই।</li>
          <li>A = 0.5 × b × h।</li>
          <li>A প্রিন্ট করি।</li>
          <li>শেষ।</li>
        </ol>

            <defs><marker id="tri6-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
            <rect class="fs" x="120" y="10" width="120" height="40" rx="20"/><text x="180" y="31">শুরু</text>
            <path class="fa" d="M180 50V76" marker-end="url(#tri6-ah)"/>
            <path class="fs" d="M123 78H261L237 120H99Z"/><text x="180" y="100">b, h ইনপুট</text>
            <path class="fa" d="M180 120V146" marker-end="url(#tri6-ah)"/>

            <path class="fa" d="M180 190V216" marker-end="url(#tri6-ah)"/>
            <path class="fs" d="M126 218H258L234 260H102Z"/><text x="180" y="240">A প্রিন্ট</text>
            <path class="fa" d="M180 260V286" marker-end="url(#tri6-ah)"/>
            <rect class="fs" x="120" y="288" width="120" height="40" rx="20"/><text x="180" y="309">শেষ</text>
          </svg>
          <figcaption>চিত্র: ত্রিভুজের ক্ষেত্রফল নির্ণয়ের ফ্লোচার্ট</figcaption>
        </figure>
        <p class="final"><b>উদাহরণ</b>b = ১০, h = ৬ হলে A = ৩০।</p>
        <p class="prose">তিন বাহু a, b, c দেওয়া থাকলে হিসাবের ধাপ দুটি: s = (a + b + c) ÷ 2, তারপর A = √(s(s − a)(s − b)(s − c))। যেমন বাহু ৩, ৪, ৫ হলে s = ৬, A = √(৬ × ৩ × ২ × ১) = ৬। ফ্লোচার্টে শুধু আয়তক্ষেত্র দুটি হবে।</p>

      <div class="body">
        <h2>লুপের সমস্যা: ধারা, গুণফল, গ.সা.গু</h2>
        <p class="prose">লুপে একটি গণনার চলক (i) শুরুর মান থেকে শেষ মান পর্যন্ত বাড়তে থাকে; প্রতিবার রম্বসে শর্ত যাচাই হয়, আর হ্যাঁ হলে কাজ সেরে তীর আবার রম্বসে ফিরে যায়। শর্ত মিথ্যা হলে লুপ থেকে বেরিয়ে ফল প্রিন্ট। তিনটি জিনিস কখনো ভুলবেন না: শুরুর মান, শর্ত, আর মান বাড়ানো।</p>
        <h4 class="sub-h" id="p-sum"><span>৭.১</span><span>১ থেকে N পর্যন্ত সংখ্যার যোগফল</span></h4>

          <li>N ইনপুট নিই।</li>

          <li>i ≤ N না হলে ধাপ ৭-এ যাই।</li>
          <li>Sum = Sum + i।</li>
          <li>i = i + 1 করে ধাপ ৪-এ ফিরে যাই।</li>

        <p class="prose">এটি ৭.১-এর লুপই, শুধু i একবারে ২ করে বাড়ে। একই লুপে i = i + 2 আর শুরু i = 2 দিলে জোড় ধারা।</p>
        <h4 class="sub-h" id="p-even"><span>৭.৩</span><span>জোড় ধারা: ২ + ৪ + ৬ + … + N</span></h4>

        <h4 class="sub-h" id="p-gcd"><span>৭.৫</span><span>দুটি সংখ্যার গ.সা.গু</span></h4>

        <p class="defn"><b>সংজ্ঞা</b>বিশ্বজুড়ে কোটি কোটি কম্পিউটার ও নেটওয়ার্ক TCP/IP প্রোটোকলে পরস্পর যুক্ত হয়ে যে উন্মুক্ত নেটওয়ার্ক তৈরি করেছে, তাকে ইন্টারনেট বলে। একে “নেটওয়ার্কের নেটওয়ার্ক” বলা হয়; এর একক কোনো মালিক নেই।</p>

        <h3 class="sub" id="how"><span>১.১</span>ইন্টারনেট কীভাবে কাজ করে</h3>

        <ul class="pts">
          <li><b>ISP (Internet Service Provider):</b> যে প্রতিষ্ঠান টাকার বিনিময়ে ইন্টারনেট সংযোগ দেয়; মোবাইল অপারেটর ও ব্রডব্যান্ড কোম্পানিগুলো ISP।</li>
          <li><b>মডেম (Modulator-Demodulator):</b> কম্পিউটারের ডিজিটাল সংকেতকে টেলিফোন বা ক্যাবলের উপযোগী অ্যানালগ সংকেতে রূপান্তর করে (মডুলেশন), আর ফিরতি সংকেতকে আবার ডিজিটালে আনে (ডিমডুলেশন)।</li>

          <li><b>TCP/IP:</b> পাঠানো তথ্য ছোট ছোট প্যাকেটে ভাগ হয়; IP প্রতিটি প্যাকেটে ঠিকানা বসিয়ে পথ দেখায়, TCP সব প্যাকেট ঠিকমতো পৌঁছাল কি না দেখে আবার সাজিয়ে জোড়া দেয়।</li>
          <li><b>IP ঠিকানা:</b> ইন্টারনেটে যুক্ত প্রতিটি যন্ত্রের সংখ্যাভিত্তিক ঠিকানা। IPv4-এ ৩২ বিট, ০–২৫৫-এর চারটি সংখ্যা (যেমন <span class="m">192.168.1.1</span>); IPv6-এ ১২৮ বিট।</li>
          <li><b>ডোমেইন নাম ও DNS:</b> সংখ্যার ঠিকানা মনে রাখা কঠিন, তাই নাম ব্যবহার হয় (<span class="m">www.google.com</span>)। DNS (Domain Name System) সার্ভার নামটিকে IP ঠিকানায় অনুবাদ করে, ঠিক যেমন ফোনবুক নাম থেকে নম্বর বের করে।</li>

          <thead><tr><th>ধরন</th><th>পরিধি</th><th>উদাহরণ</th></tr></thead>
          <tbody>
            <tr><td>PAN (Personal Area Network)</td><td>এক ব্যক্তির চারপাশে কয়েক মিটার</td><td>ব্লুটুথে মোবাইল ও হেডফোন; ব্লুটুথ নেটওয়ার্ককে পিকোনেট বলে</td></tr>
            <tr><td>LAN (Local Area Network)</td><td>একটি ঘর, অফিস বা ভবন</td><td>স্কুলের কম্পিউটার ল্যাব</td></tr>

        <h3 class="sub" id="intranet"><span>১.৫</span>ইন্টারনেট, ইন্ট্রানেট ও এক্সট্রানেট</h3>
        <ul class="pts">
          <li><b>ইন্ট্রানেট:</b> একটি প্রতিষ্ঠানের ভেতরের ব্যক্তিগত নেটওয়ার্ক, যা ইন্টারনেটের প্রযুক্তি (TCP/IP, ওয়েবপেজ, ব্রাউজার, ই-মেইল) ব্যবহার করে, কিন্তু শুধু ঐ প্রতিষ্ঠানের কর্মীরা ঢুকতে পারেন।</li>
          <li><b>এক্সট্রানেট:</b> ইন্ট্রানেটের যে অংশে প্রতিষ্ঠানের বাইরের নির্দিষ্ট অংশীদার (সরবরাহকারী, ডিলার, গ্রাহক) পাসওয়ার্ড দিয়ে নিয়ন্ত্রিতভাবে ঢুকতে পারেন।</li>
        </ul>

    <section class="blk" id="use" data-topic="use" data-short="ব্যবহার ও সেবা">
      <p class="blk-no">অংশ ২<small>সিলেবাস ছ.১</small></p>
      <div class="body">
        <h2>ইন্টারনেটের ব্যবহার, সুফল-কুফল ও সেবা</h2>
        <h3 class="sub" id="use-list"><span>২.১</span>আধুনিক জীবনে ইন্টারনেটের প্রয়োগ</h3>
        <ul class="pts">
          <li><b>যোগাযোগ:</b> ই-মেইল, মেসেঞ্জার, ভিডিও কল; মুহূর্তে বিশ্বের যেকোনো প্রান্তে বার্তা।</li>
          <li><b>শিক্ষা:</b> অনলাইন ক্লাস, ই-বুক, শিক্ষামূলক ভিডিও, পরীক্ষার ফল প্রকাশ ও ভর্তি আবেদন।</li>
          <li><b>ব্যবসা ও কেনাকাটা:</b> ই-কমার্স, অনলাইন বিজ্ঞাপন, ঘরে বসে কেনাকাটা।</li>
          <li><b>ব্যাংকিং:</b> অনলাইন ও মোবাইল ব্যাংকিং, বিল পরিশোধ।</li>
          <li><b>স্বাস্থ্য:</b> টেলিমেডিসিন, অনলাইনে ডাক্তারের সময় নেওয়া।</li>
          <li><b>সরকারি সেবা (ই-গভর্ন্যান্স):</b> অনলাইনে জন্মনিবন্ধন, পাসপোর্ট ও চাকরির আবেদন।</li>
          <li><b>বিনোদন ও সংবাদ:</b> অনলাইন পত্রিকা, ভিডিও, গান, সামাজিক যোগাযোগমাধ্যম।</li>
          <li><b>কর্মসংস্থান:</b> ফ্রিল্যান্সিং, ঘরে বসে অফিসের কাজ, অনলাইনে চাকরি খোঁজা।</li>
        </ul>
        <h3 class="sub" id="use-pro"><span>২.২</span>সুবিধা (সুফল) ও অসুবিধা (কুফল)</h3>
        <table class="rt cmp">
          <thead><tr><th>সুবিধা বা সুফল</th><th>অসুবিধা বা কুফল</th></tr></thead>
          <tbody>
            <tr><td>মুহূর্তে ও কম খরচে বিশ্বজুড়ে যোগাযোগ</td><td>সাইবার অপরাধ: হ্যাকিং, প্রতারণা, তথ্য চুরি</td></tr>
            <tr><td>যেকোনো বিষয়ে বিপুল তথ্য হাতের কাছে</td><td>ভাইরাস ও ম্যালওয়্যারের আক্রমণ</td></tr>
            <tr><td>ঘরে বসে শিক্ষা, কেনাকাটা, ব্যাংকিং ও সরকারি সেবা</td><td>ভুয়া খবর ও গুজব দ্রুত ছড়ায়</td></tr>
            <tr><td>ব্যবসার প্রসার ও নতুন কর্মসংস্থান (ফ্রিল্যান্সিং)</td><td>ব্যক্তিগত তথ্যের গোপনীয়তা নষ্টের ঝুঁকি</td></tr>
            <tr><td>সময় ও যাতায়াতের খরচ বাঁচে</td><td>আসক্তি; পড়াশোনা ও শরীরের ক্ষতি, সামাজিক বিচ্ছিন্নতা</td></tr>
            <tr><td>বিনোদন ও সংবাদ সহজলভ্য</td><td>অশ্লীল ও ক্ষতিকর বিষয়বস্তু, বিশেষ করে শিশুদের জন্য</td></tr>
          </tbody>
        </table>
        <p class="tip"><b>সুফল-কুফলের প্রশ্নে:</b> দুই কলামের ছকে অন্তত পাঁচটি করে লিখুন, আর শেষে এক লাইনে বলুন: সচেতনভাবে ব্যবহার করলে ইন্টারনেটের সুফলই বেশি।</p>
        <h3 class="sub" id="search"><span>২.৩</span>সার্চ ইঞ্জিন</h3>
        <p class="defn"><b>সংজ্ঞা</b>যে ওয়েবভিত্তিক সফটওয়্যার ব্যবহারকারীর দেওয়া শব্দ (কি-ওয়ার্ড) দিয়ে ইন্টারনেটের কোটি কোটি ওয়েবপেজ থেকে প্রাসঙ্গিক পেজগুলোর তালিকা দেয়, তাকে সার্চ ইঞ্জিন বলে। যেমন Google, Bing, Yahoo, DuckDuckGo।</p>
        <ol class="algo">
          <li><b>ক্রলিং:</b> ক্রলার বা স্পাইডার নামের প্রোগ্রাম লিংক ধরে ধরে ওয়েবপেজ ঘুরে পড়ে।</li>
          <li><b>ইনডেক্সিং:</b> পড়া পেজের শব্দগুলো একটি বিশাল সূচিতে (ইনডেক্স) সাজিয়ে রাখে, যেমন বইয়ের শেষের নির্ঘণ্ট।</li>
          <li><b>খোঁজা ও সাজানো:</b> ব্যবহারকারী শব্দ লিখলে সূচি থেকে মিলে যাওয়া পেজ বের করে, প্রাসঙ্গিকতা অনুযায়ী সাজিয়ে তালিকা দেখায়।</li>
        </ol>
        <h3 class="sub" id="ecom"><span>২.৪</span>ই-কমার্স</h3>
        <p class="defn"><b>সংজ্ঞা</b>ইন্টারনেটের মাধ্যমে পণ্য ও সেবা কেনাবেচা এবং লেনদেনকে ই-কমার্স (Electronic Commerce) বলে। যেমন Daraz, Amazon, Alibaba।</p>
        <table class="rt cmp">
          <thead><tr><th>ধরন</th><th>কে কার কাছে বিক্রি করে</th><th>উদাহরণ</th></tr></thead>
          <tbody>
            <tr><td>B2C</td><td>ব্যবসা থেকে ভোক্তা</td><td>Daraz, Amazon</td></tr>
            <tr><td>B2B</td><td>ব্যবসা থেকে ব্যবসা</td><td>Alibaba (পাইকারি)</td></tr>
            <tr><td>C2C</td><td>ভোক্তা থেকে ভোক্তা</td><td>Bikroy, পুরোনো জিনিস বিক্রির সাইট</td></tr>
            <tr><td>B2G</td><td>ব্যবসা থেকে সরকার</td><td>সরকারি অনলাইন টেন্ডার (ই-জিপি)</td></tr>
          </tbody>
        </table>
        <ul class="pts">
          <li><b>সুবিধা:</b> দিনরাত ২৪ ঘণ্টা খোলা, বিশ্বজুড়ে ক্রেতা; দোকান ভাড়া লাগে না; দাম তুলনা করা সহজ; ঘরে পৌঁছে দেওয়া।</li>
          <li><b>অসুবিধা:</b> কেনার আগে পণ্য ছুঁয়ে দেখা যায় না; প্রতারণা ও নিম্নমানের পণ্যের ঝুঁকি; অনলাইন লেনদেনের নিরাপত্তা; ইন্টারনেট ও ডিজিটাল জ্ঞান লাগে।</li>
        </ul>
        <h3 class="sub" id="bbs"><span>২.৫</span>বুলেটিন বোর্ড</h3>
        <p class="defn"><b>সংজ্ঞা</b>বুলেটিন বোর্ড সিস্টেম (BBS) হলো এমন একটি কম্পিউটার ব্যবস্থা, যেখানে ব্যবহারকারীরা মডেম বা নেটওয়ার্কের মাধ্যমে যুক্ত হয়ে নির্দিষ্ট বিষয়ে বার্তা লিখতে, অন্যের বার্তা পড়তে, ফাইল আদান-প্রদান করতে ও আলোচনা করতে পারেন; ঠিক যেমন দেয়ালের নোটিশ বোর্ডে সবাই কাগজ টাঙায় ও পড়ে।</p>
        <ul class="pts">
          <li><b>কাজ:</b> বিষয়ভিত্তিক আলোচনা ও প্রশ্নোত্তর, নোটিশ ও খবর প্রকাশ, ফাইল ও সফটওয়্যার ডাউনলোড, সদস্যদের মধ্যে বার্তা বিনিময়।</li>
          <li><b>ইতিহাস:</b> প্রথম BBS (CBBS) চালু হয় ১৯৭৮ সালে শিকাগোতে; ইন্টারনেট সবার হাতে আসার আগে এটিই ছিল অনলাইন আলোচনার প্রধান মাধ্যম।</li>
          <li><b>আজকের রূপ:</b> অনলাইন ফোরাম, নিউজগ্রুপ, প্রশ্নোত্তর সাইট আর সামাজিক মাধ্যমের গ্রুপ বুলেটিন বোর্ডেরই আধুনিক রূপ।</li>
        </ul>

    <section class="blk" id="mail" data-topic="mail" data-short="ই-মেইল">
      <p class="blk-no">অংশ ৩<small>সিলেবাস ছ.২</small></p>
      <div class="body">
        <h2>ই-মেইল</h2>
        <p class="defn"><b>সংজ্ঞা</b>ই-মেইল (Electronic Mail) হলো ইন্টারনেটের মাধ্যমে এক কম্পিউটার বা মোবাইল থেকে আরেকটিতে লেখা, ছবি ও ফাইল পাঠানোর ইলেকট্রনিক ডাক ব্যবস্থা। পাঠাতে SMTP, আর পেতে POP3 বা IMAP প্রোটোকল ব্যবহৃত হয়।</p>
        <p class="prose">১৯৭১ সালে রে টমলিনসন ARPANET-এ প্রথম দুটি কম্পিউটারের মধ্যে ই-মেইল পাঠান এবং ব্যবহারকারী ও কম্পিউটারের নাম আলাদা করতে @ চিহ্নটি বেছে নেন। জনপ্রিয় ই-মেইল সেবা: Gmail, Outlook, Yahoo Mail।</p>
        <h3 class="sub" id="mail-addr"><span>৩.১</span>ই-মেইল ঠিকানার গঠন</h3>
        <p class="prose">প্রতিটি ই-মেইল ঠিকানা পৃথিবীতে অনন্য। এর তিনটি অংশ, যেমন <span class="m">rahim.cse@gmail.com</span>:</p>
        <table class="rt cmp">
          <thead><tr><th>অংশ</th><th>উদাহরণে</th><th>অর্থ</th></tr></thead>
          <tbody>
            <tr><td>ইউজার নাম</td><td><span class="m">rahim.cse</span></td><td>ব্যবহারকারীর নিজস্ব নাম; একই ডোমেইনে দুজনের এক নাম হয় না</td></tr>
            <tr><td>@ (অ্যাট) চিহ্ন</td><td><span class="m">@</span></td><td>ইউজার নাম আর ডোমেইনকে আলাদা করে; প্রতিটি ঠিকানায় অবশ্যই একটি</td></tr>
            <tr><td>ডোমেইন নাম</td><td><span class="m">gmail.com</span></td><td>মেইল সার্ভারের নাম (gmail) আর টপ লেভেল ডোমেইন (.com)</td></tr>
          </tbody>
        </table>
        <p class="prose">প্রতিষ্ঠানের ঠিকানায় ডোমেইন আরও ভাগ থাকে: <span class="m">info@du.ac.bd</span>-তে du মানে ঢাকা বিশ্ববিদ্যালয়, ac মানে শিক্ষাপ্রতিষ্ঠান (academic), bd মানে বাংলাদেশ। ঠিকানায় ফাঁকা স্থান চলে না, আর সাধারণত ছোট-বড় হাতের অক্ষরে পার্থক্য হয় না।</p>
        <h3 class="sub" id="mail-flow"><span>৩.২</span>ই-মেইল আদান-প্রদানের পদ্ধতি</h3>
        <ol class="chain" aria-label="প্রেরক থেকে প্রেরকের সার্ভার, তারপর প্রাপকের সার্ভার, তারপর প্রাপক">
          <li><b>প্রেরক</b><small>লিখে Send</small></li>
          <li><b>প্রেরকের সার্ভার</b><small>SMTP</small></li>
          <li><b>প্রাপকের সার্ভার</b><small>মেইলবক্সে জমা</small></li>
          <li><b>প্রাপক</b><small>POP3 / IMAP</small></li>
        </ol>
        <ol class="algo">
          <li>প্রেরক মেইল প্রোগ্রামে (Gmail, Outlook) প্রাপকের ঠিকানা, বিষয় ও বার্তা লিখে, প্রয়োজনে ফাইল সংযুক্ত করে Send চাপেন।</li>
          <li>বার্তাটি SMTP প্রোটোকলে প্রেরকের মেইল সার্ভারে যায়।</li>
          <li>সার্ভার ঠিকানার @-এর পরের ডোমেইন দেখে DNS থেকে প্রাপকের মেইল সার্ভার খুঁজে SMTP-তে সেখানে পাঠায়।</li>
          <li>বার্তাটি প্রাপকের মেইলবক্সে জমা থাকে; প্রাপক অফলাইনে থাকলেও হারায় না।</li>
          <li>প্রাপক নিজের সুবিধামতো POP3 বা IMAP প্রোটোকলে বার্তাটি নামিয়ে পড়েন এবং Reply বা Forward করতে পারেন।</li>
        </ol>
        <table class="rt cmp">
          <thead><tr><th>প্রোটোকল</th><th>কাজ</th></tr></thead>
          <tbody>
            <tr><td>SMTP</td><td>মেইল পাঠানো: প্রেরক থেকে সার্ভারে, এক সার্ভার থেকে আরেক সার্ভারে</td></tr>
            <tr><td>POP3</td><td>মেইল নামানো; সাধারণত নামানোর পর সার্ভার থেকে মুছে যায়, এক যন্ত্রে পড়ার উপযোগী</td></tr>
            <tr><td>IMAP</td><td>মেইল সার্ভারেই থাকে; মোবাইল, ল্যাপটপ সব যন্ত্রে একই মেইলবক্স দেখা যায়</td></tr>
          </tbody>
        </table>
        <h3 class="sub"><span>৩.৩</span>ই-মেইলের অংশ ও অপশন</h3>
        <ul class="pts">
          <li><b>To:</b> মূল প্রাপকের ঠিকানা।</li>
          <li><b>CC (Carbon Copy):</b> অনুলিপি; সব প্রাপক দেখতে পান কাকে কাকে পাঠানো হয়েছে।</li>
          <li><b>BCC (Blind Carbon Copy):</b> গোপন অনুলিপি; BCC-র প্রাপকের নাম অন্যরা দেখতে পান না।</li>
          <li><b>Subject:</b> বিষয়, এক লাইনে।</li>
          <li><b>Body ও Attachment:</b> মূল বার্তা; সঙ্গে ছবি, ডকুমেন্ট বা অন্য ফাইল সংযুক্ত করা যায়।</li>
          <li><b>ফোল্ডার:</b> Inbox (আসা মেইল), Sent (পাঠানো), Drafts (অসমাপ্ত), Spam বা Junk (অযাচিত), Trash (মোছা)।</li>
          <li><b>Reply, Reply All, Forward:</b> প্রেরককে উত্তর; সব প্রাপককে উত্তর; অন্য কাউকে বার্তাটি পাঠানো।</li>
        </ul>
        <h3 class="sub"><span>৩.৪</span>সুবিধা ও অসুবিধা</h3>
        <table class="rt cmp">
          <thead><tr><th>সুবিধা</th><th>অসুবিধা</th></tr></thead>
          <tbody>
            <tr><td>মুহূর্তে বিশ্বের যেকোনো জায়গায় পৌঁছায়</td><td>ইন্টারনেট সংযোগ ও যন্ত্র লাগে</td></tr>
            <tr><td>খরচ প্রায় নেই; কাগজ ও ডাকটিকিট লাগে না</td><td>স্প্যাম ও অযাচিত বিজ্ঞাপন</td></tr>
            <tr><td>একসঙ্গে অনেককে পাঠানো যায়</td><td>ভাইরাসযুক্ত সংযুক্তি ও প্রতারণামূলক (ফিশিং) মেইল</td></tr>
            <tr><td>ফাইল সংযুক্ত করা যায়; সংরক্ষণ ও খোঁজা সহজ</td><td>পাসওয়ার্ড চুরি হলে ব্যক্তিগত তথ্য ফাঁস</td></tr>
          </tbody>
        </table>
        <div data-prev="mail"></div>

        <p><b>নম্বর পেতে</b>ঠিকানার গঠনে একটি উদাহরণ ঠিকানা লিখে তিনটি অংশ তীর দিয়ে দেখান; আদান-প্রদানে চার ধাপের পথ আর SMTP, POP3, IMAP-এর নাম।</p>
        <p><b>বারবার এসেছে</b>৯টি পরীক্ষায়: এই অধ্যায়ের সবচেয়ে বেশি আসা অংশ।</p>

    <section class="blk" id="web" data-topic="web" data-short="WWW ও ওয়েবপেজ">
      <p class="blk-no">অংশ ৪<small>সিলেবাস ছ.৩</small></p>
      <div class="body">
        <h2>ওয়ার্ল্ড ওয়াইড ওয়েব (WWW)</h2>
        <p class="defn"><b>সংজ্ঞা</b>WWW (World Wide Web) হলো ইন্টারনেটে রাখা কোটি কোটি ওয়েবপেজের এমন একটি ব্যবস্থা, যেখানে পেজগুলো হাইপারলিংক দিয়ে একে অন্যের সঙ্গে যুক্ত এবং যেকোনো পেজ তার ঠিকানা (URL) দিয়ে ব্রাউজারে খোলা যায়। পেজগুলো HTML-এ লেখা হয় এবং HTTP প্রোটোকলে আসে।</p>
        <p class="prose">১৯৮৯ সালে সুইজারল্যান্ডের গবেষণাগার CERN-এ টিম বার্নার্স-লি ওয়েবের প্রস্তাব দেন; ১৯৯০ সালে প্রথম ওয়েব সার্ভার, ব্রাউজার ও ওয়েবপেজ তৈরি করেন, আর ১৯৯১ সালে ওয়েব সবার জন্য খুলে দেওয়া হয়। তাঁকে ওয়েবের জনক বলা হয়।</p>
        <h3 class="sub"><span>৪.১</span>ইন্টারনেট ও WWW এক নয়</h3>
        <table class="rt cmp">
          <thead><tr><th>বিষয়</th><th>ইন্টারনেট</th><th>WWW</th></tr></thead>
          <tbody>
            <tr><td>কী</td><td>কম্পিউটারের বিশ্বজোড়া নেটওয়ার্ক (তার, রাউটার, যন্ত্র)</td><td>সেই নেটওয়ার্কের ওপর চলা ওয়েবপেজের ব্যবস্থা</td></tr>
            <tr><td>সম্পর্ক</td><td>ভিত্তি; ওয়েব ছাড়াও ই-মেইল, FTP, ভিডিও কল চলে</td><td>ইন্টারনেটের একটি সেবা মাত্র</td></tr>
            <tr><td>প্রোটোকল</td><td>TCP/IP</td><td>HTTP, HTTPS</td></tr>
            <tr><td>শুরু</td><td>১৯৬৯ (ARPANET)</td><td>১৯৮৯–৯১ (টিম বার্নার্স-লি)</td></tr>
          </tbody>
        </table>
        <h3 class="sub" id="web-site"><span>৪.২</span>ওয়েবপেজ, ওয়েবসাইট ও হোমপেজ</h3>
        <ul class="pts">
          <li><b>ওয়েবপেজ:</b> ওয়েবের একটি একক ডকুমেন্ট (HTML পাতা), যাতে লেখা, ছবি, ভিডিও ও লিংক থাকে।</li>
          <li><b>ওয়েবসাইট:</b> একই ডোমেইনের অধীনে পরস্পর লিংক করা অনেক ওয়েবপেজের সমষ্টি; যেমন <span class="m">www.bangladesh.gov.bd</span>।</li>
          <li><b>হোমপেজ:</b> ওয়েবসাইটের প্রথম বা প্রধান পাতা; এখান থেকে বাকি পাতায় যাওয়া যায়।</li>
          <li><b>হাইপারলিংক:</b> পেজের যে লেখা বা ছবিতে ক্লিক করলে অন্য পেজে যাওয়া যায়।</li>
          <li><b>ওয়েব সার্ভার:</b> যে কম্পিউটারে ওয়েবসাইটের ফাইল রাখা থাকে এবং যা ব্রাউজারের অনুরোধে পেজ পাঠায়।</li>
        </ul>
        <table class="rt cmp">
          <thead><tr><th>বিষয়</th><th>ওয়েবপেজ</th><th>ওয়েবসাইট</th></tr></thead>
          <tbody>
            <tr><td>সংজ্ঞা</td><td>ওয়েবের একটি একক ডকুমেন্ট</td><td>পরস্পর লিংক করা অনেক ওয়েবপেজের সমষ্টি</td></tr>
            <tr><td>ঠিকানা</td><td>প্রতিটি পেজের নিজস্ব URL</td><td>একটি ডোমেইন নাম</td></tr>
            <tr><td>সম্পর্ক</td><td>ওয়েবসাইটের একটি অংশ</td><td>অনেক ওয়েবপেজ নিয়ে গঠিত</td></tr>
            <tr><td>হোমপেজ</td><td>নিজে হোমপেজ নাও হতে পারে</td><td>প্রথম পাতাটি হোমপেজ</td></tr>
            <tr><td>উদাহরণ</td><td>সংবাদপত্রের একটি খবরের পাতা</td><td>পুরো সংবাদপত্রের সাইট</td></tr>
          </tbody>
        </table>
        <h3 class="sub" id="url"><span>৪.৩</span>URL-এর গঠন</h3>
        <p class="defn"><b>URL (Uniform Resource Locator)</b>ইন্টারনেটে কোনো ওয়েবপেজ বা ফাইলের পূর্ণ ও অনন্য ঠিকানা। যেমন <span class="m">https://<wbr>www.bangladesh.gov.bd/<wbr>site/<wbr>page/<wbr>about.html</span></p>
        <table class="rt cmp">
          <thead><tr><th>অংশ</th><th>উদাহরণে</th><th>অর্থ</th></tr></thead>
          <tbody>
            <tr><td>প্রোটোকল</td><td><span class="m">https://</span></td><td>কোন নিয়মে পেজটি আসবে; s মানে নিরাপদ (এনক্রিপ্ট করা)</td></tr>
            <tr><td>সাবডোমেইন</td><td><span class="m">www</span></td><td>সাইটের ওয়েব অংশ</td></tr>
            <tr><td>ডোমেইন নাম</td><td><span class="m">bangladesh.gov.bd</span></td><td>প্রতিষ্ঠানের নাম, ধরন (gov) ও দেশ (bd)</td></tr>
            <tr><td>পাথ ও ফাইল</td><td><span class="m">/site/<wbr>page/<wbr>about.html</span></td><td>সার্ভারের কোন ফোল্ডারের কোন ফাইল</td></tr>
          </tbody>
        </table>
        <h3 class="sub" id="html"><span>৪.৪</span>HTML</h3>
        <p class="defn"><b>সংজ্ঞা</b>HTML (HyperText Markup Language) হলো ওয়েবপেজ তৈরির মার্কআপ ভাষা। ট্যাগ (&lt; &gt; চিহ্নের ভেতরের নির্দেশ) দিয়ে বলে দেওয়া হয় কোনটি শিরোনাম, কোনটি অনুচ্ছেদ, কোথায় ছবি বা লিংক; ব্রাউজার সেই অনুযায়ী পেজ সাজিয়ে দেখায়। এটি প্রোগ্রামিং ভাষা নয়।</p>
        <pre class="code">&lt;html&gt;
&lt;head&gt;
  &lt;title&gt;My School&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Welcome&lt;/h1&gt;
  &lt;p&gt;Read the
    &lt;a href="n.html"&gt;notice&lt;/a&gt;&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>
        <p class="prose">এখানে h1 শিরোনাম, p অনুচ্ছেদ, আর a একটি হাইপারলিংক; প্রায় প্রতিটি ট্যাগের একটি শুরুর ও একটি শেষের (/ চিহ্নসহ) রূপ থাকে। পেজের চেহারা সাজাতে CSS আর চলাফেরা বা হিসাব যোগ করতে JavaScript ব্যবহার হয়।</p>
        <h3 class="sub" id="web-role"><span>৪.৫</span>শিক্ষা ও ব্যবসায় WWW-এর ভূমিকা</h3>
        <ul class="pts">
          <li><b>শিক্ষা:</b> অনলাইন ক্লাস ও কোর্স (যেমন শিক্ষক বাতায়ন, কিশোর বাতায়ন), ই-বুক ও ডিজিটাল লাইব্রেরি, গবেষণাপত্র, ভর্তি ও পরীক্ষার ফল, শিক্ষামূলক ভিডিও; দূরের শিক্ষার্থীও ভালো শিক্ষকের কাছে পৌঁছায়।</li>
          <li><b>ব্যবসা:</b> প্রতিষ্ঠানের ওয়েবসাইটে পণ্যের প্রচার, অনলাইন বিক্রি (ই-কমার্স), গ্রাহকসেবা, অনলাইন বিজ্ঞাপন, বাজার গবেষণা, অনলাইন লেনদেন; ছোট উদ্যোক্তাও সারা দেশে বা বিদেশে বিক্রি করতে পারেন।</li>
        </ul>
        <div data-prev="web"></div>
        <p class="practice"><button class="btn line sm" type="button" data-practice="15,22,29,35-44" data-name="WWW ও ওয়েবপেজ">এই অংশের MCQ অনুশীলন <span></span></button><a href="#/mcq/ch07/q15">তালিকায় পড়ুন →</a></p>

        <p><b>MCQ-তে মনে রাখুন</b>WWW-এর জনক টিম বার্নার্স-লি; ওয়েবপেজ লেখার ভাষা HTML; ওয়েবপেজ আনার প্রোটোকল HTTP; পূর্ণ ঠিকানা URL।</p>
        <p><b>বারবার এসেছে</b>৬টি পরীক্ষায়: WWW কী, ওয়েবসাইট-ওয়েবপেজ, আর শিক্ষা ও ব্যবসায় ভূমিকা।</p>
