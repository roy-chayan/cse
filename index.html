    <section class="blk" id="browser" data-topic="browser" data-short="ওয়েব ব্রাউজার">
      <p class="blk-no">অংশ ৫<small>সিলেবাস ছ.৩</small></p>
      <div class="body">
        <h2>ওয়েব ব্রাউজার</h2>
        <p class="defn"><b>সংজ্ঞা</b>যে অ্যাপ্লিকেশন সফটওয়্যার দিয়ে ইন্টারনেটের ওয়ার্ল্ড ওয়াইড ওয়েবে থাকা ওয়েবপেজ খুঁজে, এনে পর্দায় দেখা যায়, তাকে ওয়েব ব্রাউজার বলে। এটি WWW-তে ঢোকার দরজা।</p>
        <h3 class="sub" id="browser-names"><span>৫.১</span>কয়েকটি ব্রাউজার</h3>
        <table class="rt cmp">
          <thead><tr><th>ব্রাউজার</th><th>প্রতিষ্ঠান</th></tr></thead>
          <tbody>
            <tr><td>Google Chrome</td><td>Google</td></tr>
            <tr><td>Mozilla Firefox</td><td>Mozilla Foundation</td></tr>
            <tr><td>Microsoft Edge</td><td>Microsoft</td></tr>
            <tr><td>Safari</td><td>Apple</td></tr>
            <tr><td>Opera</td><td>Opera</td></tr>
          </tbody>
        </table>
        <p class="prose">পুরোনো ব্রাউজার: WorldWideWeb (১৯৯০, টিম বার্নার্স-লির তৈরি প্রথম ব্রাউজার), Mosaic (১৯৯৩, প্রথম জনপ্রিয় চিত্রভিত্তিক ব্রাউজার), Netscape Navigator ও Internet Explorer। মনে রাখুন: Google একটি সার্চ ইঞ্জিন, Gmail ই-মেইল সেবা, আর MS Word ওয়ার্ড প্রসেসর; এগুলো ব্রাউজার নয়।</p>
        <h3 class="sub" id="browser-role"><span>৫.২</span>ব্রাউজারের কাজ ও ভূমিকা</h3>
        <ul class="pts">
          <li><b>পেজ আনা:</b> ব্যবহারকারী URL লিখলে বা লিংকে ক্লিক করলে HTTP অনুরোধ পাঠিয়ে ওয়েব সার্ভার থেকে পেজ আনে।</li>
          <li><b>পেজ দেখানো:</b> HTML, CSS ও JavaScript পড়ে লেখা, ছবি, ভিডিও সাজিয়ে পর্দায় দেখায়।</li>
          <li><b>চলাচল:</b> লিংক, পেছনে-সামনে যাওয়া, একাধিক ট্যাব, বুকমার্ক ও হিস্টোরি দিয়ে সহজে পেজ থেকে পেজে যাওয়া।</li>
          <li><b>অনুসন্ধান ও ডাউনলোড:</b> ঠিকানা বার থেকেই সার্চ ইঞ্জিনে খোঁজা; ফাইল নামানো।</li>
          <li><b>নিরাপত্তা:</b> HTTPS-এ এনক্রিপ্ট করা সংযোগ (ঠিকানা বারে তালার চিহ্ন), ক্ষতিকর সাইটের সতর্কবার্তা।</li>
        </ul>
        <h3 class="sub"><span>৫.৩</span>ঠিকানা লিখলে পেজ কীভাবে আসে</h3>
        <ol class="algo">
          <li>ব্যবহারকারী ঠিকানা বারে URL লেখেন, যেমন <span class="m">www.bangladesh.gov.bd</span>, আর Enter চাপেন।</li>
          <li>ব্রাউজার DNS সার্ভার থেকে ডোমেইন নামটির IP ঠিকানা জেনে নেয়।</li>
          <li>সেই IP ঠিকানার ওয়েব সার্ভারের সঙ্গে সংযোগ করে HTTP বা HTTPS অনুরোধ পাঠায়।</li>
          <li>সার্ভার পেজের HTML ফাইল, ছবি ও অন্যান্য ফাইল পাঠায়।</li>
          <li>ব্রাউজার ফাইলগুলো পড়ে পেজটি সাজিয়ে পর্দায় দেখায়; লিংকে ক্লিক করলে আবার একই ধাপ।</li>
        </ol>
        <h3 class="sub"><span>৫.৪</span>ব্রাউজার উইন্ডোর অংশ</h3>
        <ul class="pts">
          <li><b>ঠিকানা বার:</b> URL লেখা ও দেখা; এখান থেকে সার্চও করা যায়।</li>
          <li><b>ট্যাব:</b> একই উইন্ডোতে একাধিক পেজ।</li>
          <li><b>Back, Forward, Refresh:</b> আগের পেজ, পরের পেজ, পেজ আবার লোড।</li>
          <li><b>বুকমার্ক:</b> পছন্দের পেজের ঠিকানা সংরক্ষণ।</li>
          <li><b>হিস্টোরি:</b> আগে দেখা পেজের তালিকা।</li>
        </ul>

        <p><b>বারবার এসেছে</b>৭টি পরীক্ষায়: “ওয়েব ব্রাউজার কী? কয়েকটির নাম লিখুন” প্রায় হুবহু বারবার।</p>

    <section class="blk" id="terms" data-topic="terms" data-short="প্রোটোকল ও পূর্ণরূপ">
      <p class="blk-no">অংশ ৬</p>
      <div class="body">
        <h2>প্রোটোকল ও পূর্ণরূপ</h2>
        <h3 class="sub" id="protocol"><span>৬.১</span>প্রোটোকল</h3>
        <p class="defn"><b>সংজ্ঞা</b>নেটওয়ার্কে যুক্ত কম্পিউটারগুলো কীভাবে উপাত্ত পাঠাবে, গ্রহণ করবে ও বুঝবে, সেই সর্বসম্মত নিয়মের সমষ্টিকে প্রোটোকল বলে; যেমন দুজন মানুষের কথা বলতে একটি সাধারণ ভাষা লাগে।</p>
        <table class="rt cmp">
          <thead><tr><th>প্রোটোকল</th><th>কাজ</th></tr></thead>
          <tbody>
            <tr><td>TCP/IP</td><td>ইন্টারনেটের মূল প্রোটোকল; উপাত্ত প্যাকেটে ভাগ করে ঠিকানামতো পৌঁছায়</td></tr>
            <tr><td>HTTP / HTTPS</td><td>ওয়েব সার্ভার থেকে ব্রাউজারে ওয়েবপেজ আনা; HTTPS নিরাপদ (এনক্রিপ্ট করা)</td></tr>
            <tr><td>FTP</td><td>নেটওয়ার্কে এক কম্পিউটার থেকে আরেকটিতে ফাইল আদান-প্রদান</td></tr>
            <tr><td>SMTP</td><td>ই-মেইল পাঠানো</td></tr>
            <tr><td>POP3 / IMAP</td><td>ই-মেইল নামানো ও পড়া</td></tr>
            <tr><td>Telnet</td><td>দূরের কম্পিউটারে লগইন করে কাজ করা</td></tr>
          </tbody>
        </table>
        <p class="prose">ইন্টারনেটে ব্যবহৃত “দুটি প্রোটোকলের নাম” চাইলে TCP/IP আর HTTP লিখুন, পাশে এক লাইনে কাজ। FTP (File Transfer Protocol) দিয়ে ওয়েবসাইটের ফাইল সার্ভারে তোলা বা বড় ফাইল নামানো হয়।</p>
        <h3 class="sub" id="full-forms"><span>৬.২</span>যে পূর্ণরূপগুলো বারবার আসে</h3>

          </tbody>
        </table>
        <p class="prose">ছোট প্রশ্নে কম্পিউটারের অন্য পূর্ণরূপও (ENIAC, UNIVAC, EPROM, ALU, BCD, CD) মিশিয়ে আসে; সেগুলো আছে <a href="#/note/computer-basics/hist">অধ্যায় ১ · যে পূর্ণরূপগুলো বারবার আসে</a> অংশে।</p>
        <div data-prev="terms"></div>
        <p class="practice"><button class="btn line sm" type="button" data-practice="16,30,51-57" data-name="প্রোটোকল ও পূর্ণরূপ">এই অংশের MCQ অনুশীলন <span></span></button><a href="#/mcq/ch07/q16">তালিকায় পড়ুন →</a></p>

        <p><b>নম্বর পেতে</b>পূর্ণরূপের প্রশ্নে শুধু পূর্ণরূপ নয়, এক লাইনে কাজটিও লিখুন; বানান ঠিক রাখুন।</p>
        <p><b>বারবার এসেছে</b>৫টি পরীক্ষায়: পাঁচটি পূর্ণরূপের ছোট প্রশ্ন, আর প্রোটোকলের নাম।</p>

    <section class="blk" id="mistakes">

      <div class="body">

        <div class="fixes">
          <div class="fix"><p class="was">ইন্টারনেট আর WWW একই</p><p class="is">WWW ইন্টারনেটের একটি সেবা</p><p class="why">ই-মেইল, FTP, ভিডিও কলও ইন্টারনেটে চলে, ওয়েব ছাড়াই।</p></div>
          <div class="fix"><p class="was">Google একটি ব্রাউজার</p><p class="is">Google সার্চ ইঞ্জিন; Chrome ব্রাউজার</p><p class="why">ব্রাউজার পেজ দেখায়; সার্চ ইঞ্জিন পেজ খুঁজে দেয়।</p></div>
          <div class="fix"><p class="was">ওয়েবসাইট মানে একটি পেজ</p><p class="is">ওয়েবসাইট অনেক ওয়েবপেজের সমষ্টি</p><p class="why">প্রথম পাতাটি হোমপেজ।</p></div>
          <div class="fix"><p class="was">POP3 দিয়ে মেইল পাঠানো হয়</p><p class="is">পাঠাতে SMTP; নামাতে POP3 বা IMAP</p><p class="why">S মনে রাখুন: Send-এর SMTP।</p></div>
          <div class="fix"><p class="was">CC-র প্রাপক লুকানো থাকে</p><p class="is">লুকানো থাকে BCC-র প্রাপক</p><p class="why">B মানে Blind।</p></div>
          <div class="fix"><p class="was">HTML একটি প্রোগ্রামিং ভাষা</p><p class="is">HTML মার্কআপ ভাষা</p><p class="why">এতে হিসাব বা সিদ্ধান্ত নেই; শুধু পেজের গঠন বলে দেয়।</p></div>
          <div class="fix"><p class="was">URL = Universal Resource Locator</p><p class="is">URL = Uniform Resource Locator</p><p class="why">প্রথম শব্দটি Uniform।</p></div>
          <div class="fix"><p class="was">ই-মেইল ঠিকানায় একাধিক @</p><p class="is">ঠিক একটি @</p><p class="why">@ ইউজার নাম আর ডোমেইনকে আলাদা করে।</p></div>

  <p class="split-note">প্রশ্নে নম্বর ভাগ করা নেই। প্রজন্মের ধারণায় ২ আর পাঁচ প্রজন্মের বৈশিষ্ট্যে ৮ ধরে লিখলে উত্তর গোছানো হয়।</p>

    <p class="prose">প্রজন্ম ভাগ করা হয় মূলত প্রযুক্তি দেখে। প্রতিটি নতুন প্রজন্মে কম্পিউটার আগের চেয়ে ছোট, দ্রুত, সস্তা ও নির্ভরযোগ্য হয়েছে। এ পর্যন্ত কম্পিউটারের বিকাশকে পাঁচটি প্রজন্মে ভাগ করা হয়।</p>

    <p class="prose">OR গেইটের পরে NOT যুক্ত করলে NOR গেইট হয়: Y = <span class="m"><span class="ov">A + B</span></span>।</p>
    <div class="gates">
      <figure class="fig gate-sym"><svg viewBox="0 0 150 64" role="img" aria-label="NOR গেইটের প্রতীক"><text x="0" y="24" text-anchor="start">A</text><path class="w" d="M12 20 L45 20"/><text x="0" y="44" text-anchor="start">B</text><path class="w" d="M12 40 L45 40"/><path class="gb" d="M40 10Q54 30 40 50Q66 50 78 30Q66 10 40 10Z"/><circle class="gb" cx="82" cy="30" r="4"/><path class="w" d="M86 30 L118 30"/><text x="122" y="34" text-anchor="start">Y</text></svg><figcaption>NOR গেইটের প্রতীক</figcaption></figure>

    </div>
    <ul class="pts">
      <li><b>NOT:</b> দুই ইনপুট একসঙ্গে জুড়ে দিলে <span class="m"><span class="ov">A + A</span> = <span class="ov">A</span></span></li>
      <li><b>OR:</b> NOR-এর আউটপুট আরেকটি NOR দিয়ে উল্টে দিলে <span class="m"><span class="ov"><span class="ov">A + B</span></span> = A + B</span></li>
      <li><b>AND:</b> দুই ইনপুটকে আগে উল্টে NOR-এ দিলে <span class="m"><span class="ov"><span class="ov">A</span> + <span class="ov">B</span></span> = A·B</span> (ডি মরগানের সূত্র)</li>
    </ul>

/><circle class="gb" cx="506" cy="110" r="4"/><path class="w" d="M510 40 L526 40 L526 65 L547 65"/><text x="514" y="33" text-anchor="start"><tspan text-decoration="overline">A</tspan></text><path class="w" d="M510 110 L526 110 L526 85 L547 85"/><text x="514" y="127" text-anchor="start"><tspan text-decoration="overline">B</tspan></text><path class="gb" d="M542 55Q556 75 542 95Q568 95 580 75Q568 55 542 55Z"/><circle class="gb" cx="584" cy="75" r="4"/><path class="w" d="M588 75 L606 75"/><text x="611" y="79" text-anchor="start">A·B</text><text class="cap" x="530" y="146" text-anchor="middle">AND</text></svg>

    <p class="prose">শুধু NOR দিয়েও তিনটি মৌলিক গেইট তৈরি করা যায়, তাই NOR-ও সার্বজনীন গেইট।</p>
  </section>
</div>
<aside class="side">
  <p><b>নম্বর পেতে</b>প্রতীক আঁকুন, সত্যক সারণি দিন, তারপর তিনটি মৌলিক গেইট শুধু NAND (বা NOR) দিয়ে এঁকে দেখান। ৪ নম্বরের বেশিটাই চিত্রে।</p>
  <p><b>মনে রাখুন</b>OR তৈরিতে NAND লাগে তিনটি, AND তৈরিতে দুটি, NOT তৈরিতে একটি। NOR-এর বেলায় উল্টো: AND-এ তিনটি, OR-এ দুটি।</p>
  <p class="tags"><span class="xt">অধ্যায়: লজিক সার্কিট ও লজিক গেট</span></p>

<template id="wa-18-school-5">
<div class="ans-body">
  <section class="part">
    <h3 class="part-h"><span>২-এর পরিপূরক পদ্ধতি</span><i class="bub mk">২</i></h3>
    <p class="defn"><b>সংজ্ঞা</b>কোনো বাইনারি সংখ্যার প্রতিটি বিট উল্টে দিয়ে (১-এর পরিপূরক) তার সঙ্গে ১ যোগ করলে যে সংখ্যা পাওয়া যায়, তাকে ঐ সংখ্যার ২-এর পরিপূরক বলে।</p>
    <p class="prose">কম্পিউটার এ পদ্ধতিতে ঋণাত্মক সংখ্যা প্রকাশ করে, আর বিয়োগকে যোগে পরিণত করে একই যোগ-সার্কিটে বিয়োগ করে। সবচেয়ে বাঁয়ের বিটটি চিহ্ন বিট: ০ হলে সংখ্যা ধনাত্মক, ১ হলে ঋণাত্মক।</p>
  </section>

  <section class="part">
    <h3 class="part-h"><span>(−১৫)<sub>১০</sub> থেকে (+১১)<sub>১০</sub> বিয়োগ</span><i class="bub mk">৮</i></h3>
    <p class="prose">(−১৫) − (+১১) = (−১৫) + (−১১)। তাই −১৫ ও −১১-কে ২-এর পরিপূরকে প্রকাশ করে যোগ করব। ৮ বিট ধরা হলো।</p>

    <h4 class="sub-h"><span>ধাপ ১</span>−১৫ নির্ণয়</h4>
    <div class="bcalc">
      <code>0000 1111</code><span>(+১৫)<sub>১০</sub></span>
      <code>1111 0000</code><span>সব বিট উল্টে (১-এর পরিপূরক)</span>
      <code class="add">+         1</code><span>১ যোগ</span>
      <code class="res">1111 0001</code><span><b>−১৫</b> (২-এর পরিপূরক)</span>
    </div>

    <h4 class="sub-h"><span>ধাপ ২</span>−১১ নির্ণয়</h4>
    <div class="bcalc">
      <code>0000 1011</code><span>(+১১)<sub>১০</sub></span>
      <code>1111 0100</code><span>সব বিট উল্টে (১-এর পরিপূরক)</span>
      <code class="add">+         1</code><span>১ যোগ</span>
      <code class="res">1111 0101</code><span><b>−১১</b> (২-এর পরিপূরক)</span>
    </div>

    <h4 class="sub-h"><span>ধাপ ৩</span>যোগ</h4>
    <div class="bcalc">
      <code>  1111 0001</code><span>−১৫</span>
      <code class="add">+ 1111 0101</code><span>−১১</span>
      <code class="res"><i class="carry" title="শেষ ক্যারি">1</i> 1110 0110</code><span>শেষ ক্যারি <i class="carry">1</i> বাদ দিলে <b>1110 0110</b></span>
    </div>

    <h4 class="sub-h"><span>ধাপ ৪</span>ফল পড়া</h4>
    <p class="prose">চিহ্ন বিট ১, তাই ফল ঋণাত্মক। মান জানতে আবার ২-এর পরিপূরক নিই:</p>
    <div class="bcalc">
      <code>1110 0110</code><span>ফল</span>
      <code>0001 1001</code><span>সব বিট উল্টে</span>
      <code class="add">+         1</code><span>১ যোগ</span>
      <code class="res">0001 1010</code><span>= (২৬)<sub>১০</sub></span>
    </div>
    <p class="final"><b>উত্তর</b>(−১৫)<sub>১০</sub> − (+১১)<sub>১০</sub> = (−২৬)<sub>১০</sub> = (1110 0110)<sub>২</sub></p>
  </section>
</div>
<aside class="side">
  <p><b>প্রথম লাইনেই</b>কত বিট ধরছেন লিখে দিন (এখানে ৮ বিট)।</p>
  <p><b>নম্বর কাটে যেখানে</b>শেষ ক্যারি বাদ দেওয়ার কথা না লিখলে, আর ফল ঋণাত্মক হলে তার মান না দেখালে।</p>
  <p><b>যাচাই</b>শেষে এক লাইনে লিখুন: −১৫ − ১১ = −২৬।</p>
  <p class="tags"><span class="xt">অধ্যায়: সংখ্যা পদ্ধতি</span></p>
</aside>
</template>

    <p class="prose">তবে আমার মতে এটি বাইনারি সংখ্যা হওয়াই সবচেয়ে যুক্তিসংগত। সংখ্যাটি শুধু ০ ও ১ দিয়ে লেখা, যা বাইনারির নিজস্ব দুটি অঙ্ক; কম্পিউটারও সব তথ্য এ দুটি অঙ্কেই রাখে। অন্য পদ্ধতির সংখ্যা হলে সাধারণত তাতে ১-এর চেয়ে বড় কোনো অঙ্কও থাকত।</p>
    <p class="final"><b>উত্তর</b>(110101) বাইনারি, অক্টাল, দশমিক বা হেক্সাডেসিমেল যেকোনো পদ্ধতির হতে পারে; সবচেয়ে সম্ভাব্য বাইনারি, যার মান (৫৩)<sub>১০</sub>।</p>

    <h3 class="part-h"><span>সরলীকরণ ও NAND দিয়ে বাস্তবায়ন</span><i class="bub mk">৫</i></h3>

    <p class="final"><b>সরলীকৃত মান</b>X = AB + BC + CA</p>

    <h4 class="sub-h"><span>যাচাই</span>সত্যক সারণি</h4>
    <table class="truth">

    <h4 class="sub-h"><span>ধাপ ২</span>NAND রূপ</h4>
    <ul class="eqs">
      <li><span>X = AB + BC + CA</span></li>

    </ul>
    <p class="prose">প্রতিটি <span class="m"><span class="ov">AB</span></span> একটি ২-ইনপুট NAND গেইটের আউটপুট, আর বাইরের বারটি তিনটি আউটপুটকে একটি ৩-ইনপুট NAND গেইটে নেয়। মোট ৪টি NAND গেইট লাগে।</p>
    <figure class="fig wide mid"><svg viewBox="0 0 520 240" role="img" aria-label="শুধু NAND গেইট দিয়ে X: A ও B, B ও C, C ও A তিনটি ২-ইনপুট NAND গেইটে যায়; তাদের তিনটি আউটপুট একটি ৩-ইনপুট NAND গেইটে গিয়ে X দেয়।"><text x="52" y="18" text-anchor="middle">A</text><path class="w" d="M52 26 L52 206"/><text x="82" y="18" text-anchor="middle">B</text><path class="w" d="M82 26 L82 206"/><text x="112" y="18" text-anchor="middle">C</text><path class="w" d="M112 26 L112 206"/><path class="w" d="M52 40 L190 40"/><circle class="j" cx="52" cy="40" r="2.6"/><path class="w" d="M82 60 L190 60"/><circle class="j" cx="82" cy="60" r="2.6"/><path class="gb" d="M190 30H208A20 20 0 0 1 208 70H190Z"/><circle class="gb" cx="232" cy="50" r="4"/><path class="w" d="M82 110 L190 110"/><circle class="j" cx="82" cy="110" r="2.6"/><path class="w" d="M112 130 L190 130"/><circle class="j" cx="112" cy="130" r="2.6"/><path class="gb" d="M190 100H208A20 20 0 0 1 208 140H190Z"/><circle class="gb" cx="232" cy="120" r="4"/><path class="w" d="M112 180 L190 180"/><circle class="j" cx="112" cy="180" r="2.6"/><path class="w" d="M52 200 L190 200"/><circle class="j" cx="52" cy="200" r="2.6"/><path class="gb" d="M190 170H208A20 20 0 0 1 208 210H190Z"/><circle class="gb" cx="232" cy="190" r="4"/><path class="w" d="M236 50 L330 50 L330 104 L380 104"/><text x="244" y="43" text-anchor="start"><tspan text-decoration="overline">AB</tspan></text><path class="w" d="M236 120 L380 120"/><text x="244" y="113" text-anchor="start"><tspan text-decoration="overline">BC</tspan></text><path class="w" d="M236 190 L330 190 L330 136 L380 136"/><text x="244" y="183" text-anchor="start"><tspan text-decoration="overline">CA</tspan></text><path class="gb" d="M380 90H398A30 30 0 0 1 398 150H380Z"/><circle class="gb" cx="432" cy="120" r="4"/><path class="w" d="M436 120 L468 120"/><text x="474" y="125" text-anchor="start">X</text><text class="cap" x="211" y="232" text-anchor="middle">২-ইনপুট NAND × ৩</text><text class="cap" x="405" y="232" text-anchor="middle">৩-ইনপুট NAND</text></svg>

  <section class="part">
    <h3 class="part-h"><span>NOR দিয়ে বাস্তবায়ন</span><i class="bub mk">৫</i></h3>
    <p class="prose">NOR দিয়ে সরাসরি বাস্তবায়নের জন্য X-কে যোগফলের গুণ (POS) রূপে আনতে হয়।</p>
    <h4 class="sub-h"><span>ধাপ ১</span>POS রূপ</h4>
    <ul class="eqs">
      <li><span>(A + B)(C + A) = A + BC</span><small>বণ্টন সূত্র</small></li>
      <li><span>∴ (A + B)(B + C)(C + A) = (A + BC)(B + C)</span></li>
      <li><span>= AB + AC + BC + BC</span></li>
      <li><span>= AB + BC + CA = X</span><small>BC + BC = BC</small></li>
    </ul>
    <p class="final"><b>POS রূপ</b>X = (A + B)(B + C)(C + A)</p>

    <h4 class="sub-h"><span>ধাপ ২</span>NOR রূপ</h4>
    <ul class="eqs">
      <li><span>X = (A + B)(B + C)(C + A)</span></li>
      <li><span>= <span class="ov"><span class="ov">(A + B)(B + C)(C + A)</span></span></span><small>দুবার পূরক</small></li>
      <li><span>= <span class="ov"><span class="ov">A + B</span> + <span class="ov">B + C</span> + <span class="ov">C + A</span></span></span><small>ডি মরগানের সূত্র</small></li>
    </ul>
    <p class="prose">প্রতিটি <span class="m"><span class="ov">A + B</span></span> একটি ২-ইনপুট NOR গেইটের আউটপুট, আর বাইরের বারটি তিনটি আউটপুটকে একটি ৩-ইনপুট NOR গেইটে নেয়। এখানেও মোট ৪টি গেইট।</p>

 text-anchor="middle">২-ইনপুট NOR × ৩</text><text class="cap" x="405" y="232" text-anchor="middle">৩-ইনপুট NOR</text></svg>
      <figcaption>চিত্র ২: শুধু NOR গেইট দিয়ে X = (A + B)(B + C)(C + A)</figcaption></figure>
  </section>

<aside class="side">
  <p><b>নম্বর পেতে</b>সরলীকরণের প্রতিটি লাইনের পাশে কোন সূত্র লাগালেন লিখুন। চিত্রে প্রতিটি গেইটের আউটপুটের নাম (যেমন <span class="ov">AB</span>) লিখে দিন।</p>
  <p><b>মনে রাখুন</b>SOP রূপ থেকে NAND-NAND, POS রূপ থেকে NOR-NOR। দুই ক্ষেত্রেই দুই স্তর, ৪টি গেইট।</p>
