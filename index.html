        <ul class="eqs">
          <li><span>Y = (<span class="ov">A</span>B + C)·A<span class="ov">B</span></span><small>সার্কিটের আউটপুট</small></li>
          <li><span>= <span class="ov">A</span>B·A<span class="ov">B</span> + C·A<span class="ov">B</span></span><small>গুণ ছড়িয়ে</small></li>
          <li><span>= (<span class="ov">A</span>A)(B<span class="ov">B</span>) + A<span class="ov">B</span>C</span><small>বিনিময়</small></li>
          <li><span>= 0 + A<span class="ov">B</span>C = A<span class="ov">B</span>C</span><small>X·<span class="ov">X</span> = 0</small></li>
        </ul>
        <p class="final"><b>সরল রূপ</b>Y = A<span class="ov">B</span>C</p>
        <p class="prose">উত্তরে আগে প্রশ্নের সমীকরণের সার্কিট দিন; সরল রূপ দেখালে বাড়তি সুবিধা: A<span class="ov">B</span>C-তে লাগে মাত্র একটি NOT আর একটি তিন-ইনপুট AND।</p>
        <h4 class="sub-h" id="pp9-4"><span>৯ম · ২০১৩</span><span>প্রশ্ন ৪: Y = <span class="ov">A + <span class="ov">B + C</span></span></span></h4>
        <p class="prose">চাওয়া হয়েছে: লজিক সার্কিট। ভেতরের বার B + C-এর ওপর, বাইরের বার পুরো রাশির ওপর: দুটিই OR-এর পরে NOT, অর্থাৎ দুটি NOR গেট।</p>

            <path class="gb" d="M160 30Q174 50 160 70Q185.8 70 198 50Q185.8 30 160 30Z"/><circle class="gb" cx="202" cy="50" r="4"/>
            <foreignObject x="108" y="96" width="40" height="34" overflow="visible"><div class="flab"><span class="ov">B+C</span></div></foreignObject>
            <foreignObject x="236" y="35" width="67" height="34" overflow="visible"><div class="flab">Y = <span class="ov">A+<span class="ov">B+C</span></span></div></foreignObject>
          </svg>
        </figure>
        <ul class="eqs">
          <li><span>Y = <span class="ov">A + <span class="ov">B + C</span></span></span><small>সার্কিটের আউটপুট</small></li>
          <li><span>= <span class="ov">A</span>·<span class="ov"><span class="ov">B + C</span></span></span><small>ডি মরগান: <span class="ov">X + Z</span> = <span class="ov">X</span>·<span class="ov">Z</span></small></li>
          <li><span>= <span class="ov">A</span>(B + C) = <span class="ov">A</span>B + <span class="ov">A</span>C</span><small>দ্বৈত পূরক, গুণ ছড়িয়ে</small></li>
        </ul>
        <p class="final"><b>সরল রূপ</b>Y = <span class="ov">A</span>(B + C)</p>
        <p class="prose">মৌলিক গেট দিয়ে আঁকতে চাইলে প্রতিটি NOR-এর জায়গায় একটি OR, তার পরে একটি NOT বসান।</p>
        <h4 class="sub-h" id="pp8-3"><span>৮ম · ২০১২</span><span>প্রশ্ন ৩ (অথবা): X = AB + ABC + ABC</span></h4>
        <p class="prose">ছাপা প্রশ্নে পদগুলোর ওপরের বার দেখা যায় না, তাই যেভাবে ছাপা সেভাবেই সমাধান। খাতায় শুরুতে এক লাইনে লিখে দিন যে সমীকরণটি ছাপা রূপে পড়েছেন।</p>
        <ul class="eqs">
          <li><span>X = AB + ABC + ABC</span><small>প্রশ্নের সমীকরণ</small></li>
          <li><span>= AB + ABC</span><small>X + X = X</small></li>
          <li><span>= AB(1 + C) = AB</span><small>1 + C = 1 (শোষণ সূত্র)</small></li>
        </ul>
        <p class="final"><b>ফল</b>X = AB</p>
        <figure class="fig eqfig">
          <svg viewBox="0 0 200 70" width="230" role="img" aria-label="লজিক সার্কিট: A ও B একটি AND গেটে গিয়ে X দেয়।">
            <text x="4" y="34" text-anchor="start">A</text>
            <text x="4" y="54" text-anchor="start">B</text>
            <path class="w" d="M16 30H61M16 50H61M98 40H124"/>
            <path class="gb" d="M60 20H78A20 20 0 0 1 78 60H60Z"/>
            <foreignObject x="130" y="31" width="60" height="34" overflow="visible"><div class="flab">X = AB</div></foreignObject>
          </svg>
        </figure>
        <h4 class="sub-h" id="pp8-7"><span>৮ম · ২০১২</span><span>প্রশ্ন ৭: F = (AB + C)(BC + B)</span></h4>
        <p class="prose">চাওয়া হয়েছে: ফাংশনটি ব্যবহার করে লজিক সার্কিট। যেমন আছে তেমন আঁকলে লাগে তিনটি AND আর দুটি OR।</p>
        <figure class="fig eqfig">
          <svg viewBox="0 0 390 175" width="448" role="img" aria-label="লজিক সার্কিট: A ও B একটি AND-এ, তার ফল ও C একটি OR-এ; B ও C আরেকটি AND-এ, তার ফল ও B আরেকটি OR-এ; দুই OR-এর ফল শেষ AND-এ গিয়ে F দেয়।">
            <text x="26" y="12" text-anchor="start">A</text>
            <text x="42" y="12" text-anchor="start">B</text>
            <text x="58" y="12" text-anchor="start">C</text>
            <path class="w" d="M30 18V30M46 18V160M62 18V130M30 30H101M46 50H101M62 70H186.3M46 110H101M62 130H101M46 160H186.3M138 40H160V50H186.3M138 120H160V140H186.3M218 60H240V95H271M218 150H240V115H271M308 105H330"/>
            <path class="gb" d="M100 20H118A20 20 0 0 1 118 60H100Z"/>
            <path class="gb" d="M180 40Q194 60 180 80Q205.8 80 218 60Q205.8 40 180 40Z"/>
            <path class="gb" d="M100 100H118A20 20 0 0 1 118 140H100Z"/>
            <path class="gb" d="M180 130Q194 150 180 170Q205.8 170 218 150Q205.8 130 180 130Z"/>
            <path class="gb" d="M270 85H288A20 20 0 0 1 288 125H270Z"/>
            <circle class="j" cx="30" cy="30" r="2.6"/>
            <circle class="j" cx="46" cy="50" r="2.6"/>
            <circle class="j" cx="62" cy="70" r="2.6"/>
            <circle class="j" cx="46" cy="110" r="2.6"/>
            <circle class="j" cx="62" cy="130" r="2.6"/>
            <circle class="j" cx="46" cy="160" r="2.6"/>
            <foreignObject x="141" y="22" width="30" height="34" overflow="visible"><div class="flab">AB</div></foreignObject>
            <foreignObject x="220" y="42" width="50" height="34" overflow="visible"><div class="flab">AB+C</div></foreignObject>
            <foreignObject x="141" y="102" width="30" height="34" overflow="visible"><div class="flab">BC</div></foreignObject>
            <foreignObject x="220" y="154" width="50" height="34" overflow="visible"><div class="flab">BC+B</div></foreignObject>
            <foreignObject x="312" y="87" width="20" height="34" overflow="visible"><div class="flab">F</div></foreignObject>
            <foreignObject x="262" y="126" width="126" height="34" overflow="visible"><div class="flab">F = (AB+C)(BC+B)</div></foreignObject>
          </svg>
        </figure>
        <ul class="eqs">
          <li><span>F = (AB + C)(BC + B)</span><small>সার্কিটের আউটপুট</small></li>
          <li><span>= (AB + C)·B(C + 1)</span><small>সাধারণ উৎপাদক B</small></li>
          <li><span>= (AB + C)·B</span><small>C + 1 = 1</small></li>
          <li><span>= AB·B + BC = AB + BC</span><small>গুণ ছড়িয়ে, B·B = B</small></li>
          <li><span>= B(A + C)</span><small>সাধারণ উৎপাদক B</small></li>
        </ul>
        <p class="final"><b>সরল রূপ</b>F = B(A + C)</p>
        <p class="prose">সরল রূপে মাত্র দুটি গেট: A ও C একটি OR-এ, তার ফল ও B একটি AND-এ।</p>
        <h4 class="sub-h" id="pp7-9"><span>৭ম · ২০১১</span><span>প্রশ্ন ৯: F = AB + AB + AC</span></h4>
        <p class="prose">ছাপা প্রশ্নে বার দেখা যায় না; যেভাবে ছাপা সেভাবে পড়লে প্রথম দুটি পদ একই, তাই আগে সরল করে তারপর সার্কিট।</p>
        <ul class="eqs">
          <li><span>F = AB + AB + AC</span><small>প্রশ্নের সমীকরণ</small></li>
          <li><span>= AB + AC</span><small>X + X = X</small></li>
          <li><span>= A(B + C)</span><small>সাধারণ উৎপাদক A</small></li>
        </ul>
        <p class="final"><b>ফল</b>F = A(B + C)</p>
        <figure class="fig eqfig">
          <svg viewBox="0 0 300 100" width="345" role="img" aria-label="লজিক সার্কিট: B ও C একটি OR-এ; তার ফল ও A একটি AND-এ গিয়ে F দেয়।">
            <text x="4" y="34" text-anchor="start">A</text>
            <text x="4" y="64" text-anchor="start">B</text>
            <text x="4" y="84" text-anchor="start">C</text>
            <path class="w" d="M16 30H151M16 60H66.3M16 80H66.3M98 70H120V50H151M188 40H210"/>

            <foreignObject x="216" y="31" width="80" height="34" overflow="visible"><div class="flab">F = A(B+C)</div></foreignObject>
          </svg>
        </figure>
        <h4 class="sub-h" id="pp6-4"><span>৬ষ্ঠ · ২০০৯</span><span>প্রশ্ন ৪ (অথবা): A + B + C − BC</span></h4>
        <p class="prose">বুলিয়ান অ্যালজেবরায় বিয়োগ বলে কিছু নেই, তাই ছাপা “−” চিহ্নটি ছাপার ভুল। বাকি সব চিহ্ন যোগ বলে এটিকেও যোগ ধরা হলো: Y = A + B + C + BC। খাতায় শুরুতে এই কথাটি এক লাইনে লিখে দিন।</p>
        <figure class="fig eqfig">
          <svg viewBox="0 0 300 150" width="345" role="img" aria-label="লজিক সার্কিট: B ও C একটি AND-এ; A, B, C ও সেই ফল একটি চার-ইনপুট OR-এ গিয়ে Y দেয়।">
            <text x="26" y="12" text-anchor="start">A</text>
            <text x="42" y="12" text-anchor="start">B</text>
            <text x="58" y="12" text-anchor="start">C</text>
            <path class="w" d="M30 18V36M46 18V110M62 18V130M30 36H187M46 52H192.2M62 68H192.2M46 110H91M62 130H91M128 120H150V84H187M232 60H256"/>
            <path class="gb" d="M90 100H108A20 20 0 0 1 108 140H90Z"/>
            <path class="gb" d="M180 26Q203.8 60 180 94Q215.4 94 232 60Q215.4 26 180 26Z"/>
            <circle class="j" cx="30" cy="36" r="2.6"/>
            <circle class="j" cx="46" cy="52" r="2.6"/>
            <circle class="j" cx="62" cy="68" r="2.6"/>
            <circle class="j" cx="46" cy="110" r="2.6"/>
            <circle class="j" cx="62" cy="130" r="2.6"/>
            <foreignObject x="130" y="102" width="30" height="34" overflow="visible"><div class="flab">BC</div></foreignObject>
            <foreignObject x="238" y="42" width="20" height="34" overflow="visible"><div class="flab">Y</div></foreignObject>
            <foreignObject x="186" y="98" width="110" height="34" overflow="visible"><div class="flab">Y = A+B+C+BC</div></foreignObject>
          </svg>
        </figure>
        <ul class="eqs">
          <li><span>Y = A + B + C + BC</span><small>সার্কিটের আউটপুট</small></li>
          <li><span>= A + B + C(1 + B)</span><small>সাধারণ উৎপাদক C</small></li>
          <li><span>= A + B + C</span><small>1 + B = 1</small></li>
        </ul>
        <p class="final"><b>সরল রূপ</b>Y = A + B + C</p>
        <p class="prose">সরল রূপে একটি তিন-ইনপুট OR-ই যথেষ্ট। আর “−”-কে গুণ (·) ধরলে: A + B + C·BC = A + B + BC = A + B(1 + C) = A + B।</p>
        <h4 class="sub-h" id="pp6-5"><span>৬ষ্ঠ · ২০০৯</span><span>প্রশ্ন ৫ (অথবা): ABC + ABC + ABC + ABC</span></h4>
        <p class="prose">ছাপায় চারটি পদের কোনোটির ওপর বার দেখা যায় না। যেভাবে ছাপা সেভাবে পড়লে:</p>
        <ul class="eqs">
          <li><span>Y = ABC + ABC + ABC + ABC</span><small>প্রশ্নের সমীকরণ</small></li>
          <li><span>= ABC</span><small>X + X = X</small></li>
        </ul>
        <p class="final"><b>ফল</b>Y = ABC</p>
        <figure class="fig eqfig">
          <svg viewBox="0 0 210 78" width="241" role="img" aria-label="লজিক সার্কিট: A, B, C একটি তিন-ইনপুট AND গেটে গিয়ে Y দেয়।">
            <text x="4" y="27" text-anchor="start">A</text>
            <text x="4" y="44" text-anchor="start">B</text>
            <text x="4" y="61" text-anchor="start">C</text>
            <path class="w" d="M16 23H61M16 40H61M16 57H61M105 40H130"/>
            <path class="gb" d="M60 13H78A27 27 0 0 1 78 67H60Z"/>
            <foreignObject x="136" y="31" width="70" height="34" overflow="visible"><div class="flab">Y = ABC</div></foreignObject>
          </svg>
        </figure>
        <p class="prose">বারসহ এ প্রশ্নের প্রচলিত রূপ <span class="ov">A</span>BC + A<span class="ov">B</span>C + AB<span class="ov">C</span> + ABC হলে উত্তর AB + BC + CA; পুরো সমাধান ও সার্কিট ওপরের <a href="#/note/logic-gates/ex-majority">৬.২-এ</a>।</p>
        <h4 class="sub-h" id="pp5-3"><span>৫ম · ২০০৮</span><span>প্রশ্ন ৩: X = <span class="ov">A + B + <span class="ov">C</span></span>·(<span class="ov">B</span>C)</span></h4>
        <p class="prose">চাওয়া হয়েছে: সরল করে বর্তনী। ছাপায় শুরুর X-এর পরে “=” নেই, আর বন্ধনী এলোমেলো; রাশিটি X = <span class="ov">A + B + <span class="ov">C</span></span>·<span class="ov">B</span>C ধরা হলো। ৪র্থ পরীক্ষায় (প্রশ্ন ৪, অথবা) এই রাশিটিই <span class="ov">A</span>·<span class="ov">B</span>·C-এর সমান, তা সত্যক সারণিতে প্রমাণ করতে বলা হয়েছিল।</p>
        <ul class="eqs">
          <li><span>X = <span class="ov">A + B + <span class="ov">C</span></span>·<span class="ov">B</span>C</span><small>প্রশ্নের সমীকরণ</small></li>
          <li><span>= <span class="ov">A</span>·<span class="ov">B</span>·<span class="ov"><span class="ov">C</span></span>·<span class="ov">B</span>C</span><small>ডি মরগান: <span class="ov">X + Y + Z</span> = <span class="ov">X</span>·<span class="ov">Y</span>·<span class="ov">Z</span></small></li>
          <li><span>= <span class="ov">A</span>·<span class="ov">B</span>·C·<span class="ov">B</span>·C</span><small>দ্বৈত পূরক</small></li>
          <li><span>= <span class="ov">A</span>·<span class="ov">B</span>·C</span><small>X·X = X</small></li>
        </ul>
        <p class="final"><b>ফল</b>X = <span class="ov">A</span>·<span class="ov">B</span>·C</p>
        <figure class="fig eqfig">
          <svg viewBox="0 0 300 125" width="345" role="img" aria-label="লজিক সার্কিট: A একটি NOT দিয়ে A-বার, B একটি NOT দিয়ে B-বার; A-বার, B-বার ও C একটি তিন-ইনপুট AND-এ গিয়ে X দেয়।">
            <text x="4" y="34" text-anchor="start">A</text>
            <text x="4" y="74" text-anchor="start">B</text>
            <text x="4" y="114" text-anchor="start">C</text>
            <path class="w" d="M16 30H40M16 70H40M74 30H110V53H151M74 70H151M16 110H110V87H151M195 70H215"/>
            <path class="gb" d="M40 18L66 30L40 42Z"/><circle class="gb" cx="70" cy="30" r="4"/>
            <path class="gb" d="M40 58L66 70L40 82Z"/><circle class="gb" cx="70" cy="70" r="4"/>
            <path class="gb" d="M150 43H168A27 27 0 0 1 168 97H150Z"/>
            <foreignObject x="77" y="12" width="30" height="34" overflow="visible"><div class="flab"><span class="ov">A</span></div></foreignObject>
            <foreignObject x="77" y="52" width="30" height="34" overflow="visible"><div class="flab"><span class="ov">B</span></div></foreignObject>
            <foreignObject x="221" y="61" width="76" height="34" overflow="visible"><div class="flab">X = <span class="ov">A</span>·<span class="ov">B</span>·C</div></foreignObject>
          </svg>
        </figure>
        <p class="prose">সত্যক সারণিতে প্রমাণ (৪র্থ পরীক্ষা): শেষ দুই কলাম প্রতিটি সারিতে সমান।</p>

          <tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>

        </tbody></table>
        <h4 class="sub-h" id="pp5-3o"><span>৫ম · ২০০৮</span><span>প্রশ্ন ৩ (অথবা) ক: দুটি সরলীকরণ</span></h4>
        <p class="prose">চাওয়া হয়েছে শুধু বুলিয়ান অ্যালজেবরায় সরল করা, সার্কিট নয়।</p>
        <p class="prose">(i) <span class="ov">(M + <span class="ov">N</span>)(<span class="ov">M</span> + N)</span></p>
        <ul class="eqs">
          <li><span>Y = <span class="ov">(M + <span class="ov">N</span>)(<span class="ov">M</span> + N)</span></span><small>প্রশ্নের সমীকরণ</small></li>
          <li><span>= <span class="ov">M + <span class="ov">N</span></span> + <span class="ov"><span class="ov">M</span> + N</span></span><small>ডি মরগান: <span class="ov">X·Z</span> = <span class="ov">X</span> + <span class="ov">Z</span></small></li>
          <li><span>= <span class="ov">M</span>·N + M·<span class="ov">N</span></span><small>ডি মরগান, দ্বৈত পূরক</small></li>
        </ul>
        <p class="final"><b>ফল</b>Y = <span class="ov">M</span>N + M<span class="ov">N</span> = M ⊕ N (XOR)</p>
        <p class="prose">(ii) <span class="ov">(<span class="ov">A</span> + C)(B + <span class="ov">D</span>)</span></p>
        <ul class="eqs">
          <li><span>Y = <span class="ov">(<span class="ov">A</span> + C)(B + <span class="ov">D</span>)</span></span><small>প্রশ্নের সমীকরণ</small></li>
          <li><span>= <span class="ov"><span class="ov">A</span> + C</span> + <span class="ov">B + <span class="ov">D</span></span></span><small>ডি মরগান: <span class="ov">X·Z</span> = <span class="ov">X</span> + <span class="ov">Z</span></small></li>
          <li><span>= A·<span class="ov">C</span> + <span class="ov">B</span>·D</span><small>ডি মরগান, দ্বৈত পূরক</small></li>
        </ul>
        <p class="final"><b>ফল</b>Y = A<span class="ov">C</span> + <span class="ov">B</span>D</p>
        <h4 class="sub-h" id="pp5-4"><span>৫ম · ২০০৮</span><span>প্রশ্ন ৪: প্রমাণ <span class="ov">A</span>BC + A<span class="ov">B</span>C + AB<span class="ov">C</span> + ABC = AB + BC + CA</span></h4>
        <p class="prose">হুবহু ১৮তম পরীক্ষার ১০ নম্বর প্রশ্নের রাশি; ধাপে ধাপে প্রমাণ ওপরের <a href="#/note/logic-gates/ex-majority">৬.২-এ</a>। প্রমাণের প্রশ্নে শেষ লাইনে লিখুন: “বাম পক্ষ = ডান পক্ষ, প্রমাণিত।”</p>
        <h4 class="sub-h" id="pp4-4"><span>৪র্থ · ২০০৭</span><span>প্রশ্ন ৪: <span class="ov">A + <span class="ov">A</span>·<span class="ov">B</span></span>·AB + C</span></h4>
        <p class="prose">চাওয়া হয়েছে: বর্তনী। ছাপায় বন্ধনী মেলে না; বার A + <span class="ov">A</span>·<span class="ov">B</span>-এর ওপর ধরে রাশিটি Y = <span class="ov">A + <span class="ov">A</span>·<span class="ov">B</span></span>·AB + C পড়া হলো। বারসহ OR-এর জায়গায় একটি NOR গেট বসানো হয়েছে।</p>

          <li><span>= <span class="ov">A</span>·<span class="ov"><span class="ov">A</span>·<span class="ov">B</span></span>·AB + C</span><small>ডি মরগান: <span class="ov">X + Z</span> = <span class="ov">X</span>·<span class="ov">Z</span></small></li>
          <li><span>= (<span class="ov">A</span>·A)·<span class="ov"><span class="ov">A</span>·<span class="ov">B</span></span>·B + C</span><small>বিনিময়</small></li>
          <li><span>= 0 + C = C</span><small>X·<span class="ov">X</span> = 0</small></li>
        </ul>
        <p class="final"><b>সরল রূপ</b>Y = C</p>
        <p class="prose">সার্কিটের বাঁয়ের পুরো অংশের ফল সবসময় ০, কারণ সেখানে <span class="ov">A</span> আর A একসঙ্গে গুণ হয়। তাই আউটপুট শুধু C; সরল রূপে কোনো গেটই লাগে না, C-ই আউটপুট।</p>
        <h4 class="sub-h" id="pp3-4"><span>৩য় · ২০০৬</span><span>প্রশ্ন ৪: (A + B)<span class="ov">C</span> + <span class="ov">A</span>C</span></h4>
        <p class="prose">চাওয়া হয়েছে: লজিক গেট দিয়ে বাস্তবায়ন। লাগে দুটি NOT, দুটি OR আর দুটি AND।</p>

          <li><span>= A<span class="ov">C</span> + B<span class="ov">C</span> + <span class="ov">A</span>C</span><small>গুণ ছড়িয়ে</small></li>

        <p class="prose">এর চেয়ে কম পদে লেখা যায় না; প্রশ্নে শুধু বাস্তবায়ন চাওয়া, তাই সার্কিটটিই মূল উত্তর।</p>

        <h3 class="sub"><span>৬.৬</span>হাফ অ্যাডার ও ফুল অ্যাডার</h3>
        <p class="prose">কম্পিউটার যোগ করে লজিক গেট দিয়ে তৈরি যোগকারী বর্তনীতে। দুটি বিট যোগ করলে দুটি ফল আসে: যোগফল (Sum, S) আর হাতে থাকা (Carry)। যেমন বাইনারিতে 1 + 1 = 10: যোগফল 0, হাতে 1।</p>
        <h4 class="sub-h" id="half-adder"><span>ক</span>হাফ অ্যাডার (অর্ধযোগকারী)</h4>
        <p class="prose">দুটি বিট A ও B যোগ করে। যোগফল ১ হয় ঠিক একটি ইনপুট ১ হলে, তাই S = A ⊕ B; হাতে ১ থাকে দুটিই ১ হলে, তাই C = A·B। লাগে একটি XOR আর একটি AND।</p>

        <p class="prose">শেষ সারিতে 1 + 1 = 10: S = 0, C = 1। হাফ অ্যাডার আগের ঘর থেকে আসা ক্যারি নিতে পারে না, তাই একে “অর্ধেক” যোগকারী বলে।</p>
        <h4 class="sub-h" id="full-adder"><span>খ</span>ফুল অ্যাডার (পূর্ণযোগকারী)</h4>
        <p class="prose">তিনটি বিট যোগ করে: A, B আর আগের ঘর থেকে আসা ক্যারি C<sub>in</sub>। দুটি হাফ অ্যাডার আর একটি OR দিয়ে তৈরি: প্রথমটি A ও B যোগ করে, দ্বিতীয়টি তার যোগফলের সঙ্গে C<sub>in</sub> যোগ করে, আর দুটির ক্যারি OR-এ গিয়ে C<sub>out</sub> হয়। মোট দুটি XOR, দুটি AND আর একটি OR।</p>

        <p class="prose">S = ১ হয় বিজোড় সংখ্যক ইনপুট ১ হলে; C<sub>out</sub> = ১ হয় অন্তত দুটি ইনপুট ১ হলে। তাই C<sub>out</sub> = AB + BC<sub>in</sub> + C<sub>in</sub>A, যা ৬.২-এর সংখ্যাগরিষ্ঠ রাশি AB + BC + CA-ই (C-এর জায়গায় C<sub>in</sub>)।</p>
        <p class="prose">কম্পিউটারের ALU-র যোগের অংশে এমন ফুল অ্যাডার পরপর জোড়া থাকে: ৮ বিট যোগে ৮টি, প্রতিটির C<sub>out</sub> পরেরটির C<sub>in</sub>। ALU-র কাজ দেখুন <a href="#/note/computer-basics/org">অধ্যায় ১ · সংগঠন, CPU ও ALU</a> অংশে।</p>
        <p class="tip"><b>MCQ-তে মনে রাখুন:</b> হাফ অ্যাডারে একটি XOR ও একটি AND; ফুল অ্যাডারে দুটি হাফ অ্যাডার ও একটি OR। যোগফলের জন্য XOR, ক্যারির জন্য AND।</p>

        <div class="fixes">
          <div class="fix"><p class="was">বুলিয়ান যোগে 1 + 1 = 10</p><p class="is">বুলিয়ান যোগে 1 + 1 = 1</p><p class="why">10 হয় বাইনারি যোগে; বুলিয়ান যোগ মানে OR।</p></div>
          <div class="fix"><p class="was"><span class="ov">A + B</span> = <span class="ov">A</span> + <span class="ov">B</span></p><p class="is"><span class="ov">A + B</span> = <span class="ov">A</span>·<span class="ov">B</span></p><p class="why">বার ভাঙলে চিহ্নও বদলায় (ডি মরগান)।</p></div>
          <div class="fix"><p class="was"><span class="ov">AB</span> = <span class="ov">A</span>·<span class="ov">B</span></p><p class="is"><span class="ov">AB</span> = <span class="ov">A</span> + <span class="ov">B</span></p><p class="why">A = 1, B = 0 বসান: বাঁ পাশ ১, কিন্তু <span class="ov">A</span>·<span class="ov">B</span> = ০।</p></div>
          <div class="fix"><p class="was">NOR একটি মৌলিক গেট</p><p class="is">NOR যৌগিক গেট (OR + NOT), তবে সার্বজনীন</p><p class="why">মৌলিক গেট মাত্র তিনটি: AND, OR ও NOT।</p></div>
          <div class="fix"><p class="was">তিন চলকে সত্যক সারণির সারি ৬টি</p><p class="is">২<sup>৩</sup> = ৮টি</p><p class="why">সারির সংখ্যা ২<sup>n</sup>, ২n নয়।</p></div>
          <div class="fix"><p class="was">A + AB = AB</p><p class="is">A + AB = A</p><p class="why">A(1 + B) = A·1 = A (শোষণ সূত্র)।</p></div>
          <div class="fix"><p class="was">XOR-এ দুই ইনপুট ১ হলে আউটপুট ১</p><p class="is">দুটিই ১ হলে আউটপুট ০</p><p class="why">XOR ১ দেয় শুধু ইনপুট ভিন্ন হলে।</p></div>
          <div class="fix"><p class="was">AB + <span class="ov">A</span>·<span class="ov">B</span> = A ⊕ B</p><p class="is">AB + <span class="ov">A</span>·<span class="ov">B</span> = A ⊙ B (XNOR)</p><p class="why">⊕ হলো XOR-এর চিহ্ন; XNOR লিখতে ⊙, বা A ⊕ B-এর ওপর বার।</p></div>
        </div>

      <li>প্রোগ্রাম লেখা হতো সরাসরি যান্ত্রিক ভাষায় (০ ও ১ দিয়ে); গতি মিলিসেকেন্ড পর্যায়ের।</li>
      <li><b>উদাহরণ:</b> ENIAC, EDVAC, UNIVAC-I, IBM 650।</li>
    </ul>

    <h4 class="sub-h"><span>২</span>দ্বিতীয় প্রজন্ম (১৯৫৯–১৯৬৫): ট্রানজিস্টর</h4>

      <li>ভ্যাকুয়াম টিউবের চেয়ে আকারে ছোট, বিদ্যুৎ ও তাপ কম, নির্ভরযোগ্যতা বেশি।</li>
      <li>প্রধান স্মৃতি চৌম্বক কোর; সহায়ক স্মৃতি হিসেবে চৌম্বক টেপ ও ডিস্কের ব্যবহার।</li>
      <li>অ্যাসেম্বলি ভাষা এবং FORTRAN, COBOL-এর মতো উচ্চস্তরের ভাষার ব্যবহার শুরু; গতি মাইক্রোসেকেন্ড পর্যায়ের।</li>
      <li><b>উদাহরণ:</b> IBM 1401, IBM 1620, CDC 1604।</li>
    </ul>

    <h4 class="sub-h"><span>৩</span>তৃতীয় প্রজন্ম (১৯৬৫–১৯৭১): ইন্টিগ্রেটেড সার্কিট</h4>
    <ul class="pts">
      <li>মূল উপাদান ইন্টিগ্রেটেড সার্কিট (IC): একটি সিলিকন চিপে অনেকগুলো ট্রানজিস্টর (SSI ও MSI প্রযুক্তি)।</li>
      <li>আকার, দাম ও বিদ্যুৎ খরচ আরও কমে; গতি ও নির্ভরযোগ্যতা বাড়ে, গতি ন্যানোসেকেন্ড পর্যায়ের।</li>
      <li>কিবোর্ড ও মনিটর দিয়ে কাজ শুরু; অপারেটিং সিস্টেম, মাল্টিপ্রোগ্রামিং ও টাইম শেয়ারিং চালু হয়।</li>

      <li><b>উদাহরণ:</b> IBM System/360, IBM 370, PDP-11।</li>
    </ul>

    <h4 class="sub-h"><span>৪</span>চতুর্থ প্রজন্ম (১৯৭১–বর্তমান): মাইক্রোপ্রসেসর</h4>

      <li>মাউস, গ্রাফিক্যাল ইউজার ইন্টারফেস (GUI), নেটওয়ার্ক ও ইন্টারনেটের প্রসার; গতি পিকোসেকেন্ড পর্যায়ের।</li>
      <li><b>উদাহরণ:</b> IBM PC, Apple Macintosh, আজকের ডেস্কটপ ও ল্যাপটপ।</li>
    </ul>

    <h4 class="sub-h"><span>৫</span>পঞ্চম প্রজন্ম (বর্তমান ও ভবিষ্যৎ): কৃত্রিম বুদ্ধিমত্তা</h4>
    <ul class="pts">
      <li>লক্ষ্য কৃত্রিম বুদ্ধিমত্তা (AI): যন্ত্র নিজে শিখবে, যুক্তি দিয়ে সিদ্ধান্ত নেবে। ১৯৮২ সালে জাপানের “পঞ্চম প্রজন্মের কম্পিউটার” প্রকল্প এ ধারণা সামনে আনে।</li>
      <li>ULSI প্রযুক্তি ও সমান্তরাল প্রক্রিয়াকরণ (parallel processing): একসঙ্গে অনেক প্রসেসর একটি কাজ ভাগাভাগি করে শেষ করে।</li>
      <li>মানুষের স্বাভাবিক ভাষা, কণ্ঠস্বর ও ছবি বুঝতে পারা।</li>
      <li>বিশেষজ্ঞ ব্যবস্থা (Expert System) ও রোবটিক্স; কোয়ান্টাম ও অপটিক্যাল কম্পিউটিং নিয়ে গবেষণা চলছে।</li>
      <li><b>উদাহরণ:</b> IBM Watson, কৃত্রিম বুদ্ধিমত্তাভিত্তিক রোবট ও ভয়েস সহকারী।</li>
    </ul>

  <p class="split-note">প্রশ্নে নম্বর ভাগ করা নেই। ALU-র পরিচয়ে ২ আর চিত্রসহ কর্মপদ্ধতিতে ৮ ধরে লিখলে উত্তর গোছানো হয়।</p>
  <section class="part">
    <h3 class="part-h"><span>ALU কী</span><i class="bub mk" title="প্রস্তাবিত নম্বর">২</i></h3>
    <p class="defn"><b>সংজ্ঞা</b>ALU (Arithmetic Logic Unit) হলো CPU-র সেই অংশ, যা সব গাণিতিক কাজ (যোগ, বিয়োগ, গুণ, ভাগ) এবং যৌক্তিক কাজ (তুলনা, AND, OR, NOT) সম্পন্ন করে। বাংলায় একে গাণিতিক যুক্তি অংশ বলে।</p>
    <p class="prose">CPU-র তিনটি অংশ: নিয়ন্ত্রণ অংশ (CU), ALU ও রেজিস্টার। কোন কাজ হবে তা ঠিক করে CU, আর হিসাবটি আসলে করে ALU। কম্পিউটারের সব প্রক্রিয়াকরণ শেষ পর্যন্ত ALU-র এই যোগ, তুলনা আর যৌক্তিক কাজে ভেঙে যায়।</p>
  </section>

  <section class="part">
    <h3 class="part-h"><span>ALU-র কর্মপদ্ধতি</span><i class="bub mk" title="প্রস্তাবিত নম্বর">৮</i></h3>
    <h4 class="sub-h"><span>১</span>ALU-র অংশ</h4>
    <ul class="pts">
      <li><b>গাণিতিক অংশ (Arithmetic Unit):</b> অ্যাডার সার্কিট দিয়ে যোগ করে। বিয়োগ হয় ২-এর পরিপূরক যোগের মাধ্যমে, গুণ হয় বারবার যোগ ও শিফট করে, ভাগ হয় বারবার বিয়োগ ও শিফট করে।</li>
      <li><b>যৌক্তিক অংশ (Logic Unit):</b> দুটি ডেটা তুলনা করে (সমান, বড় না ছোট) এবং AND, OR, NOT, XOR-এর মতো যৌক্তিক কাজ করে। এর ফলেই প্রোগ্রাম শর্ত দেখে সিদ্ধান্ত নিতে পারে।</li>
      <li><b>রেজিস্টার:</b> কাজের সময় ডেটা ও ফল রাখার অতি দ্রুত অস্থায়ী স্মৃতি। ইনপুট রেজিস্টারে থাকে যে ডেটার ওপর কাজ হবে (অপারেন্ড), আর অ্যাকুমুলেটরে জমা হয় ফল।</li>
      <li><b>ফ্ল্যাগ বা স্ট্যাটাস রেজিস্টার:</b> ফলের ধরন জানায়। Z: ফল শূন্য, C: ক্যারি হয়েছে, S: ফল ঋণাত্মক, V: ওভারফ্লো।</li>
    </ul>

    <figure class="fig flow wide alu">
      <svg viewBox="0 0 460 330" role="img" aria-label="ALU-র কার্যপ্রবাহ: প্রধান স্মৃতি থেকে নির্দেশ যায় নিয়ন্ত্রণ অংশে, আর ডেটা যায় রেজিস্টার A ও B-তে। নিয়ন্ত্রণ অংশ সংকেত দিয়ে ALU-কে কাজ বেছে দেয়। ALU দুই রেজিস্টারের ডেটার ওপর কাজ করে ফল পাঠায় অ্যাকুমুলেটরে, আর ফলের ধরন জানায় ফ্ল্যাগ রেজিস্টারে। অ্যাকুমুলেটর থেকে ফল আবার স্মৃতিতে যায়।">

    </figure>

    <h4 class="sub-h"><span>২</span>কাজের ধাপ</h4>
    <ol class="algo">
      <li>নিয়ন্ত্রণ অংশ প্রধান স্মৃতি থেকে নির্দেশ এনে ডিকোড করে বোঝে কোন কাজ করতে হবে, যেমন ADD (যোগ)।</li>
      <li>যে ডেটার ওপর কাজ হবে, তা স্মৃতি থেকে এনে রেজিস্টার A ও B-তে রাখা হয়।</li>
      <li>নিয়ন্ত্রণ অংশ সংকেত পাঠিয়ে ALU-র সঠিক সার্কিটটি (যেমন অ্যাডার) চালু করে।</li>
      <li>ALU দুই রেজিস্টারের ডেটার ওপর কাজটি করে।</li>
      <li>ফল জমা হয় অ্যাকুমুলেটরে, আর ফলের ধরন অনুযায়ী ফ্ল্যাগগুলো ০ বা ১ হয়।</li>
      <li>নিয়ন্ত্রণ অংশের নির্দেশে ফল স্মৃতিতে পাঠানো হয়, অথবা পরের কাজে সরাসরি ব্যবহার হয়।</li>
    </ol>

    <h4 class="sub-h"><span>৩</span>উদাহরণ: ৫ + ৩</h4>
    <div class="bcalc">
      <code>  0000 0101</code><span>রেজিস্টার A = ৫</span>
      <code class="add">+ 0000 0011</code><span>রেজিস্টার B = ৩</span>
      <code class="res">  0000 1000</code><span>অ্যাকুমুলেটর = <b>৮</b></span>
    </div>
    <p class="prose">ফল শূন্য নয়, তাই Z = 0; শেষে ক্যারি নেই, তাই C = 0; চিহ্ন বিট ০, তাই S = 0।</p>
    <p class="prose">তুলনাও একই পথে হয়। ৫ ও ৩-এর মধ্যে কোনটি বড় জানতে ALU 5 − 3 হিসাব করে, ফলটি রাখে না, শুধু ফ্ল্যাগ দেখে: Z = 0, তাই সংখ্যা দুটি সমান নয়; S = 0, তাই ৫ &gt; ৩। প্রোগ্রামের if-else শর্ত এভাবেই কাজ করে।</p>
  </section>
</div>
<aside class="side">
  <p><b>নম্বর পেতে</b>চিত্রই এই প্রশ্নের প্রাণ। স্মৃতি, CU, দুই রেজিস্টার, ALU, অ্যাকুমুলেটর ও ফ্ল্যাগ তীর দিয়ে জুড়ে আঁকুন, আর তীরের পাশে লিখুন কী যাচ্ছে।</p>
  <p><b>মনে রাখুন</b>CPU = CU + ALU + রেজিস্টার। ALU নিজে কিছু ঠিক করে না; CU যা বলে, তা-ই করে।</p>

<template id="wa-18-school-4">
<div class="ans-body">
  <section class="part">
    <h3 class="part-h"><span>মৌলিক গেইট</span><i class="bub mk">২</i></h3>
    <p class="defn"><b>সংজ্ঞা</b>বুলিয়ান অ্যালজেবরার তিনটি মৌলিক অপারেশন (যৌক্তিক গুণ, যৌক্তিক যোগ ও পূরক) যে তিনটি গেইট দিয়ে সম্পন্ন হয়, সেগুলোকে মৌলিক গেইট বলে। মৌলিক গেইট তিনটি: AND, OR ও NOT।</p>
    <table class="rt cmp">
      <thead><tr><th>গেইট</th><th>অভিব্যক্তি</th><th>কাজ</th></tr></thead>
      <tbody>
        <tr><td>AND</td><td class="m">Y = A·B</td><td>সব ইনপুট ১ হলে আউটপুট ১</td></tr>
        <tr><td>OR</td><td class="m">Y = A + B</td><td>যেকোনো একটি ইনপুট ১ হলেই আউটপুট ১</td></tr>
        <tr><td>NOT</td><td class="m">Y = <span class="ov">A</span></td><td>ইনপুটের বিপরীত আউটপুট</td></tr>
      </tbody>
    </table>
  </section>

  <section class="part">
    <h3 class="part-h"><span>NAND কেন সার্বজনীন গেইট</span><i class="bub mk">৪</i></h3>
    <p class="prose">যে গেইট দিয়ে তিনটি মৌলিক গেইটই (AND, OR, NOT) তৈরি করা যায়, তাকে সার্বজনীন গেইট বলে। AND গেইটের পরে NOT যুক্ত করলে NAND গেইট হয়: Y = <span class="m"><span class="ov">A·B</span></span>।</p>
    <div class="gates">
      <figure class="fig gate-sym"><svg viewBox="0 0 150 64" role="img" aria-label="NAND গেইটের প্রতীক"><text x="0" y="24" text-anchor="start">A</text><path class="w" d="M12 20 L40 20"/><text x="0" y="44" text-anchor="start">B</text><path class="w" d="M12 40 L40 40"/><path class="gb" d="M40 10H58A20 20 0 0 1 58 50H40Z"/><circle class="gb" cx="82" cy="30" r="4"/><path class="w" d="M86 30 L118 30"/><text x="122" y="34" text-anchor="start">Y</text></svg><figcaption>NAND গেইটের প্রতীক</figcaption></figure>

    </div>
    <ul class="pts">
      <li><b>NOT:</b> দুই ইনপুট একসঙ্গে জুড়ে দিলে <span class="m"><span class="ov">A·A</span> = <span class="ov">A</span></span></li>
      <li><b>AND:</b> NAND-এর আউটপুটকে আরেকটি NAND দিয়ে উল্টে দিলে <span class="m"><span class="ov"><span class="ov">A·B</span></span> = A·B</span></li>
      <li><b>OR:</b> দুই ইনপুটকে আগে উল্টে NAND-এ দিলে <span class="m"><span class="ov"><span class="ov">A</span>·<span class="ov">B</span></span> = A + B</span> (ডি মরগানের সূত্র)</li>
    </ul>

      <figcaption>চিত্র ১: শুধু NAND দিয়ে NOT, AND ও OR</figcaption></figure>
    <p class="prose">যেহেতু শুধু NAND দিয়েই তিনটি মৌলিক গেইট তৈরি করা যায়, তাই NAND সার্বজনীন গেইট।</p>
  </section>

  <section class="part">
    <h3 class="part-h"><span>NOR কেন সার্বজনীন গেইট</span><i class="bub mk">৪</i></h3>
    <p class="prose">OR গেইটের পরে NOT যুক্ত করলে NOR গেইট হয়: Y = <span class="m"><span class="ov">A + B</span></span>।</p>
    <div class="gates">
      <figure class="fig gate-sym"><svg viewBox="0 0 150 64" role="img" aria-label="NOR গেইটের প্রতীক"><text x="0" y="24" text-anchor="start">A</text><path class="w" d="M12 20 L45 20"/><text x="0" y="44" text-anchor="start">B</text><path class="w" d="M12 40 L45 40"/><path class="gb" d="M40 10Q54 30 40 50Q66 50 78 30Q66 10 40 10Z"/><circle class="gb" cx="82" cy="30" r="4"/><path class="w" d="M86 30 L118 30"/><text x="122" y="34" text-anchor="start">Y</text></svg><figcaption>NOR গেইটের প্রতীক</figcaption></figure>
      <table class="truth"><thead><tr><th>A</th><th>B</th><th>Y</th></tr></thead><tbody><tr><td>0</td><td>0</td><td>1</td></tr><tr><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>0</td><td>0</td></tr><tr><td>1</td><td>1</td><td>0</td></tr></tbody></table>
    </div>
    <ul class="pts">
      <li><b>NOT:</b> দুই ইনপুট একসঙ্গে জুড়ে দিলে <span class="m"><span class="ov">A + A</span> = <span class="ov">A</span></span></li>
      <li><b>OR:</b> NOR-এর আউটপুট আরেকটি NOR দিয়ে উল্টে দিলে <span class="m"><span class="ov"><span class="ov">A + B</span></span> = A + B</span></li>
      <li><b>AND:</b> দুই ইনপুটকে আগে উল্টে NOR-এ দিলে <span class="m"><span class="ov"><span class="ov">A</span> + <span class="ov">B</span></span> = A·B</span> (ডি মরগানের সূত্র)</li>
    </ul>

/><circle class="gb" cx="506" cy="110" r="4"/><path class="w" d="M510 40 L526 40 L526 65 L547 65"/><text x="514" y="33" text-anchor="start"><tspan text-decoration="overline">A</tspan></text><path class="w" d="M510 110 L526 110 L526 85 L547 85"/><text x="514" y="127" text-anchor="start"><tspan text-decoration="overline">B</tspan></text><path class="gb" d="M542 55Q556 75 542 95Q568 95 580 75Q568 55 542 55Z"/><circle class="gb" cx="584" cy="75" r="4"/><path class="w" d="M588 75 L606 75"/><text x="611" y="79" text-anchor="start">A·B</text><text class="cap" x="530" y="146" text-anchor="middle">AND</text></svg>

    <p class="prose">শুধু NOR দিয়েও তিনটি মৌলিক গেইট তৈরি করা যায়, তাই NOR-ও সার্বজনীন গেইট।</p>
  </section>

<aside class="side">
  <p><b>নম্বর পেতে</b>প্রতীক আঁকুন, সত্যক সারণি দিন, তারপর তিনটি মৌলিক গেইট শুধু NAND (বা NOR) দিয়ে এঁকে দেখান। ৪ নম্বরের বেশিটাই চিত্রে।</p>
  <p><b>মনে রাখুন</b>OR তৈরিতে NAND লাগে তিনটি, AND তৈরিতে দুটি, NOT তৈরিতে একটি। NOR-এর বেলায় উল্টো: AND-এ তিনটি, OR-এ দুটি।</p>

<template id="wa-18-school-5">
<div class="ans-body">

    <h3 class="part-h"><span>২-এর পরিপূরক পদ্ধতি</span><i class="bub mk">২</i></h3>
    <p class="defn"><b>সংজ্ঞা</b>কোনো বাইনারি সংখ্যার প্রতিটি বিট উল্টে দিয়ে (১-এর পরিপূরক) তার সঙ্গে ১ যোগ করলে যে সংখ্যা পাওয়া যায়, তাকে ঐ সংখ্যার ২-এর পরিপূরক বলে।</p>
    <p class="prose">কম্পিউটার এ পদ্ধতিতে ঋণাত্মক সংখ্যা প্রকাশ করে, আর বিয়োগকে যোগে পরিণত করে একই যোগ-সার্কিটে বিয়োগ করে। সবচেয়ে বাঁয়ের বিটটি চিহ্ন বিট: ০ হলে সংখ্যা ধনাত্মক, ১ হলে ঋণাত্মক।</p>
  </section>

  <section class="part">
    <h3 class="part-h"><span>(−১৫)<sub>১০</sub> থেকে (+১১)<sub>১০</sub> বিয়োগ</span><i class="bub mk">৮</i></h3>
    <p class="prose">(−১৫) − (+১১) = (−১৫) + (−১১)। তাই −১৫ ও −১১-কে ২-এর পরিপূরকে প্রকাশ করে যোগ করব। ৮ বিট ধরা হলো।</p>

    <h4 class="sub-h"><span>ধাপ ১</span>−১৫ নির্ণয়</h4>
    <div class="bcalc">
      <code>0000 1111</code><span>(+১৫)<sub>১০</sub></span>
      <code>1111 0000</code><span>সব বিট উল্টে (১-এর পরিপূরক)</span>
      <code class="add">+         1</code><span>১ যোগ</span>
      <code class="res">1111 0001</code><span><b>−১৫</b> (২-এর পরিপূরক)</span>
    </div>

    <h4 class="sub-h"><span>ধাপ ২</span>−১১ নির্ণয়</h4>
    <div class="bcalc">
      <code>0000 1011</code><span>(+১১)<sub>১০</sub></span>
      <code>1111 0100</code><span>সব বিট উল্টে (১-এর পরিপূরক)</span>
      <code class="add">+         1</code><span>১ যোগ</span>
      <code class="res">1111 0101</code><span><b>−১১</b> (২-এর পরিপূরক)</span>
    </div>

    <h4 class="sub-h"><span>ধাপ ৩</span>যোগ</h4>
    <div class="bcalc">
      <code>  1111 0001</code><span>−১৫</span>
      <code class="add">+ 1111 0101</code><span>−১১</span>
      <code class="res"><i class="carry" title="শেষ ক্যারি">1</i> 1110 0110</code><span>শেষ ক্যারি <i class="carry">1</i> বাদ দিলে <b>1110 0110</b></span>
    </div>

    <h4 class="sub-h"><span>ধাপ ৪</span>ফল পড়া</h4>
    <p class="prose">চিহ্ন বিট ১, তাই ফল ঋণাত্মক। মান জানতে আবার ২-এর পরিপূরক নিই:</p>
    <div class="bcalc">
      <code>1110 0110</code><span>ফল</span>
      <code>0001 1001</code><span>সব বিট উল্টে</span>
      <code class="add">+         1</code><span>১ যোগ</span>
      <code class="res">0001 1010</code><span>= (২৬)<sub>১০</sub></span>
    </div>
    <p class="final"><b>উত্তর</b>(−১৫)<sub>১০</sub> − (+১১)<sub>১০</sub> = (−২৬)<sub>১০</sub> = (1110 0110)<sub>২</sub></p>
  </section>
</div>
<aside class="side">
  <p><b>প্রথম লাইনেই</b>কত বিট ধরছেন লিখে দিন (এখানে ৮ বিট)।</p>
  <p><b>নম্বর কাটে যেখানে</b>শেষ ক্যারি বাদ দেওয়ার কথা না লিখলে, আর ফল ঋণাত্মক হলে তার মান না দেখালে।</p>
  <p><b>যাচাই</b>শেষে এক লাইনে লিখুন: −১৫ − ১১ = −২৬।</p>

</aside>

  <section class="part">
    <h3 class="part-h"><span>সরলীকরণ ও NAND দিয়ে বাস্তবায়ন</span><i class="bub mk">৫</i></h3>
    <h4 class="sub-h"><span>ধাপ ১</span>সমীকরণের সরলীকরণ</h4>
    <ul class="eqs">
      <li><span>X = <span class="ov">A</span>BC + A<span class="ov">B</span>C + AB<span class="ov">C</span> + ABC</span></li>
      <li><span>= <span class="ov">A</span>BC + A<span class="ov">B</span>C + AB<span class="ov">C</span> + ABC + ABC + ABC</span><small>ABC + ABC = ABC, তাই ABC আরও দুবার লেখা যায়</small></li>
      <li><span>= (<span class="ov">A</span>BC + ABC) + (A<span class="ov">B</span>C + ABC) + (AB<span class="ov">C</span> + ABC)</span><small>জোড়ায় সাজিয়ে</small></li>
      <li><span>= BC(<span class="ov">A</span> + A) + AC(<span class="ov">B</span> + B) + AB(<span class="ov">C</span> + C)</span><small>সাধারণ উৎপাদক বের করে</small></li>
      <li><span>= BC + AC + AB</span><small><span class="ov">A</span> + A = 1</small></li>
    </ul>
    <p class="final"><b>সরলীকৃত মান</b>X = AB + BC + CA</p>

    <h4 class="sub-h"><span>যাচাই</span>সত্যক সারণি</h4>
    <table class="truth">
      <thead><tr><th>A</th><th>B</th><th>C</th><th>X</th></tr></thead>
      <tbody><tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>0</td><td>1</td><td>0</td></tr><tr><td>0</td><td>1</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>0</td><td>0</td></tr><tr><td>1</td><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>1</td><td>1</td></tr></tbody>
    </table>
    <p class="prose">যেকোনো দুটি বা তিনটি ইনপুট ১ হলেই X = ১; প্রশ্নের চারটি পদও ঠিক এই চারটি সারি। AB + BC + CA এ কথাই বলে, তাই একে সংখ্যাগরিষ্ঠ (majority) ফাংশনও বলে।</p>

    <h4 class="sub-h"><span>ধাপ ২</span>NAND রূপ</h4>
    <ul class="eqs">
      <li><span>X = AB + BC + CA</span></li>
      <li><span>= <span class="ov"><span class="ov">AB + BC + CA</span></span></span><small>দুবার পূরক নিলে মান বদলায় না</small></li>
      <li><span>= <span class="ov"><span class="ov">AB</span> · <span class="ov">BC</span> · <span class="ov">CA</span></span></span><small>ডি মরগানের সূত্র</small></li>
    </ul>
    <p class="prose">প্রতিটি <span class="m"><span class="ov">AB</span></span> একটি ২-ইনপুট NAND গেইটের আউটপুট, আর বাইরের বারটি তিনটি আউটপুটকে একটি ৩-ইনপুট NAND গেইটে নেয়। মোট ৪টি NAND গেইট লাগে।</p>
    <figure class="fig wide mid"><svg viewBox="0 0 520 240" role="img" aria-label="শুধু NAND গেইট দিয়ে X: A ও B, B ও C, C ও A তিনটি ২-ইনপুট NAND গেইটে যায়; তাদের তিনটি আউটপুট একটি ৩-ইনপুট NAND গেইটে গিয়ে X দেয়।"><text x="52" y="18" text-anchor="middle">A</text><path class="w" d="M52 26 L52 206"/><text x="82" y="18" text-anchor="middle">B</text><path class="w" d="M82 26 L82 206"/><text x="112" y="18" text-anchor="middle">C</text><path class="w" d="M112 26 L112 206"/><path class="w" d="M52 40 L190 40"/><circle class="j" cx="52" cy="40" r="2.6"/><path class="w" d="M82 60 L190 60"/><circle class="j" cx="82" cy="60" r="2.6"/><path class="gb" d="M190 30H208A20 20 0 0 1 208 70H190Z"/><circle class="gb" cx="232" cy="50" r="4"/><path class="w" d="M82 110 L190 110"/><circle class="j" cx="82" cy="110" r="2.6"/><path class="w" d="M112 130 L190 130"/><circle class="j" cx="112" cy="130" r="2.6"/><path class="gb" d="M190 100H208A20 20 0 0 1 208 140H190Z"/><circle class="gb" cx="232" cy="120" r="4"/><path class="w" d="M112 180 L190 180"/><circle class="j" cx="112" cy="180" r="2.6"/><path class="w" d="M52 200 L190 200"/><circle class="j" cx="52" cy="200" r="2.6"/><path class="gb" d="M190 170H208A20 20 0 0 1 208 210H190Z"/><circle class="gb" cx="232" cy="190" r="4"/><path class="w" d="M236 50 L330 50 L330 104 L380 104"/><text x="244" y="43" text-anchor="start"><tspan text-decoration="overline">AB</tspan></text><path class="w" d="M236 120 L380 120"/><text x="244" y="113" text-anchor="start"><tspan text-decoration="overline">BC</tspan></text><path class="w" d="M236 190 L330 190 L330 136 L380 136"/><text x="244" y="183" text-anchor="start"><tspan text-decoration="overline">CA</tspan></text><path class="gb" d="M380 90H398A30 30 0 0 1 398 150H380Z"/><circle class="gb" cx="432" cy="120" r="4"/><path class="w" d="M436 120 L468 120"/><text x="474" y="125" text-anchor="start">X</text><text class="cap" x="211" y="232" text-anchor="middle">২-ইনপুট NAND × ৩</text><text class="cap" x="405" y="232" text-anchor="middle">৩-ইনপুট NAND</text></svg>

  <section class="part">
    <h3 class="part-h"><span>NOR দিয়ে বাস্তবায়ন</span><i class="bub mk">৫</i></h3>
    <p class="prose">NOR দিয়ে সরাসরি বাস্তবায়নের জন্য X-কে যোগফলের গুণ (POS) রূপে আনতে হয়।</p>
    <h4 class="sub-h"><span>ধাপ ১</span>POS রূপ</h4>
    <ul class="eqs">
      <li><span>(A + B)(C + A) = A + BC</span><small>বণ্টন সূত্র</small></li>
      <li><span>∴ (A + B)(B + C)(C + A) = (A + BC)(B + C)</span></li>
      <li><span>= AB + AC + BC + BC</span></li>
      <li><span>= AB + BC + CA = X</span><small>BC + BC = BC</small></li>
    </ul>
    <p class="final"><b>POS রূপ</b>X = (A + B)(B + C)(C + A)</p>

    <h4 class="sub-h"><span>ধাপ ২</span>NOR রূপ</h4>
    <ul class="eqs">
      <li><span>X = (A + B)(B + C)(C + A)</span></li>
      <li><span>= <span class="ov"><span class="ov">(A + B)(B + C)(C + A)</span></span></span><small>দুবার পূরক</small></li>
      <li><span>= <span class="ov"><span class="ov">A + B</span> + <span class="ov">B + C</span> + <span class="ov">C + A</span></span></span><small>ডি মরগানের সূত্র</small></li>
    </ul>
    <p class="prose">প্রতিটি <span class="m"><span class="ov">A + B</span></span> একটি ২-ইনপুট NOR গেইটের আউটপুট, আর বাইরের বারটি তিনটি আউটপুটকে একটি ৩-ইনপুট NOR গেইটে নেয়। এখানেও মোট ৪টি গেইট।</p>
    <figure class="fig wide mid"><svg viewBox="0 0 520 240" role="img" aria-label="শুধু NOR গেইট দিয়ে X: A ও B, B ও C, C ও A তিনটি ২-ইনপুট NOR গেইটে যায়; তাদের তিনটি আউটপুট একটি ৩-ইনপুট NOR গেইটে গিয়ে X দেয়।"><text x="52" y="18" text-anchor="middle">A</text><path class="w" d="M52 26 L52 206"/><text x="82" y="18" text-anchor="middle">B</text><path class="w" d="M82 26 L82 206"/><text x="112" y="18" text-anchor="middle">C</text><path class="w" d="M112 26 L112 206"/><path class="w" d="M52 40 L200 40"/><circle class="j" cx="52" cy="40" r="2.6"/><path class="w" d="M82 60 L200 60"/><circle class="j" cx="82" cy="60" r="2.6"/><path class="gb" d="M190 30Q204 50 190 70Q216 70 228 50Q216 30 190 30Z"/><circle class="gb" cx="232" cy="50" r="4"/><path class="w" d="M82 110 L200 110"/><circle class="j" cx="82" cy="110" r="2.6"/><path class="w" d="M112 130 L200 130"/><circle class="j" cx="112" cy="130" r="2.6"/><path class="gb" d="M190 100Q204 120 190 140Q216 140 228 120Q216 100 190 100Z"/><circle class="gb" cx="232" cy="120" r="4"/><path class="w" d="M112 180 L200 180"/><circle class="j" cx="112" cy="180" r="2.6"/><path class="w" d="M52 200 L200 200"/><circle class="j" cx="52" cy="200" r="2.6"/><path class="gb" d="M190 170Q204 190 190 210Q216 210 228 190Q216 170 190 170Z"/><circle class="gb" cx="232" cy="190" r="4"/><path class="w" d="M236 50 L330 50 L330 104 L391 104"/><text x="244" y="43" text-anchor="start"><tspan text-decoration="overline">A+B</tspan></text><path class="w" d="M236 120 L394 120"/><text x="244" y="113" text-anchor="start"><tspan text-decoration="overline">B+C</tspan></text><path class="w" d="M236 190 L330 190 L330 136 L391 136"/><text x="244" y="183" text-anchor="start"><tspan text-decoration="overline">C+A</tspan></text><path class="gb" d="M380 90Q398 120 380 150Q414 150 430 120Q414 90 380 90Z"/><circle class="gb" cx="434" cy="120" r="4"/><path class="w" d="M438 120 L470 120"/><text x="476" y="125" text-anchor="start">X</text><text class="cap" x="211" y="232" text-anchor="middle">২-ইনপুট NOR × ৩</text><text class="cap" x="405" y="232" text-anchor="middle">৩-ইনপুট NOR</text></svg>
      <figcaption>চিত্র ২: শুধু NOR গেইট দিয়ে X = (A + B)(B + C)(C + A)</figcaption></figure>
  </section>

<aside class="side">
  <p><b>নম্বর পেতে</b>সরলীকরণের প্রতিটি লাইনের পাশে কোন সূত্র লাগালেন লিখুন। চিত্রে প্রতিটি গেইটের আউটপুটের নাম (যেমন <span class="ov">AB</span>) লিখে দিন।</p>
  <p><b>মনে রাখুন</b>SOP রূপ থেকে NAND-NAND, POS রূপ থেকে NOR-NOR। দুই ক্ষেত্রেই দুই স্তর, ৪টি গেইট।</p>
